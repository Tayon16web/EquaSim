              <input type="range" id="sdEye" min="1" max="8" step="0.1" value="4">
            </div>
            <div class="sim-slider-group" id="grpL">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">L</span> — distance to object</span>
                <span class="sl-val" id="lL">20.0 m</span>
              </div>
              <input type="range" id="sL" min="0.5" max="1000" step="0.5" value="20">
            </div>
            <div class="sim-slider-group" id="grpDsep">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">D</span> — separation between the two points</span>
                <span class="sl-val" id="lDsep">3.355 mm</span>
              </div>
              <input type="range" id="sDsep" min="0.1" max="20" step="0.05" value="3.355">
            </div>

            <div class="sim-slider-group" id="grpScopeD" style="display:none;">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">d</span> — telescope aperture diameter</span>
                <span class="sl-val" id="ldScope">0.50 m</span>
              </div>
              <input type="range" id="sdScope" min="0.05" max="10" step="0.05" value="0.5">
            </div>
            <div class="sim-slider-group" id="grpSepRatio" style="display:none;">
              <div class="sl-header">
                <span class="sl-name">Angular separation (× θ_min)</span>
                <span class="sl-val" id="lsep">1.00×</span>
              </div>
              <input type="range" id="ssep" min="0.2" max="3" step="0.02" value="1.0">
            </div>
          </div>

          <div class="sim-readout">
            <h3>Live Readout</h3>
            <div class="readout-row"><span class="rkey">θ_min</span><span class="rval hi" id="rtheta">—</span></div>
            <div class="readout-row" id="rowDmin"><span class="rkey">D_min (threshold, at L)</span><span class="rval" id="rDmin">—</span></div>
            <div class="readout-row" id="rowD"><span class="rkey">D (actual separation)</span><span class="rval" id="rD">—</span></div>
            <div class="readout-row"><span class="rkey">Actual angle θ = D/L</span><span class="rval" id="rtest">—</span></div>
            <div class="readout-row"><span class="rkey">Result</span><span class="rval" id="rresult">—</span></div>
          </div>

          <div class="sim-legend">
            <h3>Legend</h3>
            <div class="legend-row"><div class="legend-dot" style="background:#FFD166"></div>Point 1</div>
            <div class="legend-row"><div class="legend-dot" style="background:#4ECDC4"></div>Point 2</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#F783AC;border-top-style:dashed"></div>θ_min reference angle</div>
            <div class="legend-row"><div class="legend-dot" style="background:#E6E0D4"></div>Diffraction (Airy) blur — bottom panel</div>
          </div>
        </div>
      </div>`);

    renderMath();

    // ── Canvas ──
    const canvas = document.getElementById('ray-canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    function resize() {
      const w = canvas.parentElement.clientWidth;
      const h = Math.max(420, w * 0.95);
      canvas.width  = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }
    resize();
    const _ro = new ResizeObserver(resize);
    _ro.observe(canvas.parentElement);

    // ── Controls ──
    function refreshLabels() {
      document.getElementById('llam').textContent = state.lambdaNm.toFixed(0) + ' nm';
      document.getElementById('ldEye').textContent = state.dEyeMm.toFixed(1) + ' mm';
      document.getElementById('lL').textContent = state.L_m.toFixed(1) + ' m';
      document.getElementById('lDsep').textContent = state.D_mm.toFixed(3) + ' mm';
      document.getElementById('ldScope').textContent = state.dScopeM.toFixed(2) + ' m';
      document.getElementById('lsep').textContent = state.sepRatio.toFixed(2) + '×';
    }
    function refreshModeUI() {
      document.querySelectorAll('.ray-mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === state.mode));
      const eyeMode = state.mode === 'eye';
      document.getElementById('grpEyeD').style.display = eyeMode ? '' : 'none';
      document.getElementById('grpL').style.display = eyeMode ? '' : 'none';
      document.getElementById('grpDsep').style.display = eyeMode ? '' : 'none';
      document.getElementById('grpScopeD').style.display = eyeMode ? 'none' : '';
      document.getElementById('grpSepRatio').style.display = eyeMode ? 'none' : '';
      document.getElementById('rowD').style.display = eyeMode ? '' : 'none';
      document.getElementById('rowDmin').style.display = eyeMode ? '' : 'none';
    }

    document.getElementById('slam').addEventListener('input', () => {
      state.lambdaNm = parseFloat(document.getElementById('slam').value); refreshLabels();
    });
    document.getElementById('sdEye').addEventListener('input', () => {
      state.dEyeMm = parseFloat(document.getElementById('sdEye').value); refreshLabels();
    });
    document.getElementById('sL').addEventListener('input', () => {
      state.L_m = parseFloat(document.getElementById('sL').value); refreshLabels();
    });
    document.getElementById('sDsep').addEventListener('input', () => {
      state.D_mm = parseFloat(document.getElementById('sDsep').value); refreshLabels();
    });
    document.getElementById('sdScope').addEventListener('input', () => {
      state.dScopeM = parseFloat(document.getElementById('sdScope').value); refreshLabels();
    });
    document.getElementById('ssep').addEventListener('input', () => {
      state.sepRatio = parseFloat(document.getElementById('ssep').value); refreshLabels();
    });
    document.querySelectorAll('.ray-mode-btn').forEach(btn => {
      btn.addEventListener('click', () => { state.mode = btn.dataset.mode; refreshModeUI(); });
    });

    // Formats a number as "m.mm × 10ⁿ" (real "×10", superscript exponent)
    // instead of JavaScript's native "m.mme+n" — these values span many
    // orders of magnitude across realistic slider ranges.
    const SUP_DIGITS = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
    function toSciNotation(value, sig) {
      if (value === 0) return '0';
      const exp = Math.floor(Math.log10(Math.abs(value)));
      const mantissa = value / Math.pow(10, exp);
      const mantissaStr = mantissa.toFixed(sig);
      const expStr = exp.toString().split('').map(ch => SUP_DIGITS[ch] || ch).join('');
      return `${mantissaStr} × 10${expStr}`;
    }

    // ── Physics ──
    function apertureM() { return state.mode === 'eye' ? state.dEyeMm*1e-3 : state.dScopeM; }
    function thetaMinRad() {
      const x = 1.22 * (state.lambdaNm*1e-9) / apertureM();
      return Math.asin(Math.min(x, 1));
    }
    // Actual viewing angle: eye mode uses the real geometric relation
    // sinθ ≈ tanθ = D/L; telescope mode has no finite L, so the angular
    // separation is set directly as a multiple of θ_min.
    function testAngleRad() {
      if (state.mode === 'eye') return (state.D_mm*1e-3) / state.L_m;
      return thetaMinRad() * state.sepRatio;
    }
    function resolutionRatio() { return testAngleRad() / thetaMinRad(); }
    // D_min: the minimum separation that would be resolvable at the current
    // L — i.e. the D that makes θ = D/L exactly equal θ_min. Eye mode only,
    // since telescope mode has no finite L to convert an angle into a size.
    function minD_mm() { return thetaMinRad() * state.L_m * 1000; }

    // ── Layout ──
    function W() { return canvas.width/dpr; }
    function H() { return canvas.height/dpr; }
    function topH(h) { return h*0.55; }

    function drawArrow(x0,y0,x1,y1,color,width) {
      if (Math.hypot(x1-x0,y1-y0)<1) return;
      const ang = Math.atan2(y1-y0,x1-x0), hl=7;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1);
      ctx.strokeStyle=color; ctx.lineWidth=width; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x1,y1);
      ctx.lineTo(x1-hl*Math.cos(ang-0.4), y1-hl*Math.sin(ang-0.4));
      ctx.lineTo(x1-hl*Math.cos(ang+0.4), y1-hl*Math.sin(ang+0.4));
      ctx.closePath(); ctx.fillStyle=color; ctx.fill();
    }

    function drawEyeIcon(cx, cy, r, pupilFrac) {
      ctx.beginPath();
      ctx.ellipse(cx,cy,r*1.6,r,0,0,2*Math.PI);
      ctx.fillStyle='rgba(230,224,212,0.9)'; ctx.fill();
      ctx.strokeStyle='rgba(20,15,10,0.5)'; ctx.lineWidth=1.5; ctx.stroke();
      ctx.beginPath(); ctx.arc(cx,cy,r*0.55,0,2*Math.PI);
      ctx.fillStyle='#5B8DEF'; ctx.fill();
      ctx.beginPath(); ctx.arc(cx,cy,r*0.55*pupilFrac,0,2*Math.PI);
      ctx.fillStyle='#0a0a0a'; ctx.fill();
    }

    function drawTelescopeIcon(cx, cy, apertureR) {
      ctx.fillStyle = 'rgba(200,200,210,0.85)';
      ctx.beginPath();
      ctx.moveTo(cx-8, cy-apertureR);
      ctx.lineTo(cx+120, cy-apertureR*0.35);
      ctx.lineTo(cx+120, cy+apertureR*0.35);
      ctx.lineTo(cx-8, cy+apertureR);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle='rgba(20,15,10,0.5)'; ctx.lineWidth=1.5; ctx.stroke();
      ctx.beginPath(); ctx.ellipse(cx-8, cy, apertureR*0.25, apertureR, 0,0,2*Math.PI);
      ctx.fillStyle='rgba(78,205,196,0.5)'; ctx.fill();
      ctx.strokeStyle='rgba(230,224,212,0.6)'; ctx.stroke();
    }

    function drawSchematic(w, hTop) {
      const cy = hTop*0.5;
      const eyeMode = state.mode==='eye';
      const ratio = resolutionRatio();

      if (eyeMode) {
        const eyeX = w*0.14;
        drawEyeIcon(eyeX, cy, Math.max(14, w*0.028)*(state.dEyeMm/4), state.dEyeMm/8);

        const objX = w*0.82;
        const dispSep = Math.min(hTop*0.30, Math.max(6, ratio*hTop*0.10));
        const p1y = cy - dispSep/2, p2y = cy + dispSep/2;

        drawArrow(eyeX+16, cy, objX, p1y, 'rgba(255,209,102,0.55)', 1.3);
        drawArrow(eyeX+16, cy, objX, p2y, 'rgba(78,205,196,0.55)', 1.3);

        // D annotation between the two points
        ctx.beginPath(); ctx.moveTo(objX+14,p1y); ctx.lineTo(objX+14,p2y);
        ctx.strokeStyle='rgba(230,224,212,0.5)'; ctx.lineWidth=1; ctx.stroke();
        ctx.fillStyle='rgba(230,224,212,0.75)';
        ctx.font = `${Math.max(9,w*0.018)}px 'DM Mono', monospace`;
        ctx.textAlign='left';
        ctx.fillText(`D = ${state.D_mm.toFixed(2)} mm`, objX+20, (p1y+p2y)/2+4);

        ctx.beginPath(); ctx.arc(objX, p1y, 6, 0, 2*Math.PI); ctx.fillStyle='#FFD166'; ctx.fill();
        ctx.beginPath(); ctx.arc(objX, p2y, 6, 0, 2*Math.PI); ctx.fillStyle='#4ECDC4'; ctx.fill();
        ctx.fillStyle='#FFD166'; ctx.textAlign='right';
        ctx.fillText('Point 1', objX-10, p1y-8);
        ctx.fillStyle='#4ECDC4';
        ctx.fillText('Point 2', objX-10, p2y+16);

        ctx.fillStyle='rgba(230,224,212,0.6)';
        ctx.textAlign='center';
        ctx.font = `${Math.max(9,w*0.02)}px 'DM Mono', monospace`;
        ctx.fillText(`L = ${state.L_m.toFixed(1)} m`, (eyeX+objX)/2, cy - hTop*0.24);
      } else {
        const scopeX = w*0.10;
        drawTelescopeIcon(scopeX, cy, Math.max(16, w*0.03)*Math.sqrt(state.dScopeM));

        const starX = w*0.90;
        const dispSep = Math.min(hTop*0.30, Math.max(6, ratio*hTop*0.10));
        const s1y = cy - dispSep/2, s2y = cy + dispSep/2;

        drawArrow(scopeX+2, cy, starX, s1y, 'rgba(255,209,102,0.5)', 1.2);
        drawArrow(scopeX+2, cy, starX, s2y, 'rgba(78,205,196,0.5)', 1.2);

        [[s1y,'#FFD166','Star 1',-8],[s2y,'#4ECDC4','Star 2',16]].forEach(([y,color,label,dy]) => {
          const g = ctx.createRadialGradient(starX,y,0,starX,y,10);
          g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.beginPath(); ctx.arc(starX,y,10,0,2*Math.PI); ctx.fillStyle=g; ctx.fill();
          ctx.beginPath(); ctx.arc(starX,y,2.2,0,2*Math.PI); ctx.fillStyle=color; ctx.fill();
          ctx.fillStyle=color; ctx.textAlign='left';
          ctx.font = `${Math.max(9,w*0.018)}px 'DM Mono', monospace`;
          ctx.fillText(label, starX+14, y+dy);
        });

        ctx.fillStyle='rgba(230,224,212,0.6)';
        ctx.font = `${Math.max(9,w*0.02)}px 'DM Mono', monospace`;
        ctx.textAlign='left';
        ctx.fillText('Two distant stars (effectively at infinity)', starX-190, cy-hTop*0.30);
      }

      ctx.fillStyle='rgba(230,224,212,0.55)';
      ctx.textAlign='left';
      ctx.font = `${Math.max(9,w*0.02)}px 'DM Mono', monospace`;
      ctx.fillText(state.mode==='eye' ? 'Eye mode' : 'Telescope mode', w*0.03, hTop*0.08);
    }

    function drawAiryBlob(cx, cy, coreR, color) {
      const g1 = ctx.createRadialGradient(cx,cy,0,cx,cy,coreR);
      g1.addColorStop(0, color.replace('ALPHA','0.95'));
      g1.addColorStop(0.5, color.replace('ALPHA','0.35'));
      g1.addColorStop(1, color.replace('ALPHA','0'));
      ctx.beginPath(); ctx.arc(cx,cy,coreR,0,2*Math.PI); ctx.fillStyle=g1; ctx.fill();
      ctx.beginPath(); ctx.arc(cx,cy,coreR*1.9,0,2*Math.PI);
      ctx.strokeStyle = color.replace('ALPHA','0.15'); ctx.lineWidth = coreR*0.18;
      ctx.stroke();
    }

    function drawViewPanel(w, hTop, hBot) {
      const panelTop = hTop;
      ctx.fillStyle = '#050608';
      ctx.fillRect(0, panelTop, w, hBot);

      const cx = w/2, cy = panelTop + hBot*0.34;
      const ratio = resolutionRatio();
      const unitPx = Math.min(w, hBot) * 0.115; // pixels representing exactly θ_min separation
      const sepPx = unitPx * ratio;
      const coreR = unitPx * 0.85;
      const outerR = coreR * 1.9;

      const p1x = cx - sepPx/2, p2x = cx + sepPx/2;
      drawAiryBlob(p1x, cy, coreR, 'rgba(255,209,102,ALPHA)');
      drawAiryBlob(p2x, cy, coreR, 'rgba(78,205,196,ALPHA)');

      // reference ticks showing the θ_min-equivalent spacing, anchored just
      // above the blobs (rather than a fixed panel fraction) so they never
      // collide with the caption text regardless of blob size
      const tickY0 = cy - outerR - 22, tickY1 = cy - outerR - 12;
      ctx.beginPath();
      ctx.moveTo(cx-unitPx, tickY0); ctx.lineTo(cx-unitPx, tickY1);
      ctx.moveTo(cx+unitPx, tickY0); ctx.lineTo(cx+unitPx, tickY1);
      ctx.strokeStyle='rgba(247,131,172,0.5)'; ctx.setLineDash([3,3]); ctx.lineWidth=1;
      ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle='rgba(247,131,172,0.7)';
      ctx.font = `${Math.max(9,w*0.016)}px 'DM Mono', monospace`;
      ctx.textAlign='center';
      ctx.fillText('θ_min spacing', cx, tickY0 - 6);

      // labels directly under each blob
      ctx.font = `${Math.max(9,w*0.018)}px 'DM Mono', monospace`;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#FFD166';
      ctx.fillText(state.mode==='eye' ? 'Point 1' : 'Star 1', p1x, cy + outerR + 16);
      ctx.fillStyle = '#4ECDC4';
      ctx.fillText(state.mode==='eye' ? 'Point 2' : 'Star 2', p2x, cy + outerR + 16);

      // RESOLVED / NOT RESOLVED — fixed row below the labels, well clear of the blobs
      const resolved = ratio >= 1.0;
      ctx.fillStyle = resolved ? '#4ECDC4' : '#F783AC';
      ctx.font = `${Math.max(11,w*0.026)}px 'DM Mono', monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(resolved ? 'RESOLVED' : 'NOT RESOLVED (blurred together)', cx, panelTop + hBot*0.74);

      // explicit on-canvas readout of θ_min, D_min, and D — radians only,
      // stacked in their own rows near the bottom of the black box
      const th = thetaMinRad();
      ctx.font = `${Math.max(10,w*0.02)}px 'DM Mono', monospace`;
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(230,224,212,0.85)';
      if (state.mode === 'eye') {
        ctx.fillText(`θ_min = ${toSciNotation(th,3)} rad   (D_min = ${minD_mm().toFixed(3)} mm)`,
          w*0.03, panelTop + hBot*0.84);
        ctx.fillText(`D = ${state.D_mm.toFixed(3)} mm   (θ = D/L = ${toSciNotation(testAngleRad(),3)} rad)`,
          w*0.03, panelTop + hBot*0.91);
      } else {
        ctx.fillText(`θ_min = ${toSciNotation(th,3)} rad`, w*0.03, panelTop + hBot*0.84);
        ctx.fillText(`θ (actual) = ${toSciNotation(testAngleRad(),3)} rad`, w*0.03, panelTop + hBot*0.91);
      }

      ctx.fillStyle = 'rgba(230,224,212,0.5)';
      ctx.textAlign = 'left';
      ctx.fillText('What you\'d see', w*0.03, panelTop+16);
    }

    function updateReadout() {
      const th = thetaMinRad();
      const eyeMode = state.mode==='eye';
      document.getElementById('rtheta').textContent = toSciNotation(th,3) + ' rad';
      if (eyeMode) {
        document.getElementById('rDmin').textContent = minD_mm().toFixed(3) + ' mm';
        document.getElementById('rD').textContent = state.D_mm.toFixed(3) + ' mm';
      }
      document.getElementById('rtest').textContent = toSciNotation(testAngleRad(),3) + ' rad';
      document.getElementById('rresult').textContent = resolutionRatio() >= 1.0 ? 'Resolved' : 'Not resolved';
    }

    function frame() {
      _simRaf = requestAnimationFrame(frame);
      const w = W(), h = H();
      const hTop = topH(h);
      const hBot = h - hTop;
      ctx.clearRect(0,0,w,h);
      drawSchematic(w, hTop);
      drawViewPanel(w, hTop, hBot);
      updateReadout();
    }
    _simRaf = requestAnimationFrame(frame);
  }
};


SIMS['thermo-ideal'] = {
  title: "Ideal Gas Law",
  subtitle: "A sealed container with a fixed amount of gas — lock one variable, then drag either of the other two and watch the third update to keep PV = nRT true.",

  build(host) {
    const R = 8.314; // kPa·L/(mol·K) — numerically identical to J/(mol·K) in these units
    const RANGE = { P: [20, 400], V: [5, 60], T: [100, 900] };
    const SLIDER_ID = { P: 'sP', V: 'sV', T: 'sT' };

    const GASES = [
      { name: 'Hydrogen (H₂)',        M: 2.016 },
      { name: 'Helium (He)',          M: 4.003 },
      { name: 'Nitrogen (N₂)',        M: 28.014 },
      { name: 'Air (avg)',            M: 28.97 },
      { name: 'Oxygen (O₂)',          M: 31.998 },
      { name: 'Carbon Dioxide (CO₂)', M: 44.01 },
    ];
    function gasByName(name) { return GASES.find(g => g.name === name); }
    function buildGasOptions(selectedName) {
      const custom = `<option value="Custom" ${selectedName==='Custom'?'selected':''}>Custom</option>`;
      const rest = GASES.map(g =>
        `<option value="${g.name}" ${g.name===selectedName?'selected':''}>${g.name} — M≈${g.M.toFixed(2)} g/mol</option>`
      ).join('');
      return custom + rest;
    }

    const state = { P: 100, V: 24.94, T: 300, lock: 'none', particles: [], M_gmol: 28.014, gasName: 'Nitrogen (N₂)' };
    // Fixed amount of gas — computed once from the default P, V, T and never
    // changed afterward, representing a sealed container. This is what makes
    // "lock one variable, the other two interact" well-defined: with n and
    // one of P/V/T fixed, there's exactly one remaining degree of freedom.
    const N_FIXED = (state.P * state.V) / (R * state.T);
    // On-screen particle speed is a fixed multiple of the REAL v_rms rather
    // than an independent pacing constant — so a lighter gas (or hotter gas)
    // genuinely animates faster than a heavier (or cooler) one, not just in
    // the readout number but in what you actually see. The multiplier is
    // chosen once so the default case (N₂ at 300 K) animates at the same
    // pace this sim always has (~90 px/s).
    const DEFAULT_VRMS = Math.sqrt(3 * R * state.T / (state.M_gmol/1000));
    const VISUAL_SCALE = 90 / DEFAULT_VRMS;

    host.insertAdjacentHTML('beforeend', `
      <div class="sim-layout">
        <div class="sim-canvas-wrap"><canvas id="gas-canvas"></canvas></div>
        <div class="sim-panel">

          <div class="sim-equation">
            <div class="eq-label">Equation</div>
            <div class="eq-display">$$PV = nRT$$</div>
            <div style="font-size:0.75rem;opacity:0.6;margin-top:6px;">
              n = ${N_FIXED.toFixed(3)} mol is fixed (sealed container). With no lock, dragging P or V moves the
              other one directly via P = nRT/V (T held fixed) — dragging T instead adjusts V, holding P fixed.
              Locking a variable pins it exactly and links the remaining two the same way.
            </div>
          </div>

          <div class="sim-controls">
            <h3>Lock</h3>
            <style>
              .gas-lock-row { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
              .gas-lock-btn {
                background: rgba(255,255,255,0.05);
                border: 1px solid rgba(255,255,255,0.15);
                color: #000000;
                border-radius: 6px;
                padding: 5px 12px;
                font-size: 0.8rem;
                font-family: 'DM Mono', monospace;
                cursor: pointer;
                transition: all .15s ease;
              }
              .gas-lock-btn:hover { border-color: rgba(255,209,102,0.5); }
              .gas-lock-btn.active {
                background: rgba(255,209,102,0.18);
                border-color: #FFD166;
                color: #FFD166;
              }
              .sim-slider-group input[disabled] { opacity: 0.35; cursor: not-allowed; }
            </style>
            <div class="gas-lock-row">
              <button type="button" class="gas-lock-btn active" data-lock="none">Free</button>
              <button type="button" class="gas-lock-btn" data-lock="P">Fix P</button>
              <button type="button" class="gas-lock-btn" data-lock="V">Fix V</button>
              <button type="button" class="gas-lock-btn" data-lock="T">Fix T</button>
            </div>

            <h3>Variables</h3>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">P</span> — pressure</span>
                <span class="sl-val" id="lP">100.0 kPa</span>
              </div>
              <input type="range" id="sP" min="20" max="400" step="1" value="100">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">V</span> — volume</span>
                <span class="sl-val" id="lV">24.94 L</span>
              </div>
              <input type="range" id="sV" min="5" max="60" step="0.1" value="24.94">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">T</span> — temperature</span>
                <span class="sl-val" id="lT">300 K</span>
              </div>
              <input type="range" id="sT" min="100" max="900" step="1" value="300">
            </div>

            <style>
              .gas-select {
                width: 100%;
                background: rgba(255,255,255,0.05);
                border: 1px solid rgba(255,255,255,0.18);
                color: #000000;
                border-radius: 6px;
                padding: 5px 6px;
                font-family: 'DM Mono', monospace;
                font-size: 0.8rem;
                margin-bottom: 6px;
              }
            </style>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">M</span> — gas / molar mass</span>
                <span class="sl-val" id="lM">28.01 g/mol</span>
              </div>
              <select class="gas-select" id="selGas">${buildGasOptions('Nitrogen (N₂)')}</select>
              <input type="range" id="sM" min="1" max="200" step="0.5" value="28.01">
            </div>
          </div>

          <div class="sim-readout">
            <h3>Live Readout</h3>
            <div class="readout-row"><span class="rkey">Moles n (fixed)</span><span class="rval hi" id="rn">—</span></div>
            <div class="readout-row"><span class="rkey">Pressure P</span><span class="rval" id="rP">—</span></div>
            <div class="readout-row"><span class="rkey">Volume V</span><span class="rval" id="rV">—</span></div>
            <div class="readout-row"><span class="rkey">Temperature T</span><span class="rval" id="rT">—</span></div>
            <div class="readout-row"><span class="rkey">RMS speed v_rms = √(3RT/M)</span><span class="rval" id="rspeed">—</span></div>
          </div>

          <div class="sim-legend">
            <h3>Legend</h3>
            <div class="legend-row"><div class="legend-dot" style="background:#5B8DEF"></div>Cool particles</div>
            <div class="legend-row"><div class="legend-dot" style="background:#F783AC"></div>Hot particles</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#E6E0D4"></div>Container walls (fixed size ∝ V)</div>
          </div>
        </div>
      </div>`);

    renderMath();

    // ── Canvas ──
    const canvas = document.getElementById('gas-canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    function resize() {
      const w = canvas.parentElement.clientWidth;
      const h = Math.max(400, w * 0.95);
      canvas.width  = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
      seedParticles();
    }
    resize();
    const _ro = new ResizeObserver(resize);
    _ro.observe(canvas.parentElement);

    // ── Physics helpers ──
    function solveFor(target) {
      if (target === 'T') state.T = (state.P * state.V) / (N_FIXED * R);
      else if (target === 'V') state.V = (N_FIXED * R * state.T) / state.P;
      else if (target === 'P') state.P = (N_FIXED * R * state.T) / state.V;
    }
    function clampVar(key, val) {
      const [lo, hi] = RANGE[key];
      return Math.min(Math.max(val, lo), hi);
    }
    // Kinetic theory: (1/2)M v_rms² corresponds to the molar translational
    // kinetic energy (3/2)RT, giving v_rms = √(3RT/M). M must be in kg/mol.
    function vRms() { return Math.sqrt(3 * R * state.T / (state.M_gmol/1000)); }

    // ── Controls ──
    function refreshLabels() {
      const lockMark = key => state.lock === key ? '🔒 ' : '';
      document.getElementById('lP').textContent = lockMark('P') + state.P.toFixed(1) + ' kPa';
      document.getElementById('lV').textContent = lockMark('V') + state.V.toFixed(2) + ' L';
      document.getElementById('lT').textContent = lockMark('T') + state.T.toFixed(0) + ' K';
      document.getElementById('lM').textContent = state.M_gmol.toFixed(2) + ' g/mol';
      document.getElementById('sP').value = state.P;
      document.getElementById('sV').value = state.V;
      document.getElementById('sT').value = state.T;
    }
    function applyLockUI() {
      Object.keys(SLIDER_ID).forEach(key => {
        document.getElementById(SLIDER_ID[key]).disabled = (state.lock === key);
      });
      document.querySelectorAll('.gas-lock-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lock === state.lock);
      });
    }

    // Free mode: dragging P or V now recomputes the OTHER one directly via
    // P = nRT/V (T held fixed) — the classic Boyle's-law relationship.
    // Dragging T recomputes V, holding P fixed (Charles's-law relationship).
    // So V is the "usually dependent" variable; when V itself is dragged,
    // it falls back to making P dependent instead — same fallback-priority
    // pattern used for the r/ω/v lock system elsewhere in this app.
    const FREE_DEPENDENT = { P: 'V', V: 'P', T: 'V' };

    function applySync(draggedKey) {
      state[draggedKey] = parseFloat(document.getElementById(SLIDER_ID[draggedKey]).value);

      if (state.lock === 'none') {
        const dependent = FREE_DEPENDENT[draggedKey];
        solveFor(dependent);
        const clamped = clampVar(dependent, state[dependent]);
        if (clamped !== state[dependent]) {
          state[dependent] = clamped;
          solveFor(draggedKey); // snap the dragged slider back using the clamped dependent + unchanged anchor
        }
      } else if (state.lock !== draggedKey) {
        const otherKey = ['P','V','T'].find(k => k !== state.lock && k !== draggedKey);
        solveFor(otherKey);
        const clamped = clampVar(otherKey, state[otherKey]);
        if (clamped !== state[otherKey]) {
          state[otherKey] = clamped;
          solveFor(draggedKey);
        }
      }
      refreshLabels();
    }

    document.getElementById('sP').addEventListener('input', () => applySync('P'));
    document.getElementById('sV').addEventListener('input', () => applySync('V'));
    document.getElementById('sT').addEventListener('input', () => applySync('T'));

    document.getElementById('sM').addEventListener('input', () => {
      state.M_gmol = parseFloat(document.getElementById('sM').value);
      state.gasName = 'Custom';
      document.getElementById('selGas').value = 'Custom';
      refreshLabels();
    });
    document.getElementById('selGas').addEventListener('change', e => {
      const g = gasByName(e.target.value);
      if (!g) return; // "Custom" — slider is the source of truth
      state.M_gmol = g.M;
      state.gasName = g.name;
      document.getElementById('sM').value = g.M;
      refreshLabels();
    });

    document.querySelectorAll('.gas-lock-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.lock = btn.dataset.lock;
        applyLockUI();
        refreshLabels();
      });
    });

    // ── Particle physics (visual layer — n is fixed, so count never changes) ──
    function onscreenSpeed() { return vRms() * VISUAL_SCALE; } // px/s — a fixed multiple of the real v_rms
    function particleCount() {
      return Math.round(Math.max(10, Math.min(150, 26 * Math.sqrt(N_FIXED))));
    }
    function boxSidePx(refDim) {
      const [Vmin, Vmax] = RANGE.V;
      const frac = (Math.sqrt(state.V) - Math.sqrt(Vmin)) / (Math.sqrt(Vmax) - Math.sqrt(Vmin));
      return refDim * (0.42 + 0.46*frac);
    }
    function seedParticles() {
      const count = particleCount();
      if (state.particles.length === count) return;
      state.particles = [];
      for (let i=0;i<count;i++) {
        const ang = Math.random()*2*Math.PI;
        state.particles.push({ x: Math.random(), y: Math.random(), dx: Math.cos(ang), dy: Math.sin(ang) });
      }
    }

    // ── Layout ──
    function W() { return canvas.width/dpr; }
    function H() { return canvas.height/dpr; }

    function tempColor(T) {
      const t = Math.max(0, Math.min(1, (T-150)/(750-150)));
      const c1 = [91,141,239], c2 = [230,224,212], c3 = [247,131,172];
      let r,g,b;
      if (t < 0.5) {
        const f = t/0.5;
        r = c1[0]+(c2[0]-c1[0])*f; g = c1[1]+(c2[1]-c1[1])*f; b = c1[2]+(c2[2]-c1[2])*f;
      } else {
        const f = (t-0.5)/0.5;
        r = c2[0]+(c3[0]-c2[0])*f; g = c2[1]+(c3[1]-c2[1])*f; b = c2[2]+(c3[2]-c2[2])*f;
      }
      return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
    }

    function render(dt) {
      const w = W(), h = H();
      ctx.clearRect(0,0,w,h);

      const refDim = Math.min(w,h);
      const side = boxSidePx(refDim);
      const boxX0 = (w-side)/2, boxY0 = (h-side)/2;
      const boxX1 = boxX0+side, boxY1 = boxY0+side;

      ctx.strokeStyle = 'rgba(230,224,212,0.6)';
      ctx.lineWidth = 2;
      ctx.strokeRect(boxX0, boxY0, side, side);
      ctx.fillStyle = 'rgba(230,224,212,0.03)';
      ctx.fillRect(boxX0, boxY0, side, side);

      const speed = onscreenSpeed();
      const color = tempColor(state.T);
      const r = Math.max(2.5, side*0.012);
      state.particles.forEach(p => {
        p.x += (p.dx*speed*dt)/side;
        p.y += (p.dy*speed*dt)/side;
        if (p.x < 0) { p.x = 0; p.dx *= -1; }
        if (p.x > 1) { p.x = 1; p.dx *= -1; }
        if (p.y < 0) { p.y = 0; p.dy *= -1; }
        if (p.y > 1) { p.y = 1; p.dy *= -1; }

        const px = boxX0 + p.x*side, py = boxY0 + p.y*side;
        const g = ctx.createRadialGradient(px,py,0,px,py,r*2.4);
        g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.beginPath(); ctx.arc(px,py,r*2.4,0,2*Math.PI); ctx.fillStyle=g; ctx.fill();
        ctx.beginPath(); ctx.arc(px,py,r,0,2*Math.PI); ctx.fillStyle=color; ctx.fill();
      });

      ctx.fillStyle = 'rgba(230,224,212,0.7)';
      ctx.font = `${Math.max(10,w*0.022)}px 'DM Mono', monospace`;
      ctx.textAlign = 'left';
      ctx.fillText(`P = ${state.P.toFixed(1)} kPa   V = ${state.V.toFixed(2)} L   T = ${state.T.toFixed(0)} K`, w*0.03, h*0.06);
      ctx.textAlign = 'center';
      ctx.fillStyle = color;
      ctx.font = `${Math.max(10,w*0.024)}px 'DM Mono', monospace`;
      ctx.fillText(`n = ${N_FIXED.toFixed(3)} mol (fixed)   v_rms = ${vRms().toFixed(1)} m/s`, w/2, boxY1 + 26);
    }

    function updateReadout() {
      document.getElementById('rn').textContent = N_FIXED.toFixed(4) + ' mol';
      document.getElementById('rP').textContent = state.P.toFixed(2) + ' kPa';
      document.getElementById('rV').textContent = state.V.toFixed(3) + ' L';
      document.getElementById('rT').textContent = state.T.toFixed(1) + ' K';
      document.getElementById('rspeed').textContent = vRms().toFixed(1) + ' m/s';
    }

    // ── Animation loop ──
    let last = null;
    function frame(ts) {
      _simRaf = requestAnimationFrame(frame);
      const dt = last ? Math.min((ts-last)/1000, 0.05) : 0;
      last = ts;
      render(dt);
      updateReadout();
    }
    _simRaf = requestAnimationFrame(frame);
  }
};

SIMS['circuits'] = {
  title: "Circuit Board — Series & Parallel",

    renderMath();

    // ── Canvas ──

    const dpr = window.devicePixelRatio || 1;

    function resize() {

      canvas.height = h * dpr;
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';

    // ── Physics ──
    function effectiveValue(c) {
      if (state.componentType === 'capacitor') {
        const d = DIELECTRICS.find(x => x.name === c.dielectric) || DIELECTRICS[0];

    function totalValue() {
      const vals = state.components.map(effectiveValue);

        return state.arrangement === 'series'

    }
    function perComponentDetail() {
      const vals = state.components.map(effectiveValue);
      const V = state.voltage;
      if (state.componentType === 'resistor') {
        if (state.arrangement === 'series') {
          const Rt = vals.reduce((a,b)=>a+b,0);

        });
      });
      document.querySelectorAll('.circ-dielectric-select').forEach(sel => {
        sel.addEventListener('change', () => {
          const id = parseInt(sel.dataset.id, 10);
          const comp = state.components.find(c => c.id === id);
          comp.dielectric = sel.value;
        });
      });
      document.querySelectorAll('.circ-remove-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          if (state.components.length <= MIN_COMPONENTS) return;
          const id = parseInt(btn.dataset.id, 10);
          state.components = state.components.filter(c => c.id !== id);
          rebuildComponentUI();
        });
      });
    }
    function rebuildComponentUI() {
      document.getElementById('compListContainer').innerHTML = buildComponentSlotsHTML();
      document.getElementById('btnAddComp').disabled = state.components.length >= MAX_COMPONENTS;
      document.getElementById('btnAddComp').textContent = `+ Add ${state.componentType==='resistor'?'Resistor':'Capacitor'}`;
      attachSlotListeners();
    }

    document.getElementById('btnAddComp').addEventListener('click', () => {
      if (state.components.length >= MAX_COMPONENTS) return;
      state.components.push({ id: state.nextId++, value: defaultValue(), dielectric: 'Air' });
      rebuildComponentUI();
    });

    attachSlotListeners(); // for the slots already present in the initial template

    document.querySelectorAll('[data-ctype]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.componentType = btn.dataset.ctype;
        document.querySelectorAll('[data-ctype]').forEach(b => b.classList.toggle('active', b===btn));
        // reset values to sensible defaults for the new component type
        state.components.forEach(c => { c.value = defaultValue(); c.dielectric = 'Air'; });
        rebuildComponentUI();
      });
    });
    document.querySelectorAll('[data-arr]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.arrangement = btn.dataset.arr;
        document.querySelectorAll('[data-arr]').forEach(b => b.classList.toggle('active', b===btn));
      });
    });

    // ── Layout / drawing ──
    function W() { return canvas.width/dpr; }
    function H() { return canvas.height/dpr; }

    function drawBattery(x, yTop, yBot) {
      const midY = (yTop+yBot)/2;
      ctx.strokeStyle = 'rgba(230,224,212,0.8)'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(x, yTop); ctx.lineTo(x, midY-14); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x-14, midY-14); ctx.lineTo(x+14, midY-14); ctx.stroke(); // long plate (+)
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(x-7, midY+6); ctx.lineTo(x+7, midY+6); ctx.stroke(); // short plate (-)
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(x, midY+6); ctx.lineTo(x, yBot); ctx.stroke();
      ctx.fillStyle = 'rgba(230,224,212,0.7)';
      ctx.font = `11px 'DM Mono', monospace`; ctx.textAlign='left';
      ctx.fillText('+', x+18, midY-10);
      ctx.fillText('−', x+18, midY+14);
      ctx.textAlign='center';
      ctx.fillText(`${state.voltage.toFixed(1)}V`, x, yTop-8);
    }

    function drawResistor(x0,y0,x1,y1) {
      ctx.strokeStyle = '#4ECDC4'; ctx.lineWidth = 2;
      const n = 6, dx=(x1-x0)/(n+2), dy=(y1-y0)/(n+2);
      const perp = { x: -(y1-y0), y: (x1-x0) };
      const plen = Math.hypot(perp.x,perp.y) || 1;
      const px = perp.x/plen*8, py = perp.y/plen*8;
      ctx.beginPath();
      ctx.moveTo(x0,y0);
      ctx.lineTo(x0+dx, y0+dy);
      for (let i=0;i<n;i++) {
        const bx = x0+dx+ (x1-x0-2*dx)*(i/(n-1)), by = y0+dy+(y1-y0-2*dy)*(i/(n-1));
        const sign = i%2===0 ? 1 : -1;
        ctx.lineTo(bx+px*sign, by+py*sign);
      }
      ctx.lineTo(x1-dx,y1-dy);
      ctx.lineTo(x1,y1);
      ctx.stroke();
    }

    function drawCapacitor(x0,y0,x1,y1,dielectricName) {
      const mx=(x0+x1)/2, my=(y0+y1)/2;
      const dirX=(x1-x0), dirY=(y1-y0); const len=Math.hypot(dirX,dirY)||1;
      const ux=dirX/len, uy=dirY/len;
      const perp = { x:-uy, y:ux };
      const plateHalf = 12, gap = 7;
      const p1x=mx-ux*gap, p1y=my-uy*gap, p2x=mx+ux*gap, p2y=my+uy*gap;
      ctx.strokeStyle = 'rgba(230,224,212,0.7)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(p1x,p1y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p2x,p2y); ctx.lineTo(x1,y1); ctx.stroke();
      // dielectric slab between plates
      const d = DIELECTRICS.find(x=>x.name===dielectricName) || DIELECTRICS[0];
      if (d.name !== 'Air') {
        const alpha = Math.min(0.55, 0.12 + d.k*0.005);
        ctx.fillStyle = `rgba(78,205,196,${alpha})`;
        ctx.save();
        ctx.translate(mx,my);
        ctx.rotate(Math.atan2(dirY,dirX));
        ctx.fillRect(-gap, -plateHalf, gap*2, plateHalf*2);
        ctx.restore();
      }
      ctx.strokeStyle = '#F783AC'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(p1x+perp.x*plateHalf, p1y+perp.y*plateHalf); ctx.lineTo(p1x-perp.x*plateHalf, p1y-perp.y*plateHalf); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p2x+perp.x*plateHalf, p2y+perp.y*plateHalf); ctx.lineTo(p2x-perp.x*plateHalf, p2y-perp.y*plateHalf); ctx.stroke();
      if (d.name !== 'Air') {
        ctx.fillStyle = 'rgba(230,224,212,0.65)';
        ctx.font = `9px 'DM Mono', monospace`; ctx.textAlign='center';
        ctx.save(); ctx.translate(mx,my+perp.y*(plateHalf+12));
        ctx.fillText(d.name, 0, 0);
        ctx.restore();
      }
    }

    function drawWire(x0,y0,x1,y1) {
      ctx.strokeStyle = 'rgba(230,224,212,0.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
    }

    function drawCurrentDots(x0,y0,x1,y1,speed,phase) {
      const len = Math.hypot(x1-x0,y1-y0);
      const n = Math.max(2, Math.round(len/40));
      for (let i=0;i<n;i++) {
        let t = ((i/n) + phase*speed*0.15) % 1;
        if (t<0) t+=1;
        const x = x0+(x1-x0)*t, y = y0+(y1-y0)*t;
        ctx.beginPath(); ctx.arc(x,y,3,0,2*Math.PI);
        ctx.fillStyle = '#FFD166'; ctx.fill();
      }
    }

    let animPhase = 0;

    function drawComponent(x0,y0,x1,y1,comp) {
      if (state.componentType==='resistor') drawResistor(x0,y0,x1,y1);
      else drawCapacitor(x0,y0,x1,y1,comp.dielectric);
    }

    function render(dt) {
      const w = W(), h = H();
      ctx.clearRect(0,0,w,h);
      animPhase += dt;

      const n = state.components.length;
      const currents = branchCurrents();

      if (state.arrangement === 'series') {
        const left = w*0.15, right = w*0.85, top = h*0.22, bot = h*0.78;
        drawBattery(left, top, bot);
        // loop: left(battery) -> top -> right -> bottom -> back to left
        drawWire(left, top, right, top);
        drawWire(right, top, right, bot);
        drawWire(right, bot, left, bot);
        // place components along the top edge, evenly spaced
        const segLen = (right-left)/n;
        for (let i=0;i<n;i++) {
          const x0 = left + segLen*i + segLen*0.15;
          const x1 = left + segLen*(i+1) - segLen*0.15;
          drawComponent(x0, top, x1, top, state.components[i]);
        }
        if (state.componentType==='resistor') {
          const I = currents[0];
          [[left,top,right,top],[right,top,right,bot],[right,bot,left,bot]].forEach(([a,b,c,d]) => drawCurrentDots(a,b,c,d, I, animPhase));
        }
      } else {
        const left = w*0.14, right = w*0.86, top = h*0.18, bot = h*0.82;
        const battX = left;
        drawBattery(battX, top, bot);
        drawWire(battX, top, right, top); // top rail
        drawWire(battX, bot, right, bot); // bottom rail
        const branchX0 = left + (right-left)*0.28;
        const spacing = (right - branchX0) / Math.max(n,1);
        for (let i=0;i<n;i++) {
          const bx = branchX0 + spacing*(i+0.5);
          drawComponent(bx, top, bx, bot, state.components[i]);
          if (state.componentType==='resistor') {
            drawCurrentDots(bx, top, bx, bot, currents[i], animPhase);
          }
        }
      }

      ctx.fillStyle = 'rgba(230,224,212,0.6)';
      ctx.font = `${Math.max(10,w*0.02)}px 'DM Mono', monospace`;
      ctx.textAlign = 'left';
      ctx.fillText(`${state.componentType==='resistor'?'Resistors':'Capacitors'} in ${state.arrangement}`, w*0.03, h*0.06);
    }

    function updateReadout() {
      const total = totalValue();
      const V = state.voltage;
      if (state.componentType === 'resistor') {
        document.getElementById('rTotal').textContent = total.toFixed(2) + ' Ω';
        document.getElementById('rMain').textContent = (V/total).toFixed(3) + ' A total';
      } else {
        document.getElementById('rTotal').textContent = total.toFixed(2) + ' µF';
        document.getElementById('rMain').textContent = (total*V).toFixed(2) + ' µC total';
      }
      document.getElementById('rDetail').textContent = perComponentDetail().join('\n');
    }

    // ── Animation loop ──
    let last = null;
    function frame(ts) {
      _simRaf = requestAnimationFrame(frame);
      const dt = last ? Math.min((ts-last)/1000, 0.05) : 0;
      last = ts;
      render(dt);
      updateReadout();
    }
    _simRaf = requestAnimationFrame(frame);
  }
};

SIMS['efield-ring'] = {
  title: "Electric Field of a Charged Ring",
  subtitle: "Adjust the ring's charge Q, radius R, and the axial distance d — watch the field vector change, and find where it's actually strongest.",

  build(host) {
    const KE = 8.9875517923e9; // N·m²/C², Coulomb's constant

    const state = { Q_uC: 10, R_cm: 10, d_cm: 5 };

    host.insertAdjacentHTML('beforeend', `
      <div class="sim-layout">
        <div class="sim-canvas-wrap"><canvas id="ring-canvas"></canvas></div>
        <div class="sim-panel">

          <div class="sim-equation">
            <div class="eq-label">Equation</div>
            <div class="eq-display">$$E_x = \\dfrac{k_e Q d}{\\left(d^2+R^2\\right)^{3/2}}$$</div>
            <div style="font-size:0.75rem;opacity:0.6;margin-top:6px;">
              E_x is the field on the ring's axis, a distance d from its center. Q is the ring's total charge, R its radius.
              Counterintuitively, the field isn't strongest at d = 0 — it peaks at d = R/√2.
            </div>
          </div>

          <div class="sim-controls">
            <h3>Variables</h3>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">Q</span> — total ring charge</span>
                <span class="sl-val" id="lQ">10.0 µC</span>
              </div>
              <input type="range" id="sQ" min="-100" max="100" step="0.5" value="10">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">R</span> — ring radius</span>
                <span class="sl-val" id="lR">10.0 cm</span>
              </div>
              <input type="range" id="sR" min="1" max="30" step="0.5" value="10">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">d</span> — axial distance from center</span>
                <span class="sl-val" id="ld">5.0 cm</span>
              </div>
              <input type="range" id="sd" min="-40" max="40" step="0.2" value="5">
            </div>
          </div>

          <div class="sim-readout">
            <h3>Live Readout</h3>
            <div class="readout-row"><span class="rkey">Field E_x at d</span><span class="rval hi" id="rE">—</span></div>
            <div class="readout-row"><span class="rkey">Direction</span><span class="rval" id="rdir">—</span></div>
            <div class="readout-row"><span class="rkey">d for max field (R/√2)</span><span class="rval" id="rdmax">—</span></div>
            <div class="readout-row"><span class="rkey">Maximum field E_max</span><span class="rval" id="rEmax">—</span></div>
          </div>

          <div class="sim-legend">
            <h3>Legend</h3>
            <div class="legend-row"><div class="legend-dot" style="background:#FFD166"></div>Charged ring</div>
            <div class="legend-row"><div class="legend-dot" style="background:#5B8DEF"></div>Test point on axis</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#F783AC"></div>Field vector E_x</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#4ECDC4"></div>E_x vs. d curve</div>
            <div class="legend-row"><div class="legend-dot" style="background:#E6E0D4"></div>Peak field location</div>
          </div>
        </div>
      </div>`);

    renderMath();

    // ── Canvas ──
    const canvas = document.getElementById('ring-canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    function resize() {
      const w = canvas.parentElement.clientWidth;
      const h = Math.max(400, w * 0.9);
      canvas.width  = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }
    resize();
    const _ro = new ResizeObserver(resize);
    _ro.observe(canvas.parentElement);

    // ── Sliders ──
    function readSliders() {
      state.Q_uC = parseFloat(document.getElementById('sQ').value);
      state.R_cm = parseFloat(document.getElementById('sR').value);
      state.d_cm = parseFloat(document.getElementById('sd').value);
      document.getElementById('lQ').textContent = state.Q_uC.toFixed(1) + ' µC';
      document.getElementById('lR').textContent = state.R_cm.toFixed(1) + ' cm';
      document.getElementById('ld').textContent = state.d_cm.toFixed(1) + ' cm';
    }
    ['sQ','sR','sd'].forEach(id => document.getElementById(id).addEventListener('input', readSliders));

    // Formats a number as "m.mm × 10ⁿ" with a real superscript exponent.
    const SUP_DIGITS = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
    function toSciNotation(value, sig) {
      if (value === 0) return '0';
      const exp = Math.floor(Math.log10(Math.abs(value)));
      const mantissa = value / Math.pow(10, exp);
      const mantissaStr = mantissa.toFixed(sig);
      const expStr = exp.toString().split('').map(ch => SUP_DIGITS[ch] || ch).join('');
      const sign = value < 0 ? '-' : '';
      return `${sign}${Math.abs(mantissa).toFixed(sig)} × 10${expStr}`;
    }

    // ── Physics ──
    function Efield(d_m, R_m, Q_C) {
      const denom = Math.pow(d_m*d_m + R_m*R_m, 1.5);
      return denom > 0 ? (KE * Q_C * d_m) / denom : 0;
    }
    function currentE() {
      return Efield(state.d_cm/100, state.R_cm/100, state.Q_uC*1e-6);
    }
    function dMax_cm() { return state.R_cm / Math.SQRT2; }
    function Emax() {
      const dm = dMax_cm()/100;
      return Efield(dm, state.R_cm/100, state.Q_uC*1e-6);
    }

    // ── Layout ──
    function W() { return canvas.width/dpr; }
    function H() { return canvas.height/dpr; }
    function topH(h) { return h*0.5; }

    function drawArrow(x0,y0,x1,y1,color,width) {
      if (Math.hypot(x1-x0,y1-y0)<1) return;
      const ang = Math.atan2(y1-y0,x1-x0), hl=8;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1);
      ctx.strokeStyle=color; ctx.lineWidth=width; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x1,y1);
      ctx.lineTo(x1-hl*Math.cos(ang-0.4), y1-hl*Math.sin(ang-0.4));
      ctx.lineTo(x1-hl*Math.cos(ang+0.4), y1-hl*Math.sin(ang+0.4));
      ctx.closePath(); ctx.fillStyle=color; ctx.fill();
    }

    function drawSchematic(w, hTop) {
      const cy = hTop*0.55;
      const cx = w*0.5;
      const D_MAX_CM = 40;
      const pxPerCm = (w*0.42) / D_MAX_CM;

      // axis
      ctx.beginPath();
      ctx.moveTo(w*0.04, cy); ctx.lineTo(w*0.96, cy);
      ctx.strokeStyle='rgba(138,122,101,0.5)'; ctx.setLineDash([4,4]); ctx.lineWidth=1;
      ctx.stroke(); ctx.setLineDash([]);

      // ring (foreshortened ellipse, viewed edge-on-ish, centered at d=0)
      const ringPx = state.R_cm * pxPerCm;
      ctx.beginPath();
      ctx.ellipse(cx, cy, ringPx*0.28, ringPx, 0, 0, 2*Math.PI);
      const ringColor = state.Q_uC >= 0 ? '#FFD166' : '#4ECDC4';
      ctx.strokeStyle = ringColor; ctx.lineWidth = 4;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,209,102,0.06)';
      ctx.fill();
      ctx.fillStyle = ringColor;
      ctx.font = `${Math.max(9,w*0.02)}px 'DM Mono', monospace`;
      ctx.textAlign='center';
      ctx.fillText(`Q = ${state.Q_uC.toFixed(1)} µC, R = ${state.R_cm.toFixed(1)} cm`, cx, cy - ringPx - 14);

      // peak-field markers on both sides (dashed ticks)
      const dm = dMax_cm();
      [dm, -dm].forEach(dv => {
        const px = cx + dv*pxPerCm;
        ctx.beginPath(); ctx.moveTo(px, cy-8); ctx.lineTo(px, cy+8);
        ctx.strokeStyle = 'rgba(230,224,212,0.4)'; ctx.lineWidth=1;
        ctx.stroke();
      });

      // test point + field vector
      const testX = cx + state.d_cm*pxPerCm;
      const E = currentE();
      const Emag = Math.abs(E);
      const EmaxRef = Math.abs(Emax()) || 1;
      const arrowLen = Math.min(w*0.16, (w*0.10) * (Emag/EmaxRef));
      const dir = Math.sign(E);
      if (Emag > 1e-9) {
        drawArrow(testX, cy-26, testX + dir*Math.max(arrowLen,10), cy-26, '#F783AC', 2.4);
      }
      ctx.beginPath(); ctx.arc(testX, cy, 6, 0, 2*Math.PI);
      ctx.fillStyle = '#5B8DEF'; ctx.fill();
      ctx.fillStyle='rgba(230,224,212,0.7)';
      ctx.textAlign='center';
      ctx.font = `${Math.max(9,w*0.018)}px 'DM Mono', monospace`;
      ctx.fillText(`d = ${state.d_cm.toFixed(1)} cm`, testX, cy+22);

      ctx.fillStyle='rgba(230,224,212,0.5)';
      ctx.textAlign='left';
      ctx.fillText('Schematic: ring viewed edge-on along its axis', w*0.03, hTop*0.08);
    }

    function drawGraph(w, hTop, hBot) {
      const panelTop = hTop;
      const plotX0 = w*0.10, plotX1 = w*0.92;
      const plotY0 = panelTop + hBot*0.12, plotY1 = panelTop + hBot*0.70;
      const midY = (plotY0+plotY1)/2;
      const D_MAX_CM = 40;

      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath(); ctx.moveTo(0,panelTop); ctx.lineTo(w,panelTop); ctx.stroke();

      function xPx(d) { return (plotX0+plotX1)/2 + (d/D_MAX_CM)*(plotX1-plotX0)/2; }

      // find peak magnitude across the displayed range to set the y-scale
      const R_m = state.R_cm/100, Q_C = state.Q_uC*1e-6;
      let peak = Math.abs(Emax()) || 1;
      function yPx(E) { return midY - (E/peak)*(plotY1-plotY0)/2; }

      // gridlines
      ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1;
      for (let dv=-D_MAX_CM; dv<=D_MAX_CM; dv+=10) {
        const px = xPx(dv);
        ctx.beginPath(); ctx.moveTo(px,plotY0); ctx.lineTo(px,plotY1); ctx.stroke();
      }

      // axes
      ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=1.2;
      ctx.beginPath();
      ctx.moveTo(plotX0, midY); ctx.lineTo(plotX1, midY);
      ctx.moveTo(xPx(0), plotY0); ctx.lineTo(xPx(0), plotY1);
      ctx.stroke();

      ctx.font = `${Math.max(9,w*0.016)}px 'DM Mono', monospace`;
      ctx.fillStyle='rgba(230,224,212,0.6)';
      ctx.textAlign='center';
      for (let dv=-D_MAX_CM; dv<=D_MAX_CM; dv+=20) {
        ctx.fillText(dv+' cm', xPx(dv), midY+16);
      }

      // curve
      ctx.beginPath();
      const steps=200;
      for (let i=0;i<=steps;i++) {
        const dv = -D_MAX_CM + (2*D_MAX_CM*i)/steps;
        const E = Efield(dv/100, R_m, Q_C);
        const px = xPx(dv), py = yPx(E);
        if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.strokeStyle = '#4ECDC4'; ctx.lineWidth = 2; ctx.stroke();

      // peak markers
      const dm = dMax_cm();
      [dm,-dm].forEach(dv => {
        const E = Efield(dv/100, R_m, Q_C);
        const px = xPx(dv), py = yPx(E);
        ctx.beginPath(); ctx.arc(px,py,4,0,2*Math.PI); ctx.fillStyle='#E6E0D4'; ctx.fill();
      });

      // current point
      const curPx = xPx(state.d_cm), curPy = yPx(currentE());
      ctx.beginPath(); ctx.moveTo(curPx,curPy); ctx.lineTo(curPx,midY);
      ctx.strokeStyle='rgba(247,131,172,0.5)'; ctx.setLineDash([3,3]); ctx.lineWidth=1;
      ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(curPx,curPy,4.5,0,2*Math.PI); ctx.fillStyle='#F783AC'; ctx.fill();

      ctx.fillStyle='rgba(230,224,212,0.5)';
      ctx.textAlign='left';
      ctx.fillText('E_x(d) — note the field peaks before d = 0 is even left behind', w*0.03, panelTop+16);
    }

    function updateReadout() {
      const E = currentE();
      document.getElementById('rE').textContent = toSciNotation(E,3) + ' N/C';
      document.getElementById('rdir').textContent = Math.abs(E)<1e-9 ? '— (zero field)' : (E>0 ? '+x direction' : '−x direction');
      document.getElementById('rdmax').textContent = dMax_cm().toFixed(2) + ' cm';
      document.getElementById('rEmax').textContent = toSciNotation(Math.abs(Emax()),3) + ' N/C';
    }

    function frame() {
      _simRaf = requestAnimationFrame(frame);
      const w = W(), h = H();
      const hTop = topH(h);
      const hBot = h - hTop;
      ctx.clearRect(0,0,w,h);
      drawSchematic(w, hTop);
      drawGraph(w, hTop, hBot);
      updateReadout();
    }
    _simRaf = requestAnimationFrame(frame);
  }
};

SIMS['efield-sphere'] = {
  title: "Electric Field of a Uniformly Charged Sphere",
  subtitle: "Adjust the sphere's charge Q, radius R, and the distance r from its center — watch the field switch behavior right at the surface.",

  build(host) {
    const KE = 8.9875517923e9; // N·m²/C², Coulomb's constant

    const state = { Q_uC: 10, R_cm: 10, r_cm: 5 };

    host.insertAdjacentHTML('beforeend', `
      <div class="sim-layout">
        <div class="sim-canvas-wrap"><canvas id="sphere-canvas"></canvas></div>
        <div class="sim-panel">

          <div class="sim-equation">
            <div class="eq-label">Equation</div>
            <div class="eq-display">$$E(r) = \\begin{cases} \\dfrac{k_e Q r}{R^3} & r < R \\\\[6pt] \\dfrac{k_e Q}{r^2} & r \\ge R \\end{cases}$$</div>
            <div style="font-size:0.75rem;opacity:0.6;margin-top:6px;">
              Uniformly charged solid sphere (Gauss's law). Inside, only the charge enclosed within radius r contributes, growing as r³ — giving E ∝ r. Outside, the sphere behaves exactly like a point charge, E ∝ 1/r². The two match exactly at r = R.
            </div>
          </div>

          <div class="sim-controls">
            <h3>Variables</h3>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">Q</span> — total sphere charge</span>
                <span class="sl-val" id="lQ">10.0 µC</span>
              </div>
              <input type="range" id="sQ" min="-100" max="100" step="0.5" value="10">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">R</span> — sphere radius</span>
                <span class="sl-val" id="lR">10.0 cm</span>
              </div>
              <input type="range" id="sR" min="1" max="30" step="0.5" value="10">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">r</span> — distance from center</span>
                <span class="sl-val" id="lr">5.0 cm</span>
              </div>
              <input type="range" id="sr" min="0" max="60" step="0.2" value="5">
            </div>
          </div>

          <div class="sim-readout">
            <h3>Live Readout</h3>
            <div class="readout-row"><span class="rkey">Field E(r)</span><span class="rval hi" id="rE">—</span></div>
            <div class="readout-row"><span class="rkey">Region</span><span class="rval" id="rregion">—</span></div>
            <div class="readout-row"><span class="rkey">Direction</span><span class="rval" id="rdir">—</span></div>
            <div class="readout-row"><span class="rkey">Field at surface (r = R)</span><span class="rval" id="rEsurf">—</span></div>
          </div>

          <div class="sim-legend">
            <h3>Legend</h3>
            <div class="legend-row"><div class="legend-dot" style="background:#FFD166"></div>Charged sphere</div>
            <div class="legend-row"><div class="legend-dot" style="background:#5B8DEF"></div>Test point</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#F783AC"></div>Field vector E(r)</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#4ECDC4"></div>E(r) curve (inside: linear · outside: 1/r²)</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#8A7A65;border-top-style:dashed"></div>Sphere surface, r = R</div>
          </div>
        </div>
      </div>`);

    renderMath();

    // ── Canvas ──
    const canvas = document.getElementById('sphere-canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    function resize() {
      const w = canvas.parentElement.clientWidth;
      const h = Math.max(400, w * 0.9);
      canvas.width  = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }
    resize();
    const _ro = new ResizeObserver(resize);
    _ro.observe(canvas.parentElement);

    // ── Sliders ──
    function readSliders() {
      state.Q_uC = parseFloat(document.getElementById('sQ').value);
      state.R_cm = parseFloat(document.getElementById('sR').value);
      state.r_cm = parseFloat(document.getElementById('sr').value);
      document.getElementById('lQ').textContent = state.Q_uC.toFixed(1) + ' µC';
      document.getElementById('lR').textContent = state.R_cm.toFixed(1) + ' cm';
      document.getElementById('lr').textContent = state.r_cm.toFixed(1) + ' cm';
    }
    ['sQ','sR','sr'].forEach(id => document.getElementById(id).addEventListener('input', readSliders));

    // Formats a number as "m.mm × 10ⁿ" with a real superscript exponent.
    const SUP_DIGITS = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
    function toSciNotation(value, sig) {
      if (value === 0) return '0';
      const exp = Math.floor(Math.log10(Math.abs(value)));
      const mantissa = value / Math.pow(10, exp);
      const expStr = exp.toString().split('').map(ch => SUP_DIGITS[ch] || ch).join('');
      const sign = value < 0 ? '-' : '';
      return `${sign}${Math.abs(mantissa).toFixed(sig)} × 10${expStr}`;
    }

    // ── Physics ──
    function Efield(r_m, R_m, Q_C) {
      if (r_m < R_m) return (KE * Q_C * r_m) / Math.pow(R_m, 3);
      if (r_m === 0) return 0;
      return (KE * Q_C) / (r_m * r_m);
    }
    function currentE() { return Efield(state.r_cm/100, state.R_cm/100, state.Q_uC*1e-6); }
    function surfaceE() { return Efield(state.R_cm/100, state.R_cm/100, state.Q_uC*1e-6); }
    function isInside() { return state.r_cm < state.R_cm; }

    // ── Layout ──
    function W() { return canvas.width/dpr; }
    function H() { return canvas.height/dpr; }
    function topH(h) { return h*0.5; }

    function drawArrow(x0,y0,x1,y1,color,width) {
      if (Math.hypot(x1-x0,y1-y0)<1) return;
      const ang = Math.atan2(y1-y0,x1-x0), hl=8;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1);
      ctx.strokeStyle=color; ctx.lineWidth=width; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x1,y1);
      ctx.lineTo(x1-hl*Math.cos(ang-0.4), y1-hl*Math.sin(ang-0.4));
      ctx.lineTo(x1-hl*Math.cos(ang+0.4), y1-hl*Math.sin(ang+0.4));
      ctx.closePath(); ctx.fillStyle=color; ctx.fill();
    }

    function drawSchematic(w, hTop) {
      const cy = hTop*0.5, cx = w*0.5;
      const R_MAX_DISPLAY_CM = 60;
      const pxPerCm = (w*0.42) / R_MAX_DISPLAY_CM;

      // axis
      ctx.beginPath();
      ctx.moveTo(w*0.04, cy); ctx.lineTo(w*0.96, cy);
      ctx.strokeStyle='rgba(138,122,101,0.5)'; ctx.setLineDash([4,4]); ctx.lineWidth=1;
      ctx.stroke(); ctx.setLineDash([]);

      // sphere cross-section
      const Rpx = state.R_cm * pxPerCm;
      const sphereColor = state.Q_uC >= 0 ? '#FFD166' : '#4ECDC4';
      const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,Rpx);
      grad.addColorStop(0, hexToRgba(sphereColor,0.30));
      grad.addColorStop(1, hexToRgba(sphereColor,0.10));
      ctx.beginPath(); ctx.arc(cx,cy,Rpx,0,2*Math.PI);
      ctx.fillStyle = grad; ctx.fill();
      ctx.strokeStyle = sphereColor; ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.fillStyle = sphereColor;
      ctx.font = `${Math.max(9,w*0.02)}px 'DM Mono', monospace`;
      ctx.textAlign='center';
      ctx.fillText(`Q = ${state.Q_uC.toFixed(1)} µC, R = ${state.R_cm.toFixed(1)} cm`, cx, cy - Rpx - 14);

      // test point + field vector, drawn along the +x radius for clarity
      const testX = cx + state.r_cm*pxPerCm;
      const E = currentE();
      const Emag = Math.abs(E);
      const Eref = Math.abs(surfaceE()) || 1;
      const arrowLen = Math.min(w*0.16, (w*0.10) * (Emag/Eref));
      const dir = Math.sign(E) || 1;
      if (Emag > 1e-9) {
        drawArrow(testX, cy-26, testX + dir*Math.max(arrowLen,8), cy-26, '#F783AC', 2.4);
      }
      ctx.beginPath(); ctx.arc(testX, cy, 6, 0, 2*Math.PI);
      ctx.fillStyle = '#5B8DEF'; ctx.fill();
      ctx.fillStyle='rgba(230,224,212,0.7)';
      ctx.textAlign='center';
      ctx.font = `${Math.max(9,w*0.018)}px 'DM Mono', monospace`;
      ctx.fillText(`r = ${state.r_cm.toFixed(1)} cm`, testX, cy+22);
      ctx.fillStyle = isInside() ? 'rgba(78,205,196,0.8)' : 'rgba(247,131,172,0.8)';
      ctx.fillText(isInside() ? 'inside' : 'outside', testX, cy+38);

      ctx.fillStyle='rgba(230,224,212,0.5)';
      ctx.textAlign='left';
      ctx.fillText('Schematic: cross-section through the sphere\'s center', w*0.03, hTop*0.08);
    }

    function hexToRgba(hex, alpha) {
      const h = hex.replace('#','');
      const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    function drawGraph(w, hTop, hBot) {
      const panelTop = hTop;
      const plotX0 = w*0.10, plotX1 = w*0.92;
      const plotY0 = panelTop + hBot*0.12, plotY1 = panelTop + hBot*0.70;
      const midY = (plotY0+plotY1)/2;
      const R_MAX_DISPLAY_CM = 60;

      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath(); ctx.moveTo(0,panelTop); ctx.lineTo(w,panelTop); ctx.stroke();

      function xPx(r) { return plotX0 + (r/R_MAX_DISPLAY_CM)*(plotX1-plotX0); }

      const R_m = state.R_cm/100, Q_C = state.Q_uC*1e-6;
      const peak = Math.abs(surfaceE()) || 1;
      function yPx(E) { return midY - (E/peak)*(plotY1-plotY0)/2; }

      // shade the "inside" region
      ctx.fillStyle = 'rgba(78,205,196,0.05)';
      ctx.fillRect(plotX0, plotY0, xPx(state.R_cm)-plotX0, plotY1-plotY0);

      // gridlines
      ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1;
      for (let rv=0; rv<=R_MAX_DISPLAY_CM; rv+=10) {
        const px = xPx(rv);
        ctx.beginPath(); ctx.moveTo(px,plotY0); ctx.lineTo(px,plotY1); ctx.stroke();
      }

      // axes
      ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=1.2;
      ctx.beginPath();
      ctx.moveTo(plotX0, midY); ctx.lineTo(plotX1, midY);
      ctx.moveTo(plotX0, plotY0); ctx.lineTo(plotX0, plotY1);
      ctx.stroke();

      ctx.font = `${Math.max(9,w*0.016)}px 'DM Mono', monospace`;
      ctx.fillStyle='rgba(230,224,212,0.6)';
      ctx.textAlign='center';
      for (let rv=0; rv<=R_MAX_DISPLAY_CM; rv+=20) {
        ctx.fillText(rv+' cm', xPx(rv), midY+16);
      }

      // R boundary marker
      const Rline = xPx(state.R_cm);
      ctx.beginPath(); ctx.moveTo(Rline,plotY0); ctx.lineTo(Rline,plotY1);
      ctx.strokeStyle='rgba(138,122,101,0.6)'; ctx.setLineDash([4,4]); ctx.lineWidth=1;
      ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle='rgba(230,224,212,0.6)'; ctx.textAlign='center';
      ctx.fillText('R', Rline, plotY0-6);

      // curve
      ctx.beginPath();
      const steps=200;
      for (let i=0;i<=steps;i++) {
        const rv = (R_MAX_DISPLAY_CM*i)/steps;
        const E = Efield(rv/100, R_m, Q_C);
        const px = xPx(rv), py = yPx(E);
        if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.strokeStyle = '#4ECDC4'; ctx.lineWidth = 2; ctx.stroke();

      // current point
      const curPx = xPx(state.r_cm), curPy = yPx(currentE());
      ctx.beginPath(); ctx.moveTo(curPx,curPy); ctx.lineTo(curPx,midY);
      ctx.strokeStyle='rgba(247,131,172,0.5)'; ctx.setLineDash([3,3]); ctx.lineWidth=1;
      ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(curPx,curPy,4.5,0,2*Math.PI); ctx.fillStyle='#F783AC'; ctx.fill();

      ctx.fillStyle='rgba(230,224,212,0.5)';
      ctx.textAlign='left';
      ctx.fillText('E(r) — linear inside, then 1/r² outside, matching exactly at r = R', w*0.03, panelTop+16);
    }

    function updateReadout() {
      const E = currentE();
      document.getElementById('rE').textContent = toSciNotation(E,3) + ' N/C';
      document.getElementById('rregion').textContent = isInside() ? 'Inside (r < R)' : 'Outside (r ≥ R)';
      document.getElementById('rdir').textContent = Math.abs(E)<1e-9 ? '— (zero field)' : (E>0 ? 'Outward (+r)' : 'Inward (−r)');
      document.getElementById('rEsurf').textContent = toSciNotation(surfaceE(),3) + ' N/C';
    }

    function frame() {
      _simRaf = requestAnimationFrame(frame);
      const w = W(), h = H();
      const hTop = topH(h);
      const hBot = h - hTop;
      ctx.clearRect(0,0,w,h);
      drawSchematic(w, hTop);
      drawGraph(w, hTop, hBot);
      updateReadout();
    }
    _simRaf = requestAnimationFrame(frame);
  }
};

SIMS['em-particle-bfield'] = {
  title: "Charged Particle in a Magnetic Field",
  subtitle: "Adjust the particle, its speed, the field strength, and the angle between them — watch it circle, or spiral into a helix.",

  build(host) {
    const E_CHARGE = 1.602176634e-19; // C
    const M_E = 9.1093837015e-31;     // kg
    const M_P = 1.67262192369e-27;    // kg

    const PARTICLES = [
      { name: 'Electron', q_e: -1, m_me: 1 },
      { name: 'Proton',   q_e: +1, m_me: M_P/M_E },
    ];
    function particleByName(name) { return PARTICLES.find(p => p.name === name); }
    function buildParticleOptions(selected) {
      const custom = `<option value="Custom" ${selected==='Custom'?'selected':''}>Custom</option>`;
      const rest = PARTICLES.map(p => `<option value="${p.name}" ${p.name===selected?'selected':''}>${p.name}</option>`).join('');
      return custom + rest;
    }

    const state = {
      particleName: 'Electron', q_e: -1, m_me: 0,
      v: 2e6, B: 0.5, thetaDeg: 90,
      phase: 0,
      driftTrail: [],
    };

    // Reference cyclotron period (computed once, at default settings) used
    // to fix the animation's wall-clock pacing — see SIM_TIME_RATE below.
    const T_DEFAULT = 2*Math.PI*(Math.pow(10,state.m_me)*M_E) / (Math.abs(state.q_e*E_CHARGE)*Math.abs(state.B));
    const SIM_TIME_RATE = T_DEFAULT / 3; // real physics-seconds represented per wall-clock second

    host.insertAdjacentHTML('beforeend', `
      <div class="sim-layout">
        <div class="sim-canvas-wrap"><canvas id="bfield-canvas"></canvas></div>
        <div class="sim-panel">

          <div class="sim-equation">
            <div class="eq-label">Equation</div>
            <div class="eq-display">$$\\vec{F}_B = q(\\vec{v}\\times\\vec{B})$$</div>
            <div style="font-size:0.75rem;opacity:0.6;margin-top:6px;">
              The force is always perpendicular to v, so it changes direction, not speed — the particle moves in a circle (or, with a velocity
              component along B, a helix). The period T = 2πm/(|q|B) doesn't depend on speed at all.
            </div>
          </div>

          <div class="sim-controls">
            <h3>Particle</h3>
            <style>
              .bf-select {
                width: 100%; background: rgba(255,255,255,0.05);
                border: 1px solid rgba(255,255,255,0.18); color:#E6E0D4;
                border-radius: 6px; padding: 5px 6px; font-family:'DM Mono',monospace;
                font-size: 0.8rem; margin-bottom: 6px;
              }
            </style>
            <select class="bf-select" id="selParticle">${buildParticleOptions('Electron')}</select>
            <div class="sim-slider-group" id="grpQ">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">q</span> — charge (units of e)</span>
                <span class="sl-val" id="lq">-1.00 e</span>
              </div>
              <input type="range" id="sq" min="-3" max="3" step="0.05" value="-1">
            </div>
            <div class="sim-slider-group" id="grpM">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">m</span> — mass (units of mₑ)</span>
                <span class="sl-val" id="lm">1.00 mₑ</span>
              </div>
              <input type="range" id="sm" min="-0.3" max="3.5" step="0.01" value="0">
            </div>

            <h3>Field &amp; Motion</h3>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">v</span> — speed</span>
                <span class="sl-val" id="lv">2.00 × 10⁶ m/s</span>
              </div>
              <input type="range" id="sv" min="4" max="7" step="0.02" value="6.301">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">B</span> — field strength (+ = out of page)</span>
                <span class="sl-val" id="lB">0.50 T</span>
              </div>
              <input type="range" id="sB" min="-2" max="2" step="0.02" value="0.5">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">θ</span> — angle between v and B</span>
                <span class="sl-val" id="ltheta">90.0°</span>
              </div>
              <input type="range" id="stheta" min="1" max="90" step="1" value="90">
            </div>
          </div>

          <div class="sim-readout">
            <h3>Live Readout</h3>
            <div class="readout-row"><span class="rkey">Radius r = mv⊥/(|q|B)</span><span class="rval hi" id="rR">—</span></div>
            <div class="readout-row"><span class="rkey">Period T = 2πm/(|q|B)</span><span class="rval" id="rT">—</span></div>
            <div class="readout-row"><span class="rkey">Force magnitude |F|</span><span class="rval" id="rF">—</span></div>
            <div class="readout-row"><span class="rkey">Drift per loop (pitch)</span><span class="rval" id="rDrift">—</span></div>
            <div class="readout-row"><span class="rkey">Rotation sense</span><span class="rval" id="rSense">—</span></div>
          </div>

          <div class="sim-legend">
            <h3>Legend</h3>
            <div class="legend-row"><div class="legend-dot" style="background:#5B8DEF"></div>Particle</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#FFD166"></div>Velocity v (tangent)</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#F783AC"></div>Force F (centripetal)</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#4ECDC4"></div>Orbit / drift trail</div>
            <div class="legend-row"><div class="legend-dot" style="background:#E6E0D4"></div>B field (dots = out of page, × = into page)</div>
          </div>
        </div>
      </div>`);

    renderMath();

    // ── Canvas ──
    const canvas = document.getElementById('bfield-canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    function resize() {
      const w = canvas.parentElement.clientWidth;
      const h = Math.max(420, w * 0.95);
      canvas.width  = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
      state.driftTrail = [];
    }
    resize();
    const _ro = new ResizeObserver(resize);
    _ro.observe(canvas.parentElement);

    // ── Controls ──
    function massRatio() { return Math.pow(10, state.m_me); } // log-scale slider for m
    function refreshLabels() {
      document.getElementById('lq').textContent = state.q_e.toFixed(2) + ' e';
      const mr = massRatio();
      document.getElementById('lm').textContent = (mr<10?mr.toFixed(2):mr.toFixed(0)) + ' mₑ';
      document.getElementById('lv').textContent = toSciNotation(state.v,2) + ' m/s';
      document.getElementById('lB').textContent = state.B.toFixed(2) + ' T';
      document.getElementById('ltheta').textContent = state.thetaDeg.toFixed(0) + '°';
    }
    function applyParticle(name) {
      const p = particleByName(name);
      if (!p) return; // Custom — sliders are the source of truth
      state.q_e = p.q_e;
      state.m_me = Math.log10(p.m_me);
      document.getElementById('sq').value = p.q_e;
      document.getElementById('sm').value = state.m_me;
      refreshLabels();
    }

    document.getElementById('selParticle').addEventListener('change', e => {
      state.particleName = e.target.value;
      applyParticle(e.target.value);
    });
    document.getElementById('sq').addEventListener('input', () => {
      state.q_e = parseFloat(document.getElementById('sq').value);
      state.particleName = 'Custom';
      document.getElementById('selParticle').value = 'Custom';
      refreshLabels();
    });
    document.getElementById('sm').addEventListener('input', () => {
      state.m_me = parseFloat(document.getElementById('sm').value);
      state.particleName = 'Custom';
      document.getElementById('selParticle').value = 'Custom';
      refreshLabels();
    });
    document.getElementById('sv').addEventListener('input', () => {
      state.v = Math.pow(10, parseFloat(document.getElementById('sv').value));
      refreshLabels();
    });
    document.getElementById('sB').addEventListener('input', () => {
      state.B = parseFloat(document.getElementById('sB').value);
      refreshLabels();
    });
    document.getElementById('stheta').addEventListener('input', () => {
      state.thetaDeg = parseFloat(document.getElementById('stheta').value);
      refreshLabels();
    });

    // Formats a number as "m.mm × 10ⁿ" with a real superscript exponent.
    const SUP_DIGITS = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
    function toSciNotation(value, sig) {
      if (value === 0) return '0';
      const exp = Math.floor(Math.log10(Math.abs(value)));
      const mantissa = value / Math.pow(10, exp);
      const expStr = exp.toString().split('').map(ch => SUP_DIGITS[ch] || ch).join('');
      const sign = value < 0 ? '-' : '';
      return `${sign}${Math.abs(mantissa).toFixed(sig)} × 10${expStr}`;
    }

    // ── Physics ──
    function qC() { return state.q_e * E_CHARGE; }
    function mKg() { return massRatio() * M_E; }
    function vPerp() { return state.v * Math.sin(state.thetaDeg*Math.PI/180); }
    function vParallel() { return state.v * Math.cos(state.thetaDeg*Math.PI/180); }
    function radius() {
      const denom = Math.abs(qC())*Math.abs(state.B);
      return denom>0 ? (mKg()*vPerp())/denom : 0;
    }
    function period() {
      const denom = Math.abs(qC())*Math.abs(state.B);
      return denom>0 ? (2*Math.PI*mKg())/denom : Infinity;
    }
    function omegaSigned() {
      const denom = mKg();
      return denom>0 ? (qC()*state.B)/denom : 0; // sign encodes rotation sense
    }
    function forceMag() { return Math.abs(qC())*vPerp()*Math.abs(state.B); }
    function driftPerLoop() { return vParallel()*period(); }

    // ── Layout ──
    function W() { return canvas.width/dpr; }
    function H() { return canvas.height/dpr; }
    function topH(h) { return h*0.62; }

    function drawArrow(x0,y0,x1,y1,color,width) {
      if (Math.hypot(x1-x0,y1-y0)<1) return;
      const ang = Math.atan2(y1-y0,x1-x0), hl=8;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1);
      ctx.strokeStyle=color; ctx.lineWidth=width; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x1,y1);
      ctx.lineTo(x1-hl*Math.cos(ang-0.4), y1-hl*Math.sin(ang-0.4));
      ctx.lineTo(x1-hl*Math.cos(ang+0.4), y1-hl*Math.sin(ang+0.4));
      ctx.closePath(); ctx.fillStyle=color; ctx.fill();
    }

    function drawOrbitPanel(w, hTop) {
      const cx = w/2, cy = hTop*0.52;
      const r_m = radius();
      const rRef = Math.max(r_m, 1e-6);
      const pxPerM = Math.min(w,hTop)*0.32 / rRef;
      const rPx = r_m*pxPerM;

      // B field symbols (dots = out of page = +B, crosses = into page = -B)
      ctx.fillStyle = 'rgba(230,224,212,0.35)';
      const step = Math.max(28, Math.min(w,hTop)*0.09);
      for (let x=step/2; x<w; x+=step) {
        for (let y=step/2; y<hTop; y+=step) {
