          if (state.B >= 0) {
            ctx.beginPath(); ctx.arc(x,y,2,0,2*Math.PI); ctx.fill();
          } else {
            ctx.save(); ctx.translate(x,y); ctx.rotate(Math.PI/4);
            ctx.strokeStyle='rgba(230,224,212,0.35)'; ctx.lineWidth=1.2;
            ctx.beginPath(); ctx.moveTo(-4,0); ctx.lineTo(4,0); ctx.moveTo(0,-4); ctx.lineTo(0,4); ctx.stroke();
            ctx.restore();
          }
        }
      }

      // orbit circle
      ctx.beginPath(); ctx.arc(cx,cy,rPx,0,2*Math.PI);
      ctx.strokeStyle='rgba(78,205,196,0.4)'; ctx.lineWidth=1.5; ctx.stroke();

      const omega = omegaSigned();
      const px = cx + rPx*Math.cos(state.phase);
      const py = cy + rPx*Math.sin(state.phase);

      // velocity (tangent) and force (centripetal, toward center) vectors
      const tangDir = Math.sign(omega) || 1;
      const tangAngle = state.phase + Math.PI/2*tangDir;
      const vLen = Math.min(60, 30+20*Math.log10(state.v/1e4+1));
      drawArrow(px,py, px+Math.cos(tangAngle)*vLen, py+Math.sin(tangAngle)*vLen, '#FFD166', 2.2);

      const radialInAngle = state.phase + Math.PI;
      const fLen = 34;
      drawArrow(px,py, px+Math.cos(radialInAngle)*fLen, py+Math.sin(radialInAngle)*fLen, '#F783AC', 2.2);

      // particle
      const g = ctx.createRadialGradient(px,py,0,px,py,10);
      g.addColorStop(0,'rgba(91,141,239,0.6)'); g.addColorStop(1,'rgba(91,141,239,0)');
      ctx.beginPath(); ctx.arc(px,py,10,0,2*Math.PI); ctx.fillStyle=g; ctx.fill();
      ctx.beginPath(); ctx.arc(px,py,5,0,2*Math.PI); ctx.fillStyle='#5B8DEF'; ctx.fill();

      ctx.fillStyle='rgba(230,224,212,0.7)';
      ctx.font = `${Math.max(9,w*0.02)}px 'DM Mono', monospace`;
      ctx.textAlign='left';
      ctx.fillText(`${state.particleName}   q=${state.q_e.toFixed(2)}e   B=${state.B.toFixed(2)} T`, w*0.03, hTop*0.07);
      ctx.textAlign='center';
      ctx.fillText(`r = ${toSciNotation(r_m,3)} m`, cx, cy+rPx+22);
      ctx.fillStyle='rgba(230,224,212,0.5)';
      ctx.fillText('View looking down the B-axis', cx, hTop*0.96);
    }

    function drawDriftPanel(w, hTop, hBot) {
      const panelTop = hTop;
      const plotX0 = w*0.08, plotX1 = w*0.92;
      const midY = panelTop + hBot*0.5;

      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath(); ctx.moveTo(0,panelTop); ctx.lineTo(w,panelTop); ctx.stroke();

      ctx.beginPath(); ctx.moveTo(plotX0,midY); ctx.lineTo(plotX1,midY);
      ctx.strokeStyle='rgba(138,122,101,0.5)'; ctx.lineWidth=1; ctx.stroke();

      // drift trail (position along B-axis over time)
      const visible = state.driftTrail;
      if (visible.length>1) {
        ctx.beginPath();
        visible.forEach((p,i) => { if(i===0) ctx.moveTo(p.x,midY); else ctx.lineTo(p.x,midY); });
        ctx.strokeStyle='#4ECDC4'; ctx.lineWidth=2;
        // draw as a fading dotted trail instead of a flat line (position is 1D so we draw markers)
      }
      visible.forEach((p,i) => {
        const alpha = i/visible.length;
        ctx.beginPath(); ctx.arc(p.x, midY, 3, 0, 2*Math.PI);
        ctx.fillStyle = `rgba(78,205,196,${0.15+0.5*alpha})`; ctx.fill();
      });

      const curX = visible.length ? visible[visible.length-1].x : plotX0;
      ctx.beginPath(); ctx.arc(curX, midY, 5, 0, 2*Math.PI);
      ctx.fillStyle='#5B8DEF'; ctx.fill();

      ctx.fillStyle='rgba(230,224,212,0.6)';
      ctx.font = `${Math.max(9,w*0.02)}px 'DM Mono', monospace`;
      ctx.textAlign='left';
      ctx.fillText('Drift along the B-axis — combined with the circle above, the real path is a helix', w*0.03, panelTop+16);

      const drift = driftPerLoop();
      ctx.fillStyle = 'rgba(230,224,212,0.7)';
      ctx.textAlign='right';
      ctx.fillText(`v∥ = ${toSciNotation(vParallel(),2)} m/s`, plotX1, midY-14);
    }

    function updateReadout() {
      document.getElementById('rR').textContent = toSciNotation(radius(),3) + ' m';
      document.getElementById('rT').textContent = toSciNotation(period(),3) + ' s';
      document.getElementById('rF').textContent = toSciNotation(forceMag(),3) + ' N';
      document.getElementById('rDrift').textContent = toSciNotation(driftPerLoop(),3) + ' m';
      const omega = omegaSigned();
      document.getElementById('rSense').textContent = Math.abs(omega)<1e-30 ? '—' : (omega>0 ? 'Counterclockwise' : 'Clockwise');
    }

    // ── Animation loop ──
    let last = null;
    function frame(ts) {
      _simRaf = requestAnimationFrame(frame);
      const dt = last ? Math.min((ts-last)/1000, 0.05) : 0;
      last = ts;

      const omega = omegaSigned();
      state.phase = (state.phase + omega*SIM_TIME_RATE*dt) % (2*Math.PI*1000); // keep bounded, sign preserved

      const w = W(), h = H();
      const hTop = topH(h);
      const hBot = h - hTop;

      // drift trail advances in a normalized [0,1] pixel-x space, wrapping
      const plotX0 = w*0.08, plotX1 = w*0.92;
      const driftSpeedPxPerSec = (vParallel() !== 0)
        ? Math.sign(vParallel()) * Math.min(120, 20+15*Math.log10(Math.abs(vParallel())/1e3+1))
        : 0;
      const lastX = state.driftTrail.length ? state.driftTrail[state.driftTrail.length-1].x : plotX0;
      let nextX = lastX + driftSpeedPxPerSec*SIM_TIME_RATE*dt*0.02;
      if (nextX > plotX1 || nextX < plotX0) { state.driftTrail = []; nextX = plotX0; }
      state.driftTrail.push({ x: nextX });
      if (state.driftTrail.length > 300) state.driftTrail.shift();

      ctx.clearRect(0,0,w,h);
      drawOrbitPanel(w, hTop);
      drawDriftPanel(w, hTop, hBot);
      updateReadout();
    }
    _simRaf = requestAnimationFrame(frame);
  }
};

SIMS['relativity'] = {
  title: "Special Relativity — Length Contraction & Time Dilation",
  subtitle: "Adjust the rocket's speed (as a fraction of c) and its rest-frame length — watch it visually shrink, and watch its clock run slow compared to Earth's.",

  build(host) {
    const C_LIGHT = 299792458; // m/s

    const state = { beta: 0.6, L0: 50, earthTime: 0, rocketTime: 0, driftX: 0 };

    host.insertAdjacentHTML('beforeend', `
      <div class="sim-layout">
        <div class="sim-canvas-wrap"><canvas id="rel-canvas"></canvas></div>
        <div class="sim-panel">

          <div class="sim-equation">
            <div class="eq-label">Equations</div>
            <div class="eq-display">$$L = \\dfrac{L_0}{\\gamma} \\qquad\\qquad \\Delta t = \\gamma\\,\\Delta \\tau \\qquad\\qquad \\gamma = \\dfrac{1}{\\sqrt{1-\\beta^2}},\\;\\; \\beta=\\dfrac{v}{c}$$</div>
            <div style="font-size:0.75rem;opacity:0.6;margin-top:6px;">
              L₀ and Δτ are measured in the rocket's own (proper) frame. As observed from Earth, the rocket looks shorter (length contraction)
              and its clock ticks slower (time dilation) — both by the same factor γ. This is frame-dependent: from the rocket's point of view, it's Earth that looks contracted and Earth's clock that runs slow.
            </div>
          </div>

          <div class="sim-controls">
            <h3>Variables</h3>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">β</span> — speed, as a fraction of c</span>
                <span class="sl-val" id="lbeta">0.600 c</span>
              </div>
              <input type="range" id="sbeta" min="0" max="0.999" step="0.001" value="0.6">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">L₀</span> — rocket's rest-frame (proper) length</span>
                <span class="sl-val" id="lL0">50.0 m</span>
              </div>
              <input type="range" id="sL0" min="10" max="200" step="1" value="50">
            </div>
          </div>

          <div class="sim-readout">
            <h3>Live Readout</h3>
            <div class="readout-row"><span class="rkey">Lorentz factor γ</span><span class="rval hi" id="rgamma">—</span></div>
            <div class="readout-row"><span class="rkey">Contracted length L (Earth frame)</span><span class="rval" id="rL">—</span></div>
            <div class="readout-row"><span class="rkey">Speed v</span><span class="rval" id="rv">—</span></div>
            <div class="readout-row"><span class="rkey">Earth clock elapsed</span><span class="rval" id="rEarthT">—</span></div>
            <div class="readout-row"><span class="rkey">Rocket clock elapsed (proper time)</span><span class="rval" id="rRocketT">—</span></div>
          </div>

          <div class="sim-legend">
            <h3>Legend</h3>
            <div class="legend-row"><div class="legend-line" style="border-color:#8A7A65;border-top-style:dashed"></div>Rest length L₀ (outline)</div>
            <div class="legend-row"><div class="legend-dot" style="background:#5B8DEF"></div>Contracted length L (solid, Earth frame)</div>
            <div class="legend-row"><div class="legend-dot" style="background:#FFD166"></div>Earth clock</div>
            <div class="legend-row"><div class="legend-dot" style="background:#F783AC"></div>Rocket clock</div>
          </div>
        </div>
      </div>`);

    renderMath();

    // ── Canvas ──
    const canvas = document.getElementById('rel-canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    // deterministic starfield, generated once
    let seed = 4242;
    function rnd() { seed = (seed*9301+49297)%233280; return seed/233280; }
    const stars = Array.from({length:80}, () => ({ fx: rnd(), fy: rnd(), r: rnd()*1.2+0.3, tw: rnd()*0.5+0.3 }));

    function resize() {
      const w = canvas.parentElement.clientWidth;
      const h = Math.max(420, w * 0.95);
      canvas.width  = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }
    resize();
    const _ro = new ResizeObserver(resize);
    _ro.observe(canvas.parentElement);

    // ── Sliders ──
    function readSliders() {
      state.beta = parseFloat(document.getElementById('sbeta').value);
      state.L0 = parseFloat(document.getElementById('sL0').value);
      document.getElementById('lbeta').textContent = state.beta.toFixed(3) + ' c';
      document.getElementById('lL0').textContent = state.L0.toFixed(1) + ' m';
    }
    ['sbeta','sL0'].forEach(id => document.getElementById(id).addEventListener('input', readSliders));

    // Formats a number as "m.mm × 10ⁿ" with a real superscript exponent.
    const SUP_DIGITS = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
    function toSciNotation(value, sig) {
      if (value === 0) return '0';
      const exp = Math.floor(Math.log10(Math.abs(value)));
      const mantissa = value / Math.pow(10, exp);
      const expStr = exp.toString().split('').map(ch => SUP_DIGITS[ch] || ch).join('');
      return `${mantissa.toFixed(sig)} × 10${expStr}`;
    }

    // ── Physics ──
    function gamma() { return 1/Math.sqrt(1 - state.beta*state.beta); }
    function contractedL() { return state.L0/gamma(); }
    function speedMS() { return state.beta*C_LIGHT; }

    // ── Layout ──
    function W() { return canvas.width/dpr; }
    function H() { return canvas.height/dpr; }
    function topH(h) { return h*0.56; }

    function drawStarfield(w,h,t) {
      ctx.fillStyle = '#05070f';
      ctx.fillRect(0,0,w,h);
      stars.forEach(s => {
        const alpha = 0.3 + 0.5*Math.abs(Math.sin(t*s.tw + s.fx*10));
        ctx.beginPath(); ctx.arc(s.fx*w, s.fy*h, s.r, 0, 2*Math.PI);
        ctx.fillStyle = `rgba(255,255,255,${alpha})`; ctx.fill();
      });
    }

    function drawRocketShape(cx, cy, lengthPx, heightPx, color, filled, alpha) {
      const noseX = cx + lengthPx/2;
      const tailX = cx - lengthPx/2;
      const halfH = heightPx/2;
      ctx.beginPath();
      ctx.moveTo(noseX, cy);
      ctx.lineTo(tailX + lengthPx*0.15, cy - halfH);
      ctx.lineTo(tailX, cy - halfH*0.5);
      ctx.lineTo(tailX, cy + halfH*0.5);
      ctx.lineTo(tailX + lengthPx*0.15, cy + halfH);
      ctx.closePath();
      if (filled) {
        ctx.fillStyle = color.replace('ALPHA', alpha);
        ctx.fill();
        ctx.strokeStyle = color.replace('ALPHA', Math.min(1,alpha+0.3));
        ctx.lineWidth = 2;
        ctx.stroke();
      } else {
        ctx.strokeStyle = color.replace('ALPHA', alpha);
        ctx.lineWidth = 1.6;
        ctx.setLineDash([5,4]);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    function drawSchematic(w, hTop, t) {
      drawStarfield(w, hTop, t);

      const cy = hTop*0.55;
      const metersToPx = (w*0.6) / 220; // fit up to ~220m comfortably (max L0=200)

      // ruler
      const rulerY = hTop*0.85;
      ctx.strokeStyle = 'rgba(230,224,212,0.3)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(w*0.1, rulerY); ctx.lineTo(w*0.9, rulerY); ctx.stroke();
      ctx.fillStyle='rgba(230,224,212,0.5)';
      ctx.font = `${Math.max(9,w*0.016)}px 'DM Mono', monospace`;
      ctx.textAlign='center';
      for (let m=0; m<=200; m+=50) {
        const x = w*0.1 + m*metersToPx;
        if (x > w*0.9) continue;
        ctx.beginPath(); ctx.moveTo(x,rulerY-5); ctx.lineTo(x,rulerY+5); ctx.stroke();
        ctx.fillText(m+'m', x, rulerY+18);
      }

      const cx = w*0.42 + (state.driftX % (w*0.12));

      // rest-length outline (dashed, ghost)
      const L0px = state.L0 * metersToPx;
      drawRocketShape(cx, cy, L0px, 34, 'rgba(138,122,101,ALPHA)', false, 0.8);

      // contracted length (solid, filled)
      const Lpx = contractedL() * metersToPx;
      drawRocketShape(cx, cy, Lpx, 34, 'rgba(91,141,239,ALPHA)', true, 0.55);

      ctx.fillStyle='rgba(230,224,212,0.8)';
      ctx.font = `${Math.max(10,w*0.022)}px 'DM Mono', monospace`;
      ctx.textAlign='center';
      ctx.fillText(`L₀ = ${state.L0.toFixed(1)} m (rest)   →   L = ${contractedL().toFixed(2)} m (Earth frame, β=${state.beta.toFixed(3)})`, w/2, hTop*0.14);

      ctx.fillStyle='rgba(230,224,212,0.5)';
      ctx.textAlign='left';
      ctx.fillText('As measured from Earth — outline shows how long the rocket would look at rest', w*0.03, hTop*0.95);
    }

    function drawClock(cx, cy, radius, elapsedSeconds, color, label) {
      ctx.beginPath(); ctx.arc(cx,cy,radius,0,2*Math.PI);
      ctx.strokeStyle='rgba(230,224,212,0.5)'; ctx.lineWidth=2; ctx.stroke();
      for (let i=0;i<12;i++) {
        const a = i*Math.PI/6;
        const x0=cx+Math.cos(a)*radius*0.85, y0=cy+Math.sin(a)*radius*0.85;
        const x1=cx+Math.cos(a)*radius*0.95, y1=cy+Math.sin(a)*radius*0.95;
        ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1);
        ctx.strokeStyle='rgba(230,224,212,0.35)'; ctx.lineWidth=1; ctx.stroke();
      }
      const angle = (elapsedSeconds % 60)/60 * 2*Math.PI - Math.PI/2;
      ctx.beginPath(); ctx.moveTo(cx,cy);
      ctx.lineTo(cx+Math.cos(angle)*radius*0.8, cy+Math.sin(angle)*radius*0.8);
      ctx.strokeStyle=color; ctx.lineWidth=2.5; ctx.stroke();
      ctx.beginPath(); ctx.arc(cx,cy,3,0,2*Math.PI); ctx.fillStyle=color; ctx.fill();
      ctx.fillStyle=color; ctx.textAlign='center';
      ctx.font = `${Math.max(10,radius*0.18)}px 'DM Mono', monospace`;
      ctx.fillText(label, cx, cy+radius+22);
      ctx.fillStyle='rgba(230,224,212,0.7)';
      ctx.fillText(elapsedSeconds.toFixed(2)+' s', cx, cy+radius+40);
    }

    function drawClocksPanel(w, hTop, hBot) {
      const panelTop = hTop;
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath(); ctx.moveTo(0,panelTop); ctx.lineTo(w,panelTop); ctx.stroke();

      const cy = panelTop + hBot*0.42;
      const radius = Math.min(w*0.13, hBot*0.28);
      drawClock(w*0.30, cy, radius, state.earthTime, '#FFD166', 'Earth clock (stationary)');
      drawClock(w*0.70, cy, radius, state.rocketTime, '#F783AC', 'Rocket clock (proper time)');

      ctx.fillStyle='rgba(230,224,212,0.6)';
      ctx.font = `${Math.max(9,w*0.02)}px 'DM Mono', monospace`;
      ctx.textAlign='left';
      ctx.fillText(`γ = ${gamma().toFixed(4)}  —  for every ${gamma().toFixed(2)}s on Earth, only 1s passes on the rocket`, w*0.03, panelTop+16);
    }

    function updateReadout() {
      document.getElementById('rgamma').textContent = gamma().toFixed(4);
      document.getElementById('rL').textContent = contractedL().toFixed(3) + ' m';
      document.getElementById('rv').textContent = toSciNotation(speedMS(),4) + ' m/s';
      document.getElementById('rEarthT').textContent = state.earthTime.toFixed(2) + ' s';
      document.getElementById('rRocketT').textContent = state.rocketTime.toFixed(2) + ' s';
    }

    // ── Animation loop ──
    let last = null;
    function frame(ts) {
      _simRaf = requestAnimationFrame(frame);
      const dt = last ? Math.min((ts-last)/1000, 0.05) : 0;
      last = ts;

      state.earthTime += dt;
      state.rocketTime += dt/gamma(); // moving clock runs slow, as observed from Earth
      state.driftX += dt * 14;

      const w = W(), h = H();
      const hTop = topH(h);
      const hBot = h - hTop;
      ctx.clearRect(0,0,w,h);
      drawSchematic(w, hTop, state.earthTime);
      drawClocksPanel(w, hTop, hBot);
      updateReadout();
    }
    _simRaf = requestAnimationFrame(frame);
  }
};

SIMS['emw-waveeq'] = {
  title: "The Electromagnetic Wave Equation",
  subtitle: "Adjust the wavelength (color) and amplitude — watch E and B propagate together as a transverse light wave, always at the same speed c.",

  build(host) {
    const C_LIGHT = 299792458; // m/s

    const state = { lambdaNm: 550, E0: 1.0, t: 0 };

    host.insertAdjacentHTML('beforeend', `
      <div class="sim-layout">
        <div class="sim-canvas-wrap"><canvas id="emwave-canvas"></canvas></div>
        <div class="sim-panel">

          <div class="sim-equation">
            <div class="eq-label">Equation</div>
            <div class="eq-display">$$\\dfrac{\\partial^2 E_y}{\\partial t^2} = c^2\\dfrac{\\partial^2 E_y}{\\partial x^2}$$</div>
            <div style="font-size:0.75rem;opacity:0.6;margin-top:6px;">
              This is the 1D wave equation for the electric field, satisfied by any E_y(x,t) = E₀sin(kx−ωt) with ω = ck.
              Maxwell's equations also demand a perpendicular magnetic field B_z, in phase with E, with B₀ = E₀/c — that's what makes it light rather than just an abstract wave.
            </div>
          </div>

          <div class="sim-controls">
            <h3>Variables</h3>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">λ</span> — wavelength (sets color)</span>
                <span class="sl-val" id="llam">550 nm</span>
              </div>
              <input type="range" id="slam" min="380" max="700" step="1" value="550">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">E₀</span> — field amplitude</span>
                <span class="sl-val" id="lE0">1.00</span>
              </div>
              <input type="range" id="sE0" min="0.2" max="2" step="0.02" value="1.0">
            </div>
          </div>

          <div class="sim-readout">
            <h3>Live Readout</h3>
            <div class="readout-row"><span class="rkey">Frequency f = c/λ</span><span class="rval hi" id="rf">—</span></div>
            <div class="readout-row"><span class="rkey">Period T = 1/f</span><span class="rval" id="rT">—</span></div>
            <div class="readout-row"><span class="rkey">Angular frequency ω = ck</span><span class="rval" id="romega">—</span></div>
            <div class="readout-row"><span class="rkey">Wave number k = 2π/λ</span><span class="rval" id="rk">—</span></div>
            <div class="readout-row"><span class="rkey">B₀ = E₀/c</span><span class="rval" id="rB0">—</span></div>
          </div>

          <div class="sim-legend">
            <h3>Legend</h3>
            <div class="legend-row"><div class="legend-line" style="border-color:#5B8DEF"></div>Electric field E_y (vertical plane)</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#F783AC"></div>Magnetic field B_z (perpendicular plane)</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#8A7A65;border-top-style:dashed"></div>Propagation axis (direction of travel)</div>
          </div>
        </div>
      </div>`);

    renderMath();

    // ── Canvas ──
    const canvas = document.getElementById('emwave-canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    function resize() {
      const w = canvas.parentElement.clientWidth;
      const h = Math.max(380, w * 0.72);
      canvas.width  = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }
    resize();
    const _ro = new ResizeObserver(resize);
    _ro.observe(canvas.parentElement);

    // ── Sliders ──
    function readSliders() {
      state.lambdaNm = parseFloat(document.getElementById('slam').value);
      state.E0 = parseFloat(document.getElementById('sE0').value);
      document.getElementById('llam').textContent = state.lambdaNm.toFixed(0) + ' nm';
      document.getElementById('lE0').textContent = state.E0.toFixed(2);
    }
    ['slam','sE0'].forEach(id => document.getElementById(id).addEventListener('input', readSliders));

    // Formats a number as "m.mm × 10ⁿ" with a real superscript exponent.
    const SUP_DIGITS = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
    function toSciNotation(value, sig) {
      if (value === 0) return '0';
      const exp = Math.floor(Math.log10(Math.abs(value)));
      const mantissa = value / Math.pow(10, exp);
      const expStr = exp.toString().split('').map(ch => SUP_DIGITS[ch] || ch).join('');
      return `${mantissa.toFixed(sig)} × 10${expStr}`;
    }

    // approximate visible-spectrum wavelength → RGB
    function wavelengthRGB(nm) {
      let r=0,g=0,b=0;
      if (nm >= 380 && nm < 440)      { r = -(nm-440)/(440-380); g = 0; b = 1; }
      else if (nm >= 440 && nm < 490) { r = 0; g = (nm-440)/(490-440); b = 1; }
      else if (nm >= 490 && nm < 510) { r = 0; g = 1; b = -(nm-510)/(510-490); }
      else if (nm >= 510 && nm < 580) { r = (nm-510)/(580-510); g = 1; b = 0; }
      else if (nm >= 580 && nm < 645) { r = 1; g = -(nm-645)/(645-580); b = 0; }
      else if (nm >= 645 && nm <= 700){ r = 1; g = 0; b = 0; }
      return `rgb(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)})`;
    }

    // ── Physics (real numbers, used only for the readout) ──
    function freqHz() { return C_LIGHT / (state.lambdaNm*1e-9); }
    function periodS() { return 1/freqHz(); }
    function waveNumber() { return 2*Math.PI/(state.lambdaNm*1e-9); }
    function angularFreq() { return C_LIGHT*waveNumber(); }
    function B0() { return state.E0/C_LIGHT; }

    // ── Visual (schematic) scale — see note below ──
    // Real λ (hundreds of nm) and real c are both impossible to draw to
    // scale on screen. The on-screen wavelength is mapped from the true λ
    // into a comfortable pixel range (so shorter/longer λ still visibly
    // compresses/stretches the wave), and the propagation speed on screen
    // is held CONSTANT regardless of λ — correctly reflecting that every
    // color of light travels at the same real speed c; only the spatial
    // wavelength and oscillation frequency differ between colors.
    function pxPerCycle(w) {
      const frac = (state.lambdaNm-380)/(700-380);
      return w * (0.09 + 0.11*frac); // ~9%–20% of panel width per cycle
    }
    const DEMO_SPEED_PX_S = 70;

    function W() { return canvas.width/dpr; }
    function H() { return canvas.height/dpr; }

    function drawArrow(x0,y0,x1,y1,color,width) {
      if (Math.hypot(x1-x0,y1-y0)<1) return;
      const ang = Math.atan2(y1-y0,x1-x0), hl=6;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1);
      ctx.strokeStyle=color; ctx.lineWidth=width; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x1,y1);
      ctx.lineTo(x1-hl*Math.cos(ang-0.4), y1-hl*Math.sin(ang-0.4));
      ctx.lineTo(x1-hl*Math.cos(ang+0.4), y1-hl*Math.sin(ang+0.4));
      ctx.closePath(); ctx.fillStyle=color; ctx.fill();
    }

    function render() {
      const w = W(), h = H();
      ctx.clearRect(0,0,w,h);

      const axisY = h*0.52;
      const x0 = w*0.06, x1 = w*0.96;
      const color = wavelengthRGB(state.lambdaNm);
      const pxCycle = pxPerCycle(w);
      const kVisual = 2*Math.PI/pxCycle;
      const omegaVisual = DEMO_SPEED_PX_S * kVisual;

      // propagation axis
      ctx.beginPath();
      ctx.moveTo(x0, axisY); ctx.lineTo(x1, axisY);
      ctx.strokeStyle = 'rgba(138,122,101,0.5)'; ctx.setLineDash([4,4]); ctx.lineWidth=1;
      ctx.stroke(); ctx.setLineDash([]);
      drawArrow(x1-24, axisY, x1, axisY, 'rgba(138,122,101,0.7)', 1.4);
      ctx.fillStyle='rgba(138,122,101,0.8)';
      ctx.font = `${Math.max(9,w*0.016)}px 'DM Mono', monospace`;
      ctx.textAlign='left';
      ctx.fillText('direction of travel', x1-100, axisY-8);

      const ampPx = Math.min(h*0.32, 70) * state.E0;
      const bSkewAngle = -0.55; // radians, shallow angle to suggest the perpendicular (into/out of page) plane
      const bAmpPx = ampPx * 0.85;

      // ── E field (vertical plane) ──
      ctx.beginPath();
      const steps = 160;
      for (let i=0;i<=steps;i++) {
        const x = x0 + (x1-x0)*i/steps;
        const phase = kVisual*(x-x0) - omegaVisual*state.t;
        const y = axisY - Math.sin(phase)*ampPx;
        if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.strokeStyle = '#5B8DEF'; ctx.lineWidth = 2.2; ctx.stroke();

      // ── B field (perpendicular plane, skewed to suggest depth) ──
      ctx.beginPath();
      for (let i=0;i<=steps;i++) {
        const x = x0 + (x1-x0)*i/steps;
        const phase = kVisual*(x-x0) - omegaVisual*state.t;
        const bVal = Math.sin(phase)*bAmpPx;
        const bx = x + bVal*Math.cos(bSkewAngle);
        const by = axisY + bVal*Math.sin(bSkewAngle);
        if (i===0) ctx.moveTo(bx,by); else ctx.lineTo(bx,by);
      }
      ctx.strokeStyle = 'rgba(247,131,172,0.85)'; ctx.lineWidth = 2.2; ctx.stroke();

      // stems at intervals, connecting axis to both curves (classic EM-wave-diagram look)
      const stemCount = 18;
      for (let i=0;i<=stemCount;i++) {
        const x = x0 + (x1-x0)*i/stemCount;
        const phase = kVisual*(x-x0) - omegaVisual*state.t;
        const eVal = Math.sin(phase)*ampPx;
        const bVal = Math.sin(phase)*bAmpPx;
        ctx.beginPath(); ctx.moveTo(x, axisY); ctx.lineTo(x, axisY-eVal);
        ctx.strokeStyle = 'rgba(91,141,239,0.5)'; ctx.lineWidth=1.3; ctx.stroke();
        const bx = x + bVal*Math.cos(bSkewAngle), by = axisY + bVal*Math.sin(bSkewAngle);
        ctx.beginPath(); ctx.moveTo(x, axisY); ctx.lineTo(bx, by);
        ctx.strokeStyle = 'rgba(247,131,172,0.4)'; ctx.lineWidth=1.3; ctx.stroke();
      }

      // color swatch showing the true color of this wavelength
      const swX = w*0.03, swY = h*0.06, swW = 26, swH = 26;
      ctx.fillStyle = color;
      ctx.fillRect(swX, swY, swW, swH);
      ctx.strokeStyle = 'rgba(230,224,212,0.4)'; ctx.lineWidth=1;
      ctx.strokeRect(swX, swY, swW, swH);
      ctx.fillStyle = 'rgba(230,224,212,0.8)';
      ctx.font = `${Math.max(10,w*0.02)}px 'DM Mono', monospace`;
      ctx.textAlign='left';
      ctx.fillText(`λ = ${state.lambdaNm.toFixed(0)} nm`, swX+swW+8, swY+swH*0.7);

      ctx.fillStyle = 'rgba(230,224,212,0.5)';
      ctx.font = `${Math.max(9,w*0.016)}px 'DM Mono', monospace`;
      ctx.fillText('Schematic: E and B always travel at the same real speed c — spatial scale here is illustrative', w*0.03, h*0.94);
    }

    function updateReadout() {
      document.getElementById('rf').textContent = toSciNotation(freqHz(),3) + ' Hz';
      document.getElementById('rT').textContent = toSciNotation(periodS(),3) + ' s';
      document.getElementById('romega').textContent = toSciNotation(angularFreq(),3) + ' rad/s';
      document.getElementById('rk').textContent = toSciNotation(waveNumber(),3) + ' rad/m';
      document.getElementById('rB0').textContent = toSciNotation(B0(),3) + ' T (relative to E₀)';
    }

    // ── Animation loop ──
    let last = null;
    function frame(ts) {
      _simRaf = requestAnimationFrame(frame);
      const dt = last ? Math.min((ts-last)/1000, 0.05) : 0;
      last = ts;
      state.t += dt;
      render();
      updateReadout();
    }
    _simRaf = requestAnimationFrame(frame);
  }
};


SIMS['fluids-depth'] = {
  title: "Pressure vs. Depth — Submarine",
  subtitle: "Adjust surface pressure, fluid density, gravity, and depth — watch the pressure on a descending submarine climb linearly.",

  build(host) {
    const state = { P0_kPa: 101.325, rho: 1025, g: 9.8, h: 200 };
    const H_MAX = 1000; // m, slider range

    host.insertAdjacentHTML('beforeend', `
      <div class="sim-layout">
        <div class="sim-canvas-wrap"><canvas id="press-canvas"></canvas></div>
        <div class="sim-panel">

          <div class="sim-equation">
            <div class="eq-label">Equation</div>
            <div class="eq-display">$$P_f = P_0 + \\rho g h$$</div>
            <div style="font-size:0.75rem;opacity:0.6;margin-top:6px;">
              P₀ is the surface (atmospheric) pressure; every meter of descent adds another ρg worth of pressure from the water above.
              Seawater (ρ≈1025 kg/m³) adds about 1 atm every 10 m — a 200 m dive already means over 20 atmospheres pressing on the hull.
            </div>
          </div>

          <div class="sim-controls">
            <h3>Variables</h3>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">P₀</span> — surface air pressure</span>
                <span class="sl-val" id="lP0">101.3 kPa</span>
              </div>
              <input type="range" id="sP0" min="80" max="120" step="0.1" value="101.325">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">ρ</span> — fluid density</span>
                <span class="sl-val" id="lrho">1025 kg/m³</span>
              </div>
              <input type="range" id="srho" min="900" max="1100" step="1" value="1025">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">g</span> — gravity</span>
                <span class="sl-val" id="lg">9.80 m/s²</span>
              </div>
              <input type="range" id="sg" min="1" max="20" step="0.1" value="9.8">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">h</span> — submarine depth</span>
                <span class="sl-val" id="lh">200 m</span>
              </div>
              <input type="range" id="sh" min="0" max="1000" step="1" value="200">
            </div>
          </div>

          <div class="sim-readout">
            <h3>Live Readout</h3>
            <div class="readout-row"><span class="rkey">Pressure at depth P_f</span><span class="rval hi" id="rPf">—</span></div>
            <div class="readout-row"><span class="rkey">In atmospheres</span><span class="rval" id="rAtm">—</span></div>
            <div class="readout-row"><span class="rkey">Added pressure (ρgh)</span><span class="rval" id="rAdded">—</span></div>
            <div class="readout-row"><span class="rkey">Depth h</span><span class="rval" id="rh">—</span></div>
          </div>

          <div class="sim-legend">
            <h3>Legend</h3>
            <div class="legend-row"><div class="legend-dot" style="background:#87CEEB"></div>Surface / atmosphere</div>
            <div class="legend-row"><div class="legend-dot" style="background:#3E7CB1"></div>Ocean (darkens with depth)</div>
            <div class="legend-row"><div class="legend-dot" style="background:#D9B382"></div>Submarine</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#F783AC;border-top-style:dashed"></div>Reference depths</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#4ECDC4"></div>P(h) — linear curve</div>
          </div>
        </div>
      </div>`);

    renderMath();

    // ── Canvas ──
    const canvas = document.getElementById('press-canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    function resize() {
      const w = canvas.parentElement.clientWidth;
      const h = Math.max(420, w * 0.95);
      canvas.width  = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }
    resize();
    const _ro = new ResizeObserver(resize);
    _ro.observe(canvas.parentElement);

    // ── Sliders ──
    function readSliders() {
      state.P0_kPa = parseFloat(document.getElementById('sP0').value);
      state.rho = parseFloat(document.getElementById('srho').value);
      state.g = parseFloat(document.getElementById('sg').value);
      state.h = parseFloat(document.getElementById('sh').value);
      document.getElementById('lP0').textContent = state.P0_kPa.toFixed(1) + ' kPa';
      document.getElementById('lrho').textContent = state.rho.toFixed(0) + ' kg/m³';
      document.getElementById('lg').textContent = state.g.toFixed(2) + ' m/s²';
      document.getElementById('lh').textContent = state.h.toFixed(0) + ' m';
    }
    ['sP0','srho','sg','sh'].forEach(id => document.getElementById(id).addEventListener('input', readSliders));

    // ── Physics ──
    const ATM_PA = 101325;
    function addedPressurePa() { return state.rho * state.g * state.h; }
    function Pf_Pa() { return state.P0_kPa*1000 + addedPressurePa(); }
    function Pf_kPa() { return Pf_Pa()/1000; }
    function Pf_atm() { return Pf_Pa()/ATM_PA; }

    // ── Layout ──
    function W() { return canvas.width/dpr; }
    function H() { return canvas.height/dpr; }
    function topH(h) { return h*0.6; }

    function render() {
      const w = W(), h = H();
      const hTop = topH(h);
      const hBot = h - hTop;
      ctx.clearRect(0,0,w,h);
      drawScene(w, hTop);
      drawGraph(w, hTop, hBot);
      updateReadout();
    }

    function drawScene(w, hTop) {
      const skyH = hTop*0.14;
      const waterY = skyH;

      // sky
      const skyGrad = ctx.createLinearGradient(0,0,0,skyH);
      skyGrad.addColorStop(0,'#3d5a80'); skyGrad.addColorStop(1,'#87CEEB');
      ctx.fillStyle = skyGrad; ctx.fillRect(0,0,w,skyH);

      // ocean, darkening with depth
      const oceanGrad = ctx.createLinearGradient(0,waterY,0,hTop);
      oceanGrad.addColorStop(0, '#3E9BC1');
      oceanGrad.addColorStop(0.4, '#2C6E93');
      oceanGrad.addColorStop(1, '#081824');
      ctx.fillStyle = oceanGrad;
      ctx.fillRect(0,waterY,w,hTop-waterY);

      // waterline
      ctx.strokeStyle = 'rgba(230,224,212,0.5)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(0,waterY); ctx.lineTo(w,waterY); ctx.stroke();

      const pxPerM = (hTop-waterY)/H_MAX;

      // depth reference markers
      [[0,'Surface (P₀)'],[100,'~10 atm (100m)'],[500,'Typical sub crush depth (~500m)']].forEach(([m,label]) => {
        const y = waterY + m*pxPerM;
        if (y > hTop) return;
        ctx.beginPath(); ctx.moveTo(w*0.04,y); ctx.lineTo(w*0.96,y);
        ctx.strokeStyle='rgba(247,131,172,0.25)'; ctx.setLineDash([4,4]); ctx.lineWidth=1;
        ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle='rgba(247,131,172,0.6)';
        ctx.font = `${Math.max(8,w*0.015)}px 'DM Mono', monospace`;
        ctx.textAlign='left';
        ctx.fillText(label, w*0.04, y-4);
      });

      // depth ruler
      ctx.fillStyle='rgba(230,224,212,0.4)';
      ctx.textAlign='right';
      for (let m=0;m<=H_MAX;m+=200) {
        const y = waterY + m*pxPerM;
        ctx.fillText(m+'m', w*0.03, y+4);
      }

      // submarine
      const subY = waterY + state.h*pxPerM;
      const subW = Math.min(w*0.18, 90), subH = subW*0.34;
      const subX = w*0.55;
      ctx.save();
      ctx.translate(subX, subY);
      const pFrac = Math.min(1, Pf_atm()/50); // color shifts toward warning as pressure climbs
      const hullColor = `rgb(${Math.round(217+38*pFrac)},${Math.round(179-100*pFrac)},${Math.round(130-80*pFrac)})`;
      ctx.beginPath();
      ctx.ellipse(0,0,subW/2,subH/2,0,0,2*Math.PI);
      ctx.fillStyle = hullColor; ctx.fill();
      ctx.strokeStyle='rgba(20,15,10,0.5)'; ctx.lineWidth=1.5; ctx.stroke();
      // conning tower
      ctx.fillRect(-subW*0.08, -subH*0.9, subW*0.16, subH*0.55);
      ctx.restore();

      ctx.fillStyle='rgba(230,224,212,0.85)';
      ctx.font = `${Math.max(10,w*0.022)}px 'DM Mono', monospace`;
      ctx.textAlign='center';
      ctx.fillText(`h = ${state.h.toFixed(0)} m`, subX, subY - subH - 10);
      ctx.fillStyle = pFrac>0.6 ? '#F783AC' : '#4ECDC4';
      ctx.fillText(`P_f = ${Pf_kPa().toFixed(1)} kPa (${Pf_atm().toFixed(2)} atm)`, subX, subY + subH + 20);

      ctx.fillStyle='rgba(230,224,212,0.5)';
      ctx.textAlign='left';
      ctx.font = `${Math.max(9,w*0.018)}px 'DM Mono', monospace`;
      ctx.fillText(`P₀ = ${state.P0_kPa.toFixed(1)} kPa   ρ = ${state.rho.toFixed(0)} kg/m³   g = ${state.g.toFixed(2)} m/s²`, w*0.03, hTop*0.06);
    }

    function drawGraph(w, hTop, hBot) {
      const panelTop = hTop;
      const plotX0 = w*0.14, plotX1 = w*0.90;
      const plotY0 = panelTop + hBot*0.14, plotY1 = panelTop + hBot*0.80;

      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath(); ctx.moveTo(0,panelTop); ctx.lineTo(w,panelTop); ctx.stroke();

      const Pmax = state.P0_kPa*1000 + state.rho*state.g*H_MAX;
      function xPx(hv) { return plotX0 + (hv/H_MAX)*(plotX1-plotX0); }
      function yPx(P) { return plotY1 - (P/Pmax)*(plotY1-plotY0); }

      // gridlines
      ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1;
      for (let hv=0; hv<=H_MAX; hv+=200) {
        const x=xPx(hv); ctx.beginPath(); ctx.moveTo(x,plotY0); ctx.lineTo(x,plotY1); ctx.stroke();
      }

      // axes
      ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=1.2;
      ctx.beginPath();
      ctx.moveTo(plotX0,plotY0); ctx.lineTo(plotX0,plotY1); ctx.lineTo(plotX1,plotY1);
      ctx.stroke();

      ctx.font = `${Math.max(9,w*0.016)}px 'DM Mono', monospace`;
      ctx.fillStyle='rgba(230,224,212,0.6)';
      ctx.textAlign='center';
      for (let hv=0; hv<=H_MAX; hv+=200) ctx.fillText(hv+'m', xPx(hv), plotY1+16);
      ctx.textAlign='right';
      ctx.fillText((Pmax/1000).toFixed(0)+' kPa', plotX0-6, plotY0+4);
      ctx.fillText((state.P0_kPa).toFixed(0)+' kPa', plotX0-6, plotY1+4);

      // P(h) line
      ctx.beginPath();
      ctx.moveTo(xPx(0), yPx(state.P0_kPa*1000));
      ctx.lineTo(xPx(H_MAX), yPx(Pmax));
      ctx.strokeStyle = '#4ECDC4'; ctx.lineWidth=2; ctx.stroke();
      ctx.lineTo(plotX1,plotY1); ctx.lineTo(plotX0,plotY1); ctx.closePath();
      ctx.fillStyle='rgba(78,205,196,0.08)'; ctx.fill();

      // current point
      const curX = xPx(state.h), curY = yPx(Pf_Pa());
      ctx.beginPath(); ctx.moveTo(curX,curY); ctx.lineTo(curX,plotY1);
      ctx.strokeStyle='rgba(247,131,172,0.5)'; ctx.setLineDash([3,3]); ctx.lineWidth=1;
      ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(curX,curY,4.5,0,2*Math.PI); ctx.fillStyle='#F783AC'; ctx.fill();

      ctx.fillStyle='rgba(230,224,212,0.5)';
      ctx.textAlign='left';
      ctx.fillText('P(h) = P₀ + ρgh — a straight line, slope ρg', w*0.03, panelTop+16);
    }

    function updateReadout() {
      document.getElementById('rPf').textContent = Pf_kPa().toFixed(2) + ' kPa';
      document.getElementById('rAtm').textContent = Pf_atm().toFixed(3) + ' atm';
      document.getElementById('rAdded').textContent = (addedPressurePa()/1000).toFixed(2) + ' kPa';
      document.getElementById('rh').textContent = state.h.toFixed(1) + ' m';
    }

    function frame() {
      _simRaf = requestAnimationFrame(frame);
      render();
    }
    _simRaf = requestAnimationFrame(frame);
  }
};


// ─── MATH RENDERING ──────────────────────────────────────────────────────────
function renderMath() {
  if (window.renderMathInElement) {
    renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false}
      ]
    });
  }
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
function init() {
  renderDict(DICT);
  setFcFilter('', document.querySelector('.fc-filter button'));
  renderMath();
}

if (window.katex && window.renderMathInElement) {
  init();
} else {
  window.addEventListener('load', init);
}
</script>
