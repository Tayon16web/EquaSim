      internalGlow.addColorStop(
        0,
        'rgba(255,255,255,0.18)'
      );


      internalGlow.addColorStop(
        0.55,
        'rgba(255,246,226,0.05)'
      );


      internalGlow.addColorStop(
        1,
        'rgba(255,255,255,0)'
      );


      ctx.fillStyle =
        internalGlow;


      ctx.fill();


      // Glass outline

      ctx.strokeStyle =
        'rgba(255,246,226,0.74)';


      ctx.lineWidth = 1.7;

      ctx.stroke();


      // ========================================================
      // SPECULAR HIGHLIGHT
      // ========================================================

      ctx.beginPath();


      ctx.moveTo(
        leftX + 3,
        -halfH * 0.76
      );


      ctx.quadraticCurveTo(
        leftX + 6,
        0,
        leftX + 3,
        halfH * 0.76
      );


      ctx.strokeStyle =
        'rgba(255,250,239,0.30)';


      ctx.lineWidth = 1.4;

      ctx.stroke();


      ctx.restore();


      // ========================================================
      // FOCAL POINTS
      // ========================================================

      if (qFiniteF) {

        [
          [-f, 'F'],
          [f, "F'"]
        ].forEach(
          ([xf, label]) => {

            const px =
              xf * pxX;


            ctx.save();


            // Glow

            ctx.beginPath();

            ctx.arc(
              px,
              0,
              5.5,
              0,
              Math.PI * 2
            );


            ctx.fillStyle =
              'rgba(255,209,102,0.11)';


            ctx.shadowColor =
              'rgba(255,209,102,0.78)';


            ctx.shadowBlur = 13;

            ctx.fill();


            // Core

            ctx.beginPath();

            ctx.arc(
              px,
              0,
              2.15,
              0,
              Math.PI * 2
            );


            ctx.fillStyle =
              'rgba(255,228,148,0.98)';


            ctx.fill();


            // Crosshair

            ctx.beginPath();

            ctx.moveTo(
              px,
              -8
            );

            ctx.lineTo(
              px,
              8
            );


            ctx.strokeStyle =
              'rgba(255,222,132,0.84)';


            ctx.lineWidth = 1.2;

            ctx.stroke();


            // Label

            ctx.fillStyle =
              'rgba(255,231,174,0.96)';


            ctx.font =
              `${Math.max(
                10,
                w * 0.021
              )}px 'DM Mono', monospace`;


            ctx.textAlign =
              'center';


            ctx.fillText(
              label,
              px,
              22
            );


            ctx.restore();
          }
        );
      }


      // ========================================================
      // LIGHT RAYS
      // ========================================================

      const heights =
        [
          -0.75,
          -0.35,
          0.35,
          0.75
        ].map(
          v => v * halfH
        );


      heights.forEach(
        (hy, i) => {

          // Incoming ray

          drawRay(
            -w / 2,
            hy,
            leftX,
            hy,
            '#4ECDC4',
            false,
            {
              width: 1.8,
              glow: 0.32
            }
          );


          // Moving photon

          animatePhoton(
            -w / 2,
            hy,
            leftX,
            hy,
            i / 4,
            '#4ECDC4'
          );


          if (qFiniteF) {

            traceRay(
              rightX,
              hy,
              f * pxX,
              0,
              +1,
              '#4ECDC4',
              i / 4
            );

          } else {

            // No optical power

            drawRay(
              rightX,
              hy,
              w / 2,
              hy,
              '#4ECDC4',
              false,
              {
                width: 1.8,
                glow: 0.30
              }
            );


            animatePhoton(
              rightX,
              hy,
              w / 2,
              hy,
              i / 4,
              '#4ECDC4'
            );
          }
        }
      );
     
      // LIGHT FLARE AT LENS

      ctx.save();


      const flare =
        ctx.createRadialGradient(
          leftX,
          0,
          0,
          leftX,
          0,
          halfH * 0.9
        );


      flare.addColorStop(
        0,
        'rgba(255,255,255,0.12)'
      );


      flare.addColorStop(
        1,
        'rgba(255,255,255,0)'
      );


      ctx.fillStyle =
        flare;


      ctx.fillRect(
        leftX - halfH,
        -halfH,
        halfH * 2,
        halfH * 2
      );


      ctx.restore();


      ctx.restore();


      // ========================================================
      // INFORMATION OVERLAY
      // ========================================================

      ctx.save();


      ctx.fillStyle =
        'rgba(230,238,247,0.80)';


      ctx.font =
        `${Math.max(
          9,
          w * 0.019
        )}px 'DM Mono', monospace`;


      ctx.textAlign =
        'left';


      ctx.fillText(

        `n_L = ${state.nL.toFixed(2)}   ` +
        `n_m = ${state.nm.toFixed(2)}   ` +
        `R₁ = ${state.R1.toFixed(1)} cm   ` +
        `R₂ = ${state.R2.toFixed(1)} cm`,

        w * 0.03,
        h * 0.08
      );


      ctx.fillStyle =
        'rgba(209,224,240,0.65)';


      ctx.fillText(

        qFiniteF
          ? `f = ${f.toFixed(2)} cm`
          : 'f = ∞ (no net power)',

        w * 0.03,
        h * 0.94
      );


      // LIVE indicator

      ctx.textAlign =
        'right';


      ctx.fillStyle =
        'rgba(151,230,218,0.70)';


      ctx.font =
        `${Math.max(
          8,
          w * 0.016
        )}px 'DM Mono', monospace`;


      ctx.fillText(
        '● LIVE',
        w * 0.97,
        h * 0.08
      );


      ctx.restore();


      updateReadout(
        f,
        qFiniteF
      );
    }


    // ============================================================
    // READOUT
    // ============================================================

    function updateReadout(
      f,
      qFiniteF
    ) {

      document
        .getElementById('rf')
        .textContent =
          qFiniteF
            ? f.toFixed(2) + ' cm'
            : '∞ (no net power)';


      document
        .getElementById('rrel')
        .textContent =
          relativeIndex()
            .toFixed(4);


      document
        .getElementById('rpower')
        .textContent =
          qFiniteF
            ? (
                (1 / f).toFixed(4) +
                ' cm⁻¹  (' +
                (100 / f).toFixed(2) +
                ' D)'
              )
            : '0';


      document
        .getElementById('rshape')
        .textContent =
          lensShape();


      document
        .getElementById('rbehavior')
        .textContent =
          !qFiniteF
            ? 'No net focusing'
            : (
                f > 0
                  ? 'Converging'
                  : 'Diverging'
              );
    }


    // ============================================================
    // ANIMATION LOOP
    // ============================================================

    function frame() {

      _simRaf =
        requestAnimationFrame(
          frame
        );


      render();
    }


    // Draw immediately
    render();


    // Start animation
    _simRaf =
      requestAnimationFrame(
        frame
      );
  }
};


SIMS['dyn-f3'] = {
  title: "Newton's Second Law — Multiple Forces",
  subtitle: "Adjust up to three force vectors (magnitude + angle) and the mass — watch them add tip-to-tail into a net force, and see the object accelerate along it.",

  build(host) {
    const state = {
      m: 4,
      forces: [
        { mag: 20, angDeg: 30 },
        { mag: 15, angDeg: 160 },
        { mag: 10, angDeg: 260 },
      ],
      pos: { x: 0, y: 0 },
      vel: { x: 0, y: 0 },
    };
    const COLORS = ['#FFD166', '#4ECDC4', '#F783AC'];

    host.insertAdjacentHTML('beforeend', `
      <div class="sim-layout">
        <div class="sim-canvas-wrap"><canvas id="nsl-canvas"></canvas></div>
        <div class="sim-panel">

          <div class="sim-equation">
            <div class="eq-label">Equation</div>
            <div class="eq-display">$$\\Sigma \\vec{F} = \\vec{F}_1 + \\vec{F}_2 + \\cdots + \\vec{F}_n = m\\vec{a}$$</div>
            <div style="font-size:0.75rem;opacity:0.6;margin-top:6px;">
              Force is a vector — direction matters as much as magnitude. Set any force's magnitude to 0 to remove it from the sum.
            </div>
          </div>

          <div class="sim-controls">
            <h3>Variables</h3>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">m</span> — mass</span>
                <span class="sl-val" id="lm">4.0 kg</span>
              </div>
              <input type="range" id="sm" min="0.5" max="20" step="0.1" value="4">
            </div>
            ${[1,2,3].map(i => `
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name" style="color:${COLORS[i-1]}"><span class="sl-sym">F${i}</span> — magnitude</span>
                <span class="sl-val" id="lF${i}mag">— N</span>
              </div>
              <input type="range" id="sF${i}mag" min="0" max="50" step="0.5" value="${state.forces[i-1].mag}">
              <div class="sl-header" style="margin-top:6px;">
                <span class="sl-name" style="color:${COLORS[i-1]}"><span class="sl-sym">F${i}</span> — angle</span>
                <span class="sl-val" id="lF${i}ang">—°</span>
              </div>
              <input type="range" id="sF${i}ang" min="0" max="359" step="1" value="${state.forces[i-1].angDeg}">
            </div>`).join('')}
          </div>

          <div class="sim-readout">
            <h3>Live Readout</h3>
            <div class="readout-row"><span class="rkey">Net force ΣF</span><span class="rval hi" id="rFnet">—</span></div>
            <div class="readout-row"><span class="rkey">Net force direction</span><span class="rval" id="rFang">—</span></div>
            <div class="readout-row"><span class="rkey">Acceleration a = ΣF/m</span><span class="rval" id="ra">—</span></div>
            <div class="readout-row"><span class="rkey">ΣFx , ΣFy</span><span class="rval" id="rcomp">—</span></div>
          </div>

          <div class="sim-legend">
            <h3>Legend</h3>
            <div class="legend-row"><div class="legend-dot" style="background:#FFD166"></div>F₁</div>
            <div class="legend-row"><div class="legend-dot" style="background:#4ECDC4"></div>F₂</div>
            <div class="legend-row"><div class="legend-dot" style="background:#F783AC"></div>F₃</div>
            <div class="legend-row"><div class="legend-dot" style="background:#E6E0D4"></div>Net force ΣF</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#5B8DEF"></div>Acceleration a (object's path)</div>
          </div>
        </div>
      </div>`);

    renderMath();

    // ── Canvas ──
    const canvas = document.getElementById('nsl-canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    function resize() {
      const w = canvas.parentElement.clientWidth;
      const h = Math.max(400, w * 0.95);
      canvas.width  = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
      state.pos = { x: 0, y: 0 };
      state.vel = { x: 0, y: 0 };
    }
    resize();
    const _ro = new ResizeObserver(resize);
    _ro.observe(canvas.parentElement);

    // ── Sliders ──
    function readSliders() {
      state.m = parseFloat(document.getElementById('sm').value);
      document.getElementById('lm').textContent = state.m.toFixed(1) + ' kg';
      for (let i=1;i<=3;i++) {
        state.forces[i-1].mag = parseFloat(document.getElementById(`sF${i}mag`).value);
        state.forces[i-1].angDeg = parseFloat(document.getElementById(`sF${i}ang`).value);
        document.getElementById(`lF${i}mag`).textContent = state.forces[i-1].mag.toFixed(1) + ' N';
        document.getElementById(`lF${i}ang`).textContent = state.forces[i-1].angDeg.toFixed(0) + '°';
      }
      state.pos = { x: 0, y: 0 };
      state.vel = { x: 0, y: 0 };
    }
    ['sm','sF1mag','sF1ang','sF2mag','sF2ang','sF3mag','sF3ang'].forEach(id =>
      document.getElementById(id).addEventListener('input', readSliders));

    // ── Physics ──
    function forceComponents(f) {
      const rad = f.angDeg * Math.PI / 180;
      return { x: f.mag * Math.cos(rad), y: f.mag * Math.sin(rad) };
    }
    function netForce() {
      let x = 0, y = 0;
      state.forces.forEach(f => { const c = forceComponents(f); x += c.x; y += c.y; });
      return { x, y };
    }
    function netForceMag(nf) { return Math.hypot(nf.x, nf.y); }
    function netForceAngleDeg(nf) { return (Math.atan2(nf.y, nf.x) * 180/Math.PI + 360) % 360; }

    // ── Layout ──
    function W() { return canvas.width / dpr; }
    function H() { return canvas.height / dpr; }
    function topH(h) { return h * 0.62; }

    function drawArrow(x0,y0,x1,y1,color,width) {
      if (Math.hypot(x1-x0,y1-y0) < 1) return;
      const ang = Math.atan2(y1-y0, x1-x0);
      const hl = 9;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1);
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x1,y1);
      ctx.lineTo(x1 - hl*Math.cos(ang-0.42), y1 - hl*Math.sin(ang-0.42));
      ctx.lineTo(x1 - hl*Math.cos(ang+0.42), y1 - hl*Math.sin(ang+0.42));
      ctx.closePath(); ctx.fillStyle = color; ctx.fill();
    }

    function drawScene(w, hTop, nf, dt) {
      const cx = w/2, cy = hTop*0.5;
      const pxPerN = Math.min(w,hTop) * 0.30 / 50; // fits max single force (50N) comfortably

      // subtle grid
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      const step = Math.min(w,hTop)*0.1;
      for (let x=cx%step; x<w; x+=step) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,hTop); ctx.stroke(); }
      for (let y=cy%step; y<hTop; y+=step) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }

      // integrate simple motion under net acceleration, resetting if it drifts off-scene.
      // DEMO_SPEED_SCALE is a purely cosmetic pacing factor (not physically
      // meaningful) so the drift stays visible across the whole slider range —
      // real accelerations here span ~0.03 to 100 m/s², which without scaling
      // would look either imperceptibly slow or instantaneous.
      const DEMO_SPEED_SCALE = 4;
      const a = { x: nf.x/state.m, y: nf.y/state.m };
      state.vel.x += a.x * dt * DEMO_SPEED_SCALE; state.vel.y -= a.y * dt * DEMO_SPEED_SCALE; // canvas y is flipped
      state.pos.x += state.vel.x * dt; state.pos.y += state.vel.y * dt;
      const maxDrift = Math.min(w,hTop) * 0.32;
      if (Math.hypot(state.pos.x, state.pos.y) > maxDrift) { state.pos = {x:0,y:0}; state.vel = {x:0,y:0}; }

      const objX = cx + state.pos.x, objY = cy + state.pos.y;

      // faint drift trail circle boundary (visual only)
      ctx.beginPath(); ctx.arc(cx, cy, maxDrift, 0, 2*Math.PI);
      ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1; ctx.stroke();

      // individual force vectors, all drawn from the object's current position
      state.forces.forEach((f, i) => {
        const c = forceComponents(f);
        const tipX = objX + c.x*pxPerN, tipY = objY - c.y*pxPerN;
        drawArrow(objX, objY, tipX, tipY, COLORS[i], 2.2);
      });

      // net force vector (thicker, off-white)
      const netTipX = objX + nf.x*pxPerN, netTipY = objY - nf.y*pxPerN;
      drawArrow(objX, objY, netTipX, netTipY, '#E6E0D4', 3);

      // object
      const objR = Math.max(10, Math.min(w,hTop)*0.028);
      const g = ctx.createRadialGradient(objX,objY,0,objX,objY,objR*2.2);
      g.addColorStop(0,'rgba(91,141,239,0.5)'); g.addColorStop(1,'rgba(91,141,239,0)');
      ctx.beginPath(); ctx.arc(objX,objY,objR*2.2,0,2*Math.PI); ctx.fillStyle=g; ctx.fill();
      ctx.beginPath(); ctx.arc(objX,objY,objR,0,2*Math.PI); ctx.fillStyle='#5B8DEF'; ctx.fill();

      ctx.fillStyle = 'rgba(230,224,212,0.9)';
      ctx.font = `${Math.max(10,w*0.024)}px 'DM Mono', monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(`ΣF = ${netForceMag(nf).toFixed(1)} N`, netTipX, netTipY - 12);

      ctx.fillStyle = 'rgba(230,224,212,0.5)';
      ctx.textAlign = 'left';
      ctx.fillText('Object drifts along ΣF (resets when it drifts off-scene)', w*0.03, hTop*0.06);
    }

    function drawVectorSum(w, hTop, hBot, nf) {
      const panelTop = hTop, panelH = hBot;
      const originX = w*0.18, originY = panelTop + panelH*0.55;
      const pxPerN = Math.min(w, panelH) * 0.55 / Math.max(50, netForceMag(nf));

      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath(); ctx.moveTo(0, panelTop); ctx.lineTo(w, panelTop); ctx.stroke();

      // head-to-tail construction of F1 + F2 + F3
      let px = originX, py = originY;
      state.forces.forEach((f,i) => {
        const c = forceComponents(f);
        const tipX = px + c.x*pxPerN, tipY = py - c.y*pxPerN;
        drawArrow(px, py, tipX, tipY, COLORS[i], 2.2);
        ctx.fillStyle = COLORS[i];
        ctx.font = `${Math.max(9,w*0.018)}px 'DM Mono', monospace`;
        ctx.textAlign = 'left';
        ctx.fillText(`F${i+1}`, tipX+6, tipY-4);
        px = tipX; py = tipY;
      });

      // resultant: straight line from origin to final tip
      drawArrow(originX, originY, px, py, '#E6E0D4', 3);
      ctx.fillStyle = 'rgba(230,224,212,0.95)';
      ctx.font = `${Math.max(10,w*0.02)}px 'DM Mono', monospace`;
      ctx.textAlign = 'left';
      ctx.fillText('ΣF', px+8, py+4);

      ctx.fillStyle = 'rgba(230,224,212,0.5)';
      ctx.textAlign = 'left';
      ctx.fillText('Tip-to-tail construction: F₁ + F₂ + F₃ = ΣF', w*0.03, panelTop + 16);
    }

    function updateReadout(nf) {
      const mag = netForceMag(nf);
      const ang = netForceAngleDeg(nf);
      const aMag = mag / state.m;
      document.getElementById('rFnet').textContent = mag.toFixed(2) + ' N';
      document.getElementById('rFang').textContent = ang.toFixed(1) + '°';
      document.getElementById('ra').textContent = aMag.toFixed(3) + ' m/s²';
      document.getElementById('rcomp').textContent = `${nf.x.toFixed(2)} N , ${nf.y.toFixed(2)} N`;
    }

    // ── Animation loop ──
    let last = null;
    function frame(ts) {
      _simRaf = requestAnimationFrame(frame);
      const dt = last ? Math.min((ts - last)/1000, 0.05) : 0;
      last = ts;

      const w = W(), h = H();
      const hTop = topH(h);
      const hBot = h - hTop;
      const nf = netForce();

      ctx.clearRect(0,0,w,h);
      drawScene(w, hTop, nf, dt);
      drawVectorSum(w, hTop, hBot, nf);
      updateReadout(nf);
    }
    _simRaf = requestAnimationFrame(frame);
  }
};


SIMS['dyn-friction'] = {
  title: "Friction Force",
  subtitle: "Adjust the incline angle, coefficient of friction, gravity, and mass — see whether the block stays put or slides, with f capped at μN.",

  build(host) {
    const state = { angleDeg: 25, mu: 0.4, g: 9.8, m: 4, s: 0, v: 0 };
    const RAMP_L = 230; // fixed hypotenuse length in px, so height/width stay bounded as angle changes

    // Deterministic decorative scenery (generated once so it doesn't jitter every frame)
    const scenery = {
      clouds: [0.12, 0.32, 0.55].map((fx,i) => ({ fx, fy: 0.10 + (i%2)*0.05, scale: 0.8 + i*0.15 })),
      mountainsBack: seededPoints(7, 1),
      mountainsFront: seededPoints(6, 2),
      trees: [0.05,0.13,0.20,0.28,0.36].map((fx,i) => ({ fx, scale: 0.8 + ((i*37)%40)/100 })),
    };
    function seededPoints(n, seed) {
      const pts = [];
      let s = seed*999;
      for (let i=0;i<=n;i++) {
        s = (s*9301+49297) % 233280;
        pts.push(s/233280);
      }
      return pts;
    }

    host.insertAdjacentHTML('beforeend', `
      <div class="sim-layout">
        <div class="sim-canvas-wrap"><canvas id="fric-canvas"></canvas></div>
        <div class="sim-panel">

          <div class="sim-equation">
            <div class="eq-label">Equation</div>
            <div class="eq-display">$$f \\le \\mu N$$</div>
            <div style="font-size:0.75rem;opacity:0.6;margin-top:6px;">
              Friction only supplies as much force as needed to prevent sliding, up to the maximum μN. Beyond that, the block slides and kinetic friction (here taken equal to μN) acts up the slope.
            </div>
          </div>

          <div class="sim-controls">
            <h3>Variables</h3>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">θ</span> — incline angle</span>
                <span class="sl-val" id="lang">25.0°</span>
              </div>
              <input type="range" id="sang" min="0" max="70" step="0.5" value="25">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">μ</span> — coefficient of friction</span>
                <span class="sl-val" id="lmu">0.40</span>
              </div>
              <input type="range" id="smu" min="0" max="1.2" step="0.01" value="0.4">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">g</span> — gravity</span>
                <span class="sl-val" id="lg">9.80 m/s²</span>
              </div>
              <input type="range" id="sg" min="1" max="20" step="0.1" value="9.8">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">m</span> — block mass</span>
                <span class="sl-val" id="lm">4.0 kg</span>
              </div>
              <input type="range" id="sm" min="0.5" max="20" step="0.1" value="4">
            </div>
          </div>

          <div class="sim-readout">
            <h3>Live Readout</h3>
            <div class="readout-row"><span class="rkey">State</span><span class="rval hi" id="rstate">—</span></div>
            <div class="readout-row"><span class="rkey">Normal force N</span><span class="rval" id="rN">—</span></div>
            <div class="readout-row"><span class="rkey">Required friction (mg sinθ)</span><span class="rval" id="rreq">—</span></div>
            <div class="readout-row"><span class="rkey">Max static friction (μN)</span><span class="rval" id="rmax">—</span></div>
            <div class="readout-row"><span class="rkey">Actual friction f</span><span class="rval" id="ract">—</span></div>
            <div class="readout-row"><span class="rkey">Acceleration (if sliding)</span><span class="rval" id="racc">—</span></div>
          </div>

          <div class="sim-legend">
            <h3>Legend</h3>
            <div class="legend-row"><div class="legend-dot" style="background:#5B8DEF"></div>Gravity (mg)</div>
            <div class="legend-row"><div class="legend-dot" style="background:#4ECDC4"></div>Normal force (N)</div>
            <div class="legend-row"><div class="legend-dot" style="background:#F783AC"></div>Friction (f)</div>
            <div class="legend-row"><div class="legend-dot" style="background:#D9B382"></div>Block</div>
          </div>
        </div>
      </div>`);

    renderMath();

    // ── Canvas ──
    const canvas = document.getElementById('fric-canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    function resize() {
      const w = canvas.parentElement.clientWidth;
      const h = Math.max(400, w * 0.85);
      canvas.width  = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }
    resize();
    const _ro = new ResizeObserver(resize);
    _ro.observe(canvas.parentElement);

    // ── Sliders ──
    function readSliders() {
      state.angleDeg = parseFloat(document.getElementById('sang').value);
      state.mu = parseFloat(document.getElementById('smu').value);
      state.g  = parseFloat(document.getElementById('sg').value);
      state.m  = parseFloat(document.getElementById('sm').value);
      document.getElementById('lang').textContent = state.angleDeg.toFixed(1) + '°';
      document.getElementById('lmu').textContent  = state.mu.toFixed(2);
      document.getElementById('lg').textContent   = state.g.toFixed(2) + ' m/s²';
      document.getElementById('lm').textContent   = state.m.toFixed(1) + ' kg';
      state.s = RAMP_L * 0.4; state.v = 0;
    }
    ['sang','smu','sg','sm'].forEach(id => document.getElementById(id).addEventListener('input', readSliders));

    // ── Physics ──
    function theta() { return state.angleDeg * Math.PI / 180; }
    function normalForce() { return state.m * state.g * Math.cos(theta()); }
    function requiredFriction() { return state.m * state.g * Math.sin(theta()); }
    function maxFriction() { return state.mu * normalForce(); }
    function isSliding() { return requiredFriction() > maxFriction() + 1e-9; }
    function slideAccel() { return state.g * (Math.sin(theta()) - state.mu * Math.cos(theta())); }

    // ── Layout / drawing ──
    function W() { return canvas.width / dpr; }
    function H() { return canvas.height / dpr; }

    function drawSky(w, h, groundY) {
      const grad = ctx.createLinearGradient(0,0,0,groundY);
      grad.addColorStop(0, '#1b2a4a');
      grad.addColorStop(0.55, '#3d5a80');
      grad.addColorStop(1, '#e8b97a');
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,w,groundY);

      // sun
      const sunX = w*0.82, sunY = groundY*0.28, sunR = Math.min(w,h)*0.045;
      const sg = ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,sunR*3);
      sg.addColorStop(0,'rgba(255,222,150,0.9)');
      sg.addColorStop(1,'rgba(255,222,150,0)');
      ctx.beginPath(); ctx.arc(sunX,sunY,sunR*3,0,2*Math.PI); ctx.fillStyle=sg; ctx.fill();
      ctx.beginPath(); ctx.arc(sunX,sunY,sunR,0,2*Math.PI); ctx.fillStyle='#FFE9B0'; ctx.fill();

      // clouds
      scenery.clouds.forEach(c => {
        const cx = c.fx*w, cy = c.fy*groundY, s = c.scale*Math.min(w,h)*0.03;
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        [[-1.2,0],[0,-0.3],[1.1,0],[0,0.35]].forEach(([dx,dy]) => {
          ctx.beginPath(); ctx.ellipse(cx+dx*s, cy+dy*s, s*1.3, s*0.85, 0, 0, 2*Math.PI); ctx.fill();
        });
      });
    }

    function drawMountainLayer(points, w, groundY, baseHeightFrac, color) {
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      const n = points.length;
      for (let i=0;i<n;i++) {
        const x = (i/(n-1))*w;
        const peak = groundY - baseHeightFrac*groundY*(0.4+0.6*points[i]);
        ctx.lineTo(x, peak);
      }
      ctx.lineTo(w, groundY);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    }

    function drawTree(x, groundY, scale) {
      const trunkW = 5*scale, trunkH = 18*scale;
      ctx.fillStyle = 'rgba(90,62,40,0.9)';
      ctx.fillRect(x-trunkW/2, groundY-trunkH, trunkW, trunkH);
      ctx.fillStyle = 'rgba(45,90,55,0.92)';
      for (let i=0;i<3;i++) {
        const y = groundY - trunkH - i*13*scale;
        const rw = (26 - i*6)*scale;
        ctx.beginPath();
        ctx.moveTo(x, y-20*scale);
        ctx.lineTo(x-rw/2, y);
        ctx.lineTo(x+rw/2, y);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawScene(w, h) {
      const groundY = h*0.80;
      drawSky(w, h, groundY);
      drawMountainLayer(scenery.mountainsBack, w, groundY, 0.30, 'rgba(90,110,150,0.55)');
      drawMountainLayer(scenery.mountainsFront, w, groundY, 0.20, 'rgba(70,90,125,0.75)');

      // ground
      const gGrad = ctx.createLinearGradient(0,groundY,0,h);
      gGrad.addColorStop(0,'#4c7a4a'); gGrad.addColorStop(1,'#2f5231');
      ctx.fillStyle = gGrad;
      ctx.fillRect(0,groundY,w,h-groundY);

      scenery.trees.forEach(t => drawTree(t.fx*w, groundY, t.scale * Math.min(w,h)*0.012));

      // ── incline ramp ──
      const th = theta();
      const anchorX = w*0.40;
      const peakX = anchorX + RAMP_L*Math.cos(th);
      const peakY = groundY - RAMP_L*Math.sin(th);

      ctx.beginPath();
      ctx.moveTo(anchorX, groundY);
      ctx.lineTo(peakX, peakY);
      ctx.lineTo(peakX, groundY);
      ctx.closePath();
      const rampGrad = ctx.createLinearGradient(anchorX,groundY,peakX,peakY);
      rampGrad.addColorStop(0,'#8a6b52'); rampGrad.addColorStop(1,'#6b5340');
      ctx.fillStyle = rampGrad;
      ctx.fill();
      ctx.strokeStyle = 'rgba(40,28,20,0.6)'; ctx.lineWidth = 2; ctx.stroke();
      // plank lines on the sliding surface
      ctx.strokeStyle = 'rgba(40,28,20,0.25)'; ctx.lineWidth = 1;
      for (let i=1;i<6;i++) {
        const t = i/6;
        const x0 = anchorX + (peakX-anchorX)*t, y0 = groundY + (peakY-groundY)*t;
        const nx = -Math.sin(th)*10, ny = -Math.cos(th)*10;
        ctx.beginPath(); ctx.moveTo(x0-nx,y0-ny); ctx.lineTo(x0+nx,y0+ny); ctx.stroke();
      }

      return { anchorX, peakX, peakY, groundY, th };
    }

    function drawArrow(x0,y0,x1,y1,color,width) {
      if (Math.hypot(x1-x0,y1-y0) < 1) return;
      const ang = Math.atan2(y1-y0, x1-x0);
      const hl = 8;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1);
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x1,y1);
      ctx.lineTo(x1 - hl*Math.cos(ang-0.42), y1 - hl*Math.sin(ang-0.42));
      ctx.lineTo(x1 - hl*Math.cos(ang+0.42), y1 - hl*Math.sin(ang+0.42));
      ctx.closePath(); ctx.fillStyle = color; ctx.fill();
    }

    function drawBlockAndForces(rampInfo, w, h) {
      const { anchorX, peakX, peakY, groundY, th } = rampInfo;
      const d = { x: -Math.cos(th), y: Math.sin(th) };   // unit vector, down-slope (peak → anchor)
      const nHat = { x: -Math.sin(th), y: -Math.cos(th) };  // unit outward normal

      const bx = peakX + state.s*d.x, by = peakY + state.s*d.y;
      const blockSize = Math.min(w,h)*0.045;

      // block, rotated to sit flush on the incline
      ctx.save();
      ctx.translate(bx, by);
      ctx.rotate(-th);
      ctx.translate(0, -blockSize*0.5);
      const bg = ctx.createLinearGradient(-blockSize/2,-blockSize/2,blockSize/2,blockSize/2);
      bg.addColorStop(0,'#E3C69A'); bg.addColorStop(1,'#B8895A');
      ctx.fillStyle = bg;
      ctx.fillRect(-blockSize/2,-blockSize/2,blockSize,blockSize);
      ctx.strokeStyle = 'rgba(60,40,20,0.7)'; ctx.lineWidth = 1.5;
      ctx.strokeRect(-blockSize/2,-blockSize/2,blockSize,blockSize);
      ctx.restore();

      // force vectors, from block center
      const N = normalForce(), fReq = requiredFriction(), fMax = maxFriction();
      const sliding = isSliding();
      const fActual = sliding ? fMax : fReq;
      const maxForceRef = Math.max(state.m*state.g, 1);
      const pxPerN = (Math.min(w,h)*0.16) / maxForceRef;

      // gravity (world down)
      drawArrow(bx, by, bx, by + state.m*state.g*pxPerN, '#5B8DEF', 2.4);
      // normal
      drawArrow(bx, by, bx + nHat.x*N*pxPerN, by + nHat.y*N*pxPerN, '#4ECDC4', 2.4);
      // friction (up-slope, i.e. -d)
      if (fActual > 1e-6) {
        drawArrow(bx, by, bx - d.x*fActual*pxPerN, by - d.y*fActual*pxPerN, '#F783AC', 2.4);
      }

      ctx.font = `${Math.max(10,w*0.022)}px 'DM Mono', monospace`;
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(230,224,212,0.9)';
      ctx.fillText(sliding ? 'SLIDING' : 'STATIC', anchorX+8, groundY - RAMP_L*0.9);
    }

    function updateReadout() {
      const N = normalForce(), fReq = requiredFriction(), fMax = maxFriction();
      const sliding = isSliding();
      document.getElementById('rstate').textContent = sliding ? 'Sliding' : 'Static (in equilibrium)';
      document.getElementById('rN').textContent = N.toFixed(2) + ' N';
      document.getElementById('rreq').textContent = fReq.toFixed(2) + ' N';
      document.getElementById('rmax').textContent = fMax.toFixed(2) + ' N';
      document.getElementById('ract').textContent = (sliding ? fMax : fReq).toFixed(2) + ' N';
      document.getElementById('racc').textContent = sliding ? slideAccel().toFixed(3) + ' m/s²' : '0 (at rest)';
    }

    // ── Animation loop ──
    let last = null;
    function frame(ts) {
      _simRaf = requestAnimationFrame(frame);
      const dt = last ? Math.min((ts-last)/1000, 0.05) : 0;
      last = ts;

      if (isSliding()) {
        state.v += slideAccel() * dt;
        state.s += state.v * dt * 12; // cosmetic pacing, same reasoning as other sims: keeps demo speed reasonable across the slider range
        if (state.s > RAMP_L - 14) { state.s = 0; state.v = 0; }
      } else {
        state.v = 0;
      }

      const w = W(), h = H();
      ctx.clearRect(0,0,w,h);
      const rampInfo = drawScene(w,h);
      drawBlockAndForces(rampInfo, w, h);
      updateReadout();
    }
    _simRaf = requestAnimationFrame(frame);
  }
};


SIMS['q-infinitewell'] = {
  title: "Particle in a Box (Infinite Square Well)",
  subtitle: "Adjust the quantum number n, box width L, and particle mass — watch the wavefunction's shape change and see how the energy levels quantize.",

  build(host) {
    // Physical constants (SI)
    const HBAR = 1.054571817e-34;   // J·s
    const M_E  = 9.1093837015e-31;  // kg
    const EV   = 1.602176634e-19;   // J per eV

    const state = { n: 2, L_nm: 1.0, massLogRatio: 0, phase: 0 };
    const N_MAX_DIAGRAM = 8;

    host.insertAdjacentHTML('beforeend', `
      <div class="sim-layout">
        <div class="sim-canvas-wrap"><canvas id="pib-canvas"></canvas></div>
        <div class="sim-panel">

          <div class="sim-equation">
            <div class="eq-label">Equation</div>
            <div class="eq-display">$$\\psi_n(x) = \\sqrt{\\dfrac{2}{L}}\\sin\\!\\left(\\dfrac{n\\pi x}{L}\\right), \\qquad E_n = \\dfrac{n^2\\pi^2\\hbar^2}{2mL^2}$$</div>
            <div style="font-size:0.75rem;opacity:0.6;margin-top:6px;">
              Infinite potential well: ψ = 0 at the walls, so only standing waves with n half-wavelengths fit — that's the quantization.
              Phase oscillation shown here is slowed down enormously for visibility (real ω = E_n/ħ is ~10¹⁵ rad/s for an electron in a nm-scale box).
            </div>
          </div>

          <div class="sim-controls">
            <h3>Variables</h3>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">n</span> — quantum number</span>
                <span class="sl-val" id="ln">2</span>
              </div>
              <input type="range" id="sn" min="1" max="8" step="1" value="2">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">L</span> — box width</span>
                <span class="sl-val" id="lL">1.00 nm</span>
              </div>
              <input type="range" id="sL" min="0.1" max="5" step="0.05" value="1.0">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">m</span> — particle mass</span>
                <span class="sl-val" id="lm">1.00 mₑ</span>
              </div>
              <input type="range" id="sm" min="-0.3" max="3.26" step="0.01" value="0">
            </div>
          </div>

          <div class="sim-readout">
            <h3>Live Readout</h3>
            <div class="readout-row"><span class="rkey">Energy Eₙ</span><span class="rval hi" id="rE">—</span></div>
            <div class="readout-row"><span class="rkey">Nodes inside box</span><span class="rval" id="rnodes">—</span></div>
            <div class="readout-row"><span class="rkey">Wavelength (2L/n)</span><span class="rval" id="rlambda">—</span></div>
            <div class="readout-row"><span class="rkey">Spacing to Eₙ₊₁</span><span class="rval" id="rgap">—</span></div>
            <div class="readout-row"><span class="rkey">Mass (kg)</span><span class="rval" id="rmkg">—</span></div>
          </div>

          <div class="sim-legend">
            <h3>Legend</h3>
            <div class="legend-row"><div class="legend-line" style="border-color:#4ECDC4"></div>Re[Ψ(x,t)] (oscillates)</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#F783AC"></div>|ψₙ(x)|² (steady probability density)</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#8A7A65;border-top-style:dashed"></div>ψ = 0 (walls, x = 0 and x = L)</div>
            <div class="legend-row"><div class="legend-dot" style="background:#FFD166"></div>Current level (energy diagram)</div>
          </div>
        </div>
      </div>`);

    renderMath();

    // ── Canvas ──
    const canvas = document.getElementById('pib-canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    function resize() {
      const w = canvas.parentElement.clientWidth;
      const h = Math.max(400, w * 0.95);
      canvas.width  = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }
    resize();
    const _ro = new ResizeObserver(resize);
    _ro.observe(canvas.parentElement);

    // ── Sliders ──
    function massRatio() { return Math.pow(10, state.massLogRatio); } // in units of m_e
    function readSliders() {
      state.n = parseInt(document.getElementById('sn').value, 10);
      state.L_nm = parseFloat(document.getElementById('sL').value);
      state.massLogRatio = parseFloat(document.getElementById('sm').value);
      document.getElementById('ln').textContent = state.n.toString();
      document.getElementById('lL').textContent = state.L_nm.toFixed(2) + ' nm';
      const mr = massRatio();
      document.getElementById('lm').textContent = (mr < 10 ? mr.toFixed(2) : mr.toFixed(0)) + ' mₑ';
    }
    ['sn','sL','sm'].forEach(id => document.getElementById(id).addEventListener('input', readSliders));

    // ── Physics ──
    function L_m() { return state.L_nm * 1e-9; }
    function mass() { return massRatio() * M_E; }
    function energyJ(n) {
      const L = L_m();
      return (n*n * Math.PI*Math.PI * HBAR*HBAR) / (2 * mass() * L*L);
    }
    function energyEV(n) { return energyJ(n) / EV; }
    function psi(n, xFrac) { // xFrac in [0,1] = x/L; returns value of sqrt(2/L)*sin(...), in units of 1/sqrt(nm) for display scaling
      const Lnm = state.L_nm;
      return Math.sqrt(2/Lnm) * Math.sin(n*Math.PI*xFrac);
    }

    // ── Layout ──
    function W() { return canvas.width / dpr; }
    function H() { return canvas.height / dpr; }
    function topH(h) { return h * 0.56; }

    function drawWavePanel(w, hTop) {
      const boxX0 = w*0.10, boxX1 = w*0.92;
      const midY = hTop*0.55;
      const ampScale = hTop * 0.32;

      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(w,0); ctx.stroke();

      // baseline
      ctx.beginPath();
      ctx.moveTo(boxX0, midY); ctx.lineTo(boxX1, midY);
      ctx.strokeStyle = 'rgba(138,122,101,0.4)'; ctx.setLineDash([3,3]); ctx.lineWidth = 1;
      ctx.stroke(); ctx.setLineDash([]);

      // walls (infinite potential — hatched)
      [boxX0, boxX1].forEach(x => {
        ctx.beginPath(); ctx.moveTo(x, midY-ampScale*1.3); ctx.lineTo(x, midY+ampScale*1.3);
        ctx.strokeStyle = 'rgba(230,224,212,0.6)'; ctx.lineWidth = 3; ctx.stroke();
        for (let i=-6;i<=6;i++) {
          const y = midY + i*ampScale*1.3/6;
          const dir = x===boxX0 ? -1 : 1;
          ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+dir*8,y+8); ctx.strokeStyle='rgba(230,224,212,0.25)'; ctx.lineWidth=1; ctx.stroke();
        }
      });

      // normalize psi amplitude for display: peak value of sqrt(2/L)*1 at antinodes
      const psiMax = Math.sqrt(2/state.L_nm);

      // |psi|^2 (steady, filled), scaled to comparable visual height
      const probMax = psiMax*psiMax;
      ctx.beginPath();
      const steps = 200;
      for (let i=0;i<=steps;i++) {
        const xf = i/steps;
        const p = psi(state.n, xf);
        const prob = p*p;
        const x = boxX0 + xf*(boxX1-boxX0);
        const y = midY - (prob/probMax) * ampScale * 0.9;
        if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.lineTo(boxX1, midY); ctx.lineTo(boxX0, midY); ctx.closePath();
      ctx.fillStyle = 'rgba(247,131,172,0.12)'; ctx.fill();
      ctx.beginPath();
      for (let i=0;i<=steps;i++) {
        const xf = i/steps;
        const p = psi(state.n, xf);
        const prob = p*p;
        const x = boxX0 + xf*(boxX1-boxX0);
        const y = midY - (prob/probMax) * ampScale * 0.9;
        if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.strokeStyle = '#F783AC'; ctx.lineWidth = 2; ctx.stroke();

      // Re[Psi(x,t)] = psi_n(x) * cos(demo phase) — oscillating, illustrative pacing only
      ctx.beginPath();
      for (let i=0;i<=steps;i++) {
        const xf = i/steps;
        const p = psi(state.n, xf) / psiMax; // normalize to [-1,1]
        const x = boxX0 + xf*(boxX1-boxX0);
        const y = midY - p*Math.cos(state.phase)*ampScale;
        if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.strokeStyle = '#4ECDC4'; ctx.lineWidth = 2; ctx.stroke();

      ctx.fillStyle = 'rgba(230,224,212,0.6)';
      ctx.font = `${Math.max(9,w*0.02)}px 'DM Mono', monospace`;
      ctx.textAlign = 'left';
      ctx.fillText(`n = ${state.n}   L = ${state.L_nm.toFixed(2)} nm`, boxX0, 22);
      ctx.textAlign = 'center';
      ctx.fillText('x = 0', boxX0, midY + ampScale*1.3 + 18);
      ctx.fillText('x = L', boxX1, midY + ampScale*1.3 + 18);
    }

    function drawEnergyDiagram(w, hTop, hBot) {
      const panelTop = hTop;
      const plotX0 = w*0.12, plotX1 = w*0.78;
      const plotY0 = panelTop + hBot*0.10, plotY1 = panelTop + hBot*0.88;

      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath(); ctx.moveTo(0,panelTop); ctx.lineTo(w,panelTop); ctx.stroke();

      const Emax = energyEV(N_MAX_DIAGRAM);
      function yFor(E) { return plotY1 - (E/Emax) * (plotY1-plotY0); }

      // axis
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(plotX0, plotY0); ctx.lineTo(plotX0, plotY1); ctx.stroke();

      for (let level=1; level<=N_MAX_DIAGRAM; level++) {
        const E = energyEV(level);
        const y = yFor(E);
        const active = level === state.n;
        ctx.beginPath();
        ctx.moveTo(plotX0, y); ctx.lineTo(plotX1, y);
        ctx.strokeStyle = active ? '#FFD166' : 'rgba(230,224,212,0.35)';
        ctx.lineWidth = active ? 3 : 1.3;
        ctx.stroke();
        ctx.fillStyle = active ? '#FFD166' : 'rgba(230,224,212,0.55)';
        ctx.font = `${Math.max(9,w*0.018)}px 'DM Mono', monospace`;
        ctx.textAlign = 'left';
        ctx.fillText(`n=${level}  E=${E.toFixed(3)} eV`, plotX1+8, y+4);
      }

      ctx.fillStyle = 'rgba(230,224,212,0.5)';
      ctx.textAlign = 'left';
      ctx.font = `${Math.max(9,w*0.02)}px 'DM Mono', monospace`;
      ctx.fillText(`Energy levels (Eₙ ∝ n²)`, w*0.03, panelTop+16);
    }

    function updateReadout() {
      const E = energyEV(state.n);
      const Enext = energyEV(state.n+1);
      const lambda_nm = 2*state.L_nm/state.n;
      document.getElementById('rE').textContent = E.toFixed(4) + ' eV';
      document.getElementById('rnodes').textContent = (state.n-1).toString();
      document.getElementById('rlambda').textContent = lambda_nm.toFixed(3) + ' nm';
      document.getElementById('rgap').textContent = (Enext-E).toFixed(4) + ' eV';
      document.getElementById('rmkg').textContent = mass().toExponential(3) + ' kg';
    }

    // ── Animation loop ──
    let last = null;
    function frame(ts) {
      _simRaf = requestAnimationFrame(frame);
      const dt = last ? Math.min((ts-last)/1000, 0.05) : 0;
      last = ts;

      // Illustrative phase rate only — preserves the qualitative E_n ∝ n²
      // scaling (higher n visibly oscillates faster) without attempting to
      // show the true (utterly imperceptible-by-eye-either-way) timescale.
      state.phase += dt * 0.6 * state.n * state.n;

      const w = W(), h = H();
      const hTop = topH(h);
      const hBot = h - hTop;
      ctx.clearRect(0,0,w,h);
      drawWavePanel(w, hTop);
      drawEnergyDiagram(w, hTop, hBot);
      updateReadout();
    }
    _simRaf = requestAnimationFrame(frame);
  }
};

SIMS['boltzmann-wien'] = {
  title: "Stefan–Boltzmann Law — Star",
  subtitle: "Adjust a star's temperature, radius, and emissivity — watch its power output, color, and peak emission wavelength (Wien's law) all respond together.",

  build(host) {
    // Physical constants (SI)
    const SIGMA = 5.670374419e-8;   // W/(m²·K⁴), Stefan–Boltzmann constant
    const WIEN_B = 2.897771955e-3;  // m·K, Wien's displacement constant
    const R_SUN = 6.957e8;          // m
    const L_SUN = 3.828e26;         // W
    const H = 6.62607015e-34, C = 2.99792458e8, KB = 1.380649e-23; // Planck's law constants

    const state = { T: 5800, R: 1.0, e: 1.0 };

    host.insertAdjacentHTML('beforeend', `
      <div class="sim-layout">
        <div class="sim-canvas-wrap"><canvas id="sb-canvas"></canvas></div>
        <div class="sim-panel">

          <div class="sim-equation">
            <div class="eq-label">Equation</div>
            <div class="eq-display">$$P = \\sigma A e T^4 \\qquad\\qquad \\lambda_{max} = \\dfrac{b}{T}$$</div>
            <div style="font-size:0.75rem;opacity:0.6;margin-top:6px;">
              Stefan–Boltzmann gives total radiated power; Wien's law gives where in the spectrum that radiation peaks. Both come from the same blackbody curve.
            </div>
            <div style="font-size:0.78rem;opacity:0.85;margin-top:8px; line-height:1.5;">
              <b>T</b> = surface temperature &nbsp;·&nbsp; <b>A</b> = 4πR² &nbsp;·&nbsp; <b>e</b> = emissivity &nbsp;·&nbsp; <b>σ, b</b> = physical constants
            </div>
          </div>

          <div class="sim-controls">
            <h3>Variables</h3>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">T</span> — surface temperature</span>
                <span class="sl-val" id="lT">5800 K</span>
              </div>
              <input type="range" id="sT" min="2000" max="40000" step="50" value="5800">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">R</span> — radius</span>
                <span class="sl-val" id="lR">1.00 R☉</span>
              </div>
              <input type="range" id="sR" min="0.1" max="20" step="0.05" value="1.0">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">e</span> — emissivity</span>
                <span class="sl-val" id="le">1.00</span>
              </div>
              <input type="range" id="se" min="0.3" max="1.0" step="0.01" value="1.0">
            </div>
          </div>

          <div class="sim-readout">
            <h3>Live Readout</h3>
            <div class="readout-row"><span class="rkey">Power P</span><span class="rval hi" id="rP">—</span></div>
            <div class="readout-row"><span class="rkey">Luminosity (L☉)</span><span class="rval" id="rL">—</span></div>
            <div class="readout-row"><span class="rkey">Peak wavelength λ_max</span><span class="rval" id="rlambda">—</span></div>
            <div class="readout-row"><span class="rkey">Peak band</span><span class="rval" id="rband">—</span></div>
            <div class="readout-row"><span class="rkey">Surface area A</span><span class="rval" id="rA">—</span></div>
          </div>

          <div class="sim-legend">
            <h3>Legend</h3>
            <div class="legend-row"><div class="legend-dot" style="background:#FFD166"></div>Star (color ∝ true blackbody temperature)</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#4ECDC4"></div>Planck spectral radiance curve</div>
            <div class="legend-row"><div class="legend-dot" style="background:#E6E0D4"></div>Peak (Wien's law, λ_max)</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#F783AC;border-top-style:dashed"></div>Visible-light band (380–700 nm)</div>
          </div>
        </div>
      </div>`);

    renderMath();

    // ── Canvas ──
    const canvas = document.getElementById('sb-canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    function resize() {
      const w = canvas.parentElement.clientWidth;
      const h = Math.max(400, w * 0.95);
      canvas.width  = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }
    resize();
    const _ro = new ResizeObserver(resize);
    _ro.observe(canvas.parentElement);

    // ── Sliders ──
    function readSliders() {
      state.T = parseFloat(document.getElementById('sT').value);
      state.R = parseFloat(document.getElementById('sR').value);
      state.e = parseFloat(document.getElementById('se').value);
      document.getElementById('lT').textContent = state.T.toFixed(0) + ' K';
      document.getElementById('lR').textContent = state.R.toFixed(2) + ' R☉';
      document.getElementById('le').textContent = state.e.toFixed(2);
    }
    ['sT','sR','se'].forEach(id => document.getElementById(id).addEventListener('input', readSliders));

    // Formats a number as "m.mm × 10ⁿ" (real "×10", superscript exponent)
    // instead of JavaScript's native "m.mme+n" — used for P, L, and A since
    // all three naturally span many orders of magnitude across the sliders.
    const SUP_DIGITS = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
    function toSciNotation(value, sig) {
      if (value === 0) return '0';
      const exp = Math.floor(Math.log10(Math.abs(value)));
      const mantissa = value / Math.pow(10, exp);
      const mantissaStr = mantissa.toFixed(sig);
      const expStr = exp.toString().split('').map(ch => SUP_DIGITS[ch] || ch).join('');
      return `${mantissaStr} × 10${expStr}`;
    }

    // ── Physics ──
    function area() { const Rm = state.R * R_SUN; return 4 * Math.PI * Rm * Rm; }
    function power() { return SIGMA * area() * state.e * Math.pow(state.T, 4); }
    function lambdaMaxNm() { return (WIEN_B / state.T) * 1e9; }
    function peakBand(nm) {
      if (nm < 10) return 'X-ray';
      if (nm < 380) return 'Ultraviolet';
      if (nm <= 700) return 'Visible';
      if (nm < 1e6) return 'Infrared';
      return 'Microwave/Radio';
    }
    // Planck's law, relative spectral radiance (shape only, not absolute units)
    function planck(lambdaM, T) {
      const x = (H*C) / (lambdaM * KB * T);
      if (x > 700) return 0; // avoid overflow; contribution is negligible anyway
      return (1/Math.pow(lambdaM,5)) / (Math.exp(x) - 1);
    }

    // Blackbody temperature → approximate RGB color (simplified Tanner
    // Helland–style piecewise fit). Good enough for a star's on-screen tint,
    // not meant to be colorimetrically exact.
    function blackbodyRGB(Tk) {
      const t = Math.max(1000, Math.min(40000, Tk)) / 100;
      let r,g,b;
      if (t <= 66) r = 255;
      else r = Math.max(0, Math.min(255, 329.698727446 * Math.pow(t-60, -0.1332047592)));
      if (t <= 66) g = Math.max(0, Math.min(255, 99.4708025861*Math.log(t) - 161.1195681661));
      else g = Math.max(0, Math.min(255, 288.1221695283 * Math.pow(t-60, -0.0755148492)));
      if (t >= 66) b = 255;
      else if (t <= 19) b = 0;
      else b = Math.max(0, Math.min(255, 138.5177312231*Math.log(t-10) - 305.0447927307));
      return [Math.round(r), Math.round(g), Math.round(b)];
    }

    // ── Layout ──
    function W() { return canvas.width / dpr; }
    function H_() { return canvas.height / dpr; }
    function topH(h) { return h * 0.52; }

    function drawStarPanel(w, hTop) {
      // starfield background
      ctx.fillStyle = '#05070f';
      ctx.fillRect(0,0,w,hTop);
      let seed = 1234;
      function rnd() { seed = (seed*9301+49297)%233280; return seed/233280; }
      for (let i=0;i<70;i++) {
        const x = rnd()*w, y = rnd()*hTop, r = rnd()*1.3+0.2;
        ctx.beginPath(); ctx.arc(x,y,r,0,2*Math.PI);
        ctx.fillStyle = `rgba(255,255,255,${0.2+rnd()*0.5})`; ctx.fill();
      }

      const cx = w/2, cy = hTop/2;
      const [r,g,b] = blackbodyRGB(state.T);
      const starR = Math.max(14, Math.min(hTop*0.34, 22*Math.sqrt(state.R)));

      // glow
      const glow = ctx.createRadialGradient(cx,cy,0,cx,cy,starR*3.2);
      glow.addColorStop(0, `rgba(${r},${g},${b},0.55)`);
      glow.addColorStop(0.4, `rgba(${r},${g},${b},0.18)`);
      glow.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.beginPath(); ctx.arc(cx,cy,starR*3.2,0,2*Math.PI); ctx.fillStyle=glow; ctx.fill();

      // star disc with subtle limb darkening
      const disc = ctx.createRadialGradient(cx,cy,0,cx,cy,starR);
      disc.addColorStop(0, `rgb(${Math.min(255,r+30)},${Math.min(255,g+30)},${Math.min(255,b+20)})`);
      disc.addColorStop(0.75, `rgb(${r},${g},${b})`);
      disc.addColorStop(1, `rgb(${Math.round(r*0.6)},${Math.round(g*0.6)},${Math.round(b*0.6)})`);
      ctx.beginPath(); ctx.arc(cx,cy,starR,0,2*Math.PI); ctx.fillStyle = disc; ctx.fill();

      ctx.fillStyle = 'rgba(230,224,212,0.85)';
      ctx.font = `${Math.max(10,w*0.024)}px 'DM Mono', monospace`;
      ctx.textAlign = 'left';
      ctx.fillText(`T = ${state.T.toFixed(0)} K   R = ${state.R.toFixed(2)} R☉`, w*0.03, hTop*0.08);
      ctx.textAlign = 'center';
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.font = `${Math.max(11,w*0.028)}px 'DM Mono', monospace`;
      ctx.fillText(`P = ${toSciNotation(power(),2)} W`, cx, cy + starR + 26);
    }

    function drawSpectrumPanel(w, hTop, hBot) {
      const panelTop = hTop;
      const plotX0 = w*0.10, plotX1 = w*0.92;
      const plotY0 = panelTop + hBot*0.14, plotY1 = panelTop + hBot*0.72;
      const LMAX_NM = 3000; // display window

      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath(); ctx.moveTo(0,panelTop); ctx.lineTo(w,panelTop); ctx.stroke();

      function xPx(nm) { return plotX0 + (nm/LMAX_NM)*(plotX1-plotX0); }

      // visible band highlight
      ctx.fillStyle = 'rgba(247,131,172,0.08)';
      ctx.fillRect(xPx(380), plotY0, xPx(700)-xPx(380), plotY1-plotY0);
      ctx.strokeStyle = 'rgba(247,131,172,0.4)'; ctx.setLineDash([4,4]); ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(xPx(380),plotY0); ctx.lineTo(xPx(380),plotY1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(xPx(700),plotY0); ctx.lineTo(xPx(700),plotY1); ctx.stroke();
      ctx.setLineDash([]);

      // compute curve, normalized to its own peak for display
      const steps = 240;
      const vals = [];
      let peakVal = 0;
      for (let i=0;i<=steps;i++) {
        const nm = 5 + (LMAX_NM*i)/steps;
        const v = planck(nm*1e-9, state.T);
        vals.push(v);
        if (v>peakVal) peakVal = v;
      }
      function yPx(v) { return plotY1 - (v/peakVal)*(plotY1-plotY0); }

      ctx.beginPath();
      for (let i=0;i<=steps;i++) {
        const nm = 5 + (LMAX_NM*i)/steps;
        const x = xPx(nm), y = yPx(vals[i]);
        if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.strokeStyle = '#4ECDC4'; ctx.lineWidth = 2; ctx.stroke();
      ctx.lineTo(plotX1,plotY1); ctx.lineTo(plotX0,plotY1); ctx.closePath();
      ctx.fillStyle = 'rgba(78,205,196,0.08)'; ctx.fill();

      // axes
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(plotX0,plotY0); ctx.lineTo(plotX0,plotY1); ctx.lineTo(plotX1,plotY1); ctx.stroke();

      ctx.font = `${Math.max(9,w*0.018)}px 'DM Mono', monospace`;
      ctx.fillStyle = 'rgba(230,224,212,0.6)';
      ctx.textAlign = 'center';
      [0,500,1000,1500,2000,2500,3000].forEach(nm => {
        ctx.fillText(nm+' nm', xPx(nm), plotY1+16);
      });

      // Wien's peak marker
      const lamMax = lambdaMaxNm();
      if (lamMax <= LMAX_NM) {
        const px = xPx(lamMax);
        ctx.beginPath(); ctx.moveTo(px,plotY0); ctx.lineTo(px,plotY1);
        ctx.strokeStyle = 'rgba(230,224,212,0.6)'; ctx.setLineDash([3,3]); ctx.lineWidth=1;
        ctx.stroke(); ctx.setLineDash([]);
        ctx.beginPath(); ctx.arc(px, yPx(peakVal), 4.5, 0, 2*Math.PI);
        ctx.fillStyle = '#E6E0D4'; ctx.fill();
        ctx.fillStyle = 'rgba(230,224,212,0.9)';
        ctx.textAlign = 'left';
        ctx.fillText(`λ_max = ${lamMax.toFixed(0)} nm`, px+8, plotY0+12);
      } else {
        ctx.fillStyle = 'rgba(230,224,212,0.6)';
        ctx.textAlign = 'right';
        ctx.fillText(`λ_max = ${lamMax.toFixed(0)} nm (off this chart, far infrared)`, plotX1, plotY0+12);
      }

      ctx.fillStyle = 'rgba(230,224,212,0.5)';
      ctx.textAlign = 'left';
      ctx.fillText('Blackbody spectral radiance (shape only, normalized to its own peak)', w*0.03, panelTop+16);
    }

    function updateReadout() {
      const P = power();
      const lam = lambdaMaxNm();
      document.getElementById('rP').textContent = toSciNotation(P,3) + ' W';
      document.getElementById('rL').textContent = toSciNotation(P/L_SUN,3) + ' L☉';
      document.getElementById('rlambda').textContent = lam.toFixed(1) + ' nm';
      document.getElementById('rband').textContent = peakBand(lam);
      document.getElementById('rA').textContent = toSciNotation(area(),3) + ' m²';
    }

    function frame() {
      _simRaf = requestAnimationFrame(frame);
      const w = W(), h = H_();
      const hTop = topH(h);
      const hBot = h - hTop;
      ctx.clearRect(0,0,w,h);
      drawStarPanel(w, hTop);
      drawSpectrumPanel(w, hTop, hBot);
      updateReadout();
    }
    _simRaf = requestAnimationFrame(frame);
  }
};


SIMS['optics-rayleigh'] = {
  title: "Rayleigh Criterion — Resolution Limit",
  subtitle: "Toggle between an eye resolving two nearby points and a telescope resolving two distant stars — both governed by the same diffraction limit.",

  build(host) {
    const state = {
      mode: 'eye',            // 'eye' | 'telescope'
      lambdaNm: 550,
      dEyeMm: 4,               // pupil diameter, mm
      L_m: 20,                 // distance to object, m (eye mode only)
      D_mm: 3.355,             // actual separation between the two points, mm (eye mode only) —
                               // set to exactly the θ_min-corresponding separation at the default λ, d, L
      dScopeM: 0.5,            // telescope aperture, m
      sepRatio: 1.0,           // telescope mode only: angular separation, as a multiple of θ_min

    host.insertAdjacentHTML('beforeend', `
      <div class="sim-layout">

          <div class="sim-equation">

              θ_min depends only on the aperture d and wavelength λ. D_min is the minimum separation that's resolvable at distance L — the threshold.

              .ray-mode-row { display:flex; gap:6px; margin-bottom:14px; }

                background: rgba(255,255,255,0.05);

              }
            </style>
            <div class="ray-mode-row">
              <button type="button" class="ray-mode-btn active" data-mode="eye">Eye</button>

            <h3>Variables</h3>
