            <div class="readout-row"><span class="rkey">Buoyant force F_B</span><span class="rval" id="rFB">—</span></div>
            <div class="readout-row"><span class="rkey">Weight (mg)</span><span class="rval" id="rW">—</span></div>
            <div class="readout-row"><span class="rkey">Submerged volume V</span><span class="rval" id="rV">—</span></div>
            <div class="readout-row"><span class="rkey">Net force</span><span class="rval" id="rnet">—</span></div>
          </div>

          <div class="sim-legend">
            <h3>Legend</h3>
            <div class="legend-row"><div class="legend-dot" style="background:#3E7CB1"></div>Fluid</div>
            <div class="legend-row"><div class="legend-dot" style="background:#D9B382"></div>Object</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#8A7A65;border-top-style:dashed"></div>Waterline</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#F783AC"></div>Buoyant force F_B</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#5B8DEF"></div>Weight (mg)</div>
          </div>
        </div>
      </div>`);

    renderMath();

    // ── Canvas ──
    const canvas = document.getElementById('buoy-canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    function resize() {
      const sz = canvas.parentElement.clientWidth;
      canvas.width  = sz * dpr;
      canvas.height = sz * dpr;
      canvas.style.width  = sz + 'px';
      canvas.style.height = sz + 'px';
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }
    resize();
    const _ro = new ResizeObserver(resize);
    _ro.observe(canvas.parentElement);

    // ── Sliders ──
    function readSliders() {
      state.rho    = parseFloat(document.getElementById('srho').value);
      state.g      = parseFloat(document.getElementById('sg').value);
      state.rhoObj = parseFloat(document.getElementById('srhoObj').value);
      document.getElementById('lrho').textContent    = state.rho.toFixed(0) + ' kg/m³';
      document.getElementById('lg').textContent      = state.g.toFixed(2) + ' m/s²';
      document.getElementById('lrhoObj').textContent = state.rhoObj.toFixed(0) + ' kg/m³';
      // drop the object back in from just above the waterline so you can watch it settle again
      state.heightAboveFloor = WATERLINE_FROM_BOTTOM;
      state.vel = 0;
    }
    ['srho','sg','srhoObj'].forEach(id => document.getElementById(id).addEventListener('input', readSliders));

    // ── Physics ──
    const objMass = () => state.rhoObj * OBJ_H * OBJ_W; // matches the same "cross-section = 1 m²" convention as V
    function submergedDepth() {
      const bottom = state.heightAboveFloor, top = state.heightAboveFloor + OBJ_H;
      const wet = Math.min(top, WATERLINE_FROM_BOTTOM) - bottom;
      return Math.min(Math.max(wet, 0), OBJ_H);
    }
    function buoyantForce() { return state.rho * state.g * submergedDepth() * OBJ_W; }
    function weightForce() { return objMass() * state.g; }

    function stepPhysics(dt) {
      const m = objMass();
      const net = buoyantForce() - weightForce();
      const accel = net / m;
      state.vel = (state.vel + accel * dt) * DAMPING;
      state.heightAboveFloor += state.vel * dt;

      if (state.heightAboveFloor < 0) { state.heightAboveFloor = 0; state.vel = 0; } // resting on tank floor
      const ceiling = TANK_H - OBJ_H * 0.15;
      if (state.heightAboveFloor > ceiling) { state.heightAboveFloor = ceiling; state.vel = Math.min(state.vel, 0); }
    }

    // ── Geometry ──
    function sz() { return canvas.width / dpr; }

    function draw() {
      const S = sz();
      ctx.clearRect(0, 0, S, S);

      const yTop = S * 0.08, yBottom = S * 0.92;
      const pxPerM = (yBottom - yTop) / TANK_H;
      const xLeft  = S/2 - (TANK_W/2) * pxPerM;
      const xRight = S/2 + (TANK_W/2) * pxPerM;
      const yWaterBase = yBottom - WATERLINE_FROM_BOTTOM * pxPerM;

      const rippleAmp = 2.5;
      function waterY(x) {
        return yWaterBase + Math.sin(x * 0.045 + performance.now()*0.0016) * rippleAmp;
      }

      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      const step = pxPerM * 0.5;
      for (let x = xLeft; x < xRight; x += step) { ctx.beginPath(); ctx.moveTo(x, yTop); ctx.lineTo(x, yBottom); ctx.stroke(); }

      ctx.beginPath();
      ctx.moveTo(xLeft, yBottom);
      ctx.lineTo(xLeft, waterY(xLeft));
      for (let x = xLeft; x <= xRight; x += 4) ctx.lineTo(x, waterY(x));
      ctx.lineTo(xRight, yBottom);
      ctx.closePath();
      ctx.fillStyle = 'rgba(62,124,177,0.35)';
      ctx.fill();

      ctx.strokeStyle = 'rgba(230,224,212,0.4)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(xLeft, yTop); ctx.lineTo(xLeft, yBottom);
      ctx.lineTo(xRight, yBottom); ctx.lineTo(xRight, yTop);
      ctx.stroke();

      // object geometry — position now driven by the physics integration, not a slider
      const objBottomY = yBottom - state.heightAboveFloor * pxPerM;
      const objTopY = objBottomY - OBJ_H * pxPerM;
      const objHalfW = (OBJ_W / 2) * pxPerM;
      const objX0 = S/2 - objHalfW, objX1 = S/2 + objHalfW;

      ctx.fillStyle = '#D9B382';
      ctx.fillRect(objX0, objTopY, objX1 - objX0, objBottomY - objTopY);
      ctx.strokeStyle = 'rgba(20,15,10,0.4)';
      ctx.lineWidth = 1;
      ctx.strokeRect(objX0, objTopY, objX1 - objX0, objBottomY - objTopY);

      const submerged = submergedDepth();
      if (submerged > 0) {
        const wetTopY = Math.max(objTopY, yWaterBase);
        ctx.fillStyle = 'rgba(62,124,177,0.3)';
        ctx.fillRect(objX0, wetTopY, objX1 - objX0, objBottomY - wetTopY);
      }

      ctx.beginPath();
      ctx.moveTo(xLeft, waterY(xLeft));
      for (let x = xLeft; x <= xRight; x += 4) ctx.lineTo(x, waterY(x));
      ctx.strokeStyle = 'rgba(138,122,101,0.7)';
      ctx.setLineDash([4,4]); ctx.lineWidth = 1.2;
      ctx.stroke(); ctx.setLineDash([]);

      // buoyant force arrow, from centroid of submerged volume, pointing up
      const FB = buoyantForce();
      const W_ = weightForce();
      const centroidY = submerged > 0 ? (Math.max(objTopY,yWaterBase) + objBottomY) / 2 : yWaterBase;
      const maxArrow = S * 0.22;
      const maxForceRef = Math.max(2000 * 20 * OBJ_H, 2200 * 20 * OBJ_H * OBJ_W, 1);
      const arrowLen = Math.max(6, maxArrow * (Math.log10(FB + 1) / Math.log10(maxForceRef + 1)));
      drawArrow(S/2 - 14, centroidY, S/2 - 14, centroidY - arrowLen, '#F783AC');
      ctx.fillStyle = 'rgba(247,131,172,0.9)';
      ctx.font = `${Math.max(10, S*0.028)}px 'DM Mono', monospace`;
      ctx.textAlign = 'right';
      ctx.fillText(`F_B`, S/2 - 20, centroidY - arrowLen - 8);

      // weight arrow, from object center, pointing down
      const wArrowLen = Math.max(6, maxArrow * (Math.log10(W_ + 1) / Math.log10(maxForceRef + 1)));
      const objCenterY = (objTopY + objBottomY) / 2;
      drawArrow(S/2 + 14, objCenterY, S/2 + 14, objCenterY + wArrowLen, '#5B8DEF');
      ctx.fillStyle = 'rgba(91,141,239,0.9)';
      ctx.textAlign = 'left';
      ctx.fillText(`mg`, S/2 + 20, objCenterY + wArrowLen + 12);

      ctx.fillStyle = 'rgba(62,124,177,0.9)';
      ctx.textAlign = 'left';
      ctx.font = `${Math.max(10, S*0.03)}px 'DM Mono', monospace`;
      ctx.fillText(`ρ = ${state.rho.toFixed(0)} kg/m³   ρ_obj = ${state.rhoObj.toFixed(0)} kg/m³`, S*0.04, S*0.07);
    }

    function drawArrow(x0, y0, x1, y1, color) {
      if (Math.hypot(x1-x0,y1-y0) < 1) return;
      const ang = Math.atan2(y1 - y0, x1 - x0);
      const hl = 8;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
      ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x1 - hl*Math.cos(ang-0.42), y1 - hl*Math.sin(ang-0.42));
      ctx.lineTo(x1 - hl*Math.cos(ang+0.42), y1 - hl*Math.sin(ang+0.42));
      ctx.closePath(); ctx.fillStyle = color; ctx.fill();
    }

    function updateReadout() {
      const FB = buoyantForce();
      const W_ = weightForce();
      const net = FB - W_;
      const resting = state.heightAboveFloor <= 1e-6;
      const settled = Math.abs(net) < 0.02 * Math.max(W_,1) && Math.abs(state.vel) < 0.01;
      let stateLabel;
      if (resting && net < 0) stateLabel = 'Sunk (resting on bottom)';
      else if (settled) stateLabel = 'Floating (equilibrium)';
      else stateLabel = net > 0 ? 'Rising' : 'Sinking';

      document.getElementById('rstate').textContent = stateLabel;
      document.getElementById('rFB').textContent   = FB.toFixed(2) + ' N';
      document.getElementById('rW').textContent    = W_.toFixed(2) + ' N';
      document.getElementById('rV').textContent    = submergedDepth().toFixed(3) + ' m³';
      document.getElementById('rnet').textContent  = net.toFixed(2) + ' N';
    }

    // ── Animation loop ──
    let last = null;
    function frame(ts) {
      _simRaf = requestAnimationFrame(frame);
      const dt = last ? Math.min((ts - last) / 1000, 0.05) : 0;
      last = ts;

      stepPhysics(dt);
      draw();
      updateReadout();
    }
    _simRaf = requestAnimationFrame(frame);
  }
};


SIMS['grav-hill'] = {
  title: "Hill Sphere Radius",
  subtitle: "Adjust orbital separation a, central mass M, and orbiting mass m — watch the Hill sphere (region of gravitational dominance) resize around the smaller body.",

  build(host) {
    // m is entered in Earth masses for realistic sliders; M is in solar masses.
    // Both are converted to the same units (solar masses) before applying the formula.
    const EARTH_TO_SOLAR = 3.003e-6;
    const state = { a: 1.5, M: 1.0, mEarth: 1.0, moonAngle: 0 };

    host.insertAdjacentHTML('beforeend', `
      <div class="sim-layout">
        <div class="sim-canvas-wrap"><canvas id="hill-canvas"></canvas></div>
        <div class="sim-panel">

          <div class="sim-equation">
            <div class="eq-label">Equation</div>
            <div class="eq-display">$$r_H \\approx a\\left(\\dfrac{m}{3M}\\right)^{1/3}$$</div>
          </div>

          <div class="sim-controls">
            <h3>Variables</h3>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">a</span> — orbital separation</span>
                <span class="sl-val" id="la">1.50 AU</span>
              </div>
              <input type="range" id="sa" min="0.3" max="5" step="0.05" value="1.5">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">M</span> — central mass</span>
                <span class="sl-val" id="lM">1.00 M☉</span>
              </div>
              <input type="range" id="sM" min="0.2" max="3" step="0.05" value="1">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">m</span> — orbiting mass</span>
                <span class="sl-val" id="lm">1.00 M⊕</span>
              </div>
              <input type="range" id="sm" min="0.1" max="320" step="0.5" value="1">
            </div>
          </div>

          <div class="sim-readout">
            <h3>Live Readout</h3>
            <div class="readout-row"><span class="rkey">Hill radius r_H</span><span class="rval hi" id="rH">—</span></div>
            <div class="readout-row"><span class="rkey">r_H as % of a</span><span class="rval" id="rPct">—</span></div>
            <div class="readout-row"><span class="rkey">Separation a</span><span class="rval" id="ra">—</span></div>
            <div class="readout-row"><span class="rkey">Central mass M</span><span class="rval" id="rM">—</span></div>
            <div class="readout-row"><span class="rkey">Orbiting mass m</span><span class="rval" id="rm">—</span></div>
          </div>

          <div class="sim-legend">
            <h3>Legend</h3>
            <div class="legend-row"><div class="legend-dot" style="background:#FFD166"></div>Central body (M)</div>
            <div class="legend-row"><div class="legend-dot" style="background:#5B8DEF"></div>Orbiting body (m)</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#4ECDC4;border-top-style:dashed"></div>Hill sphere boundary</div>
            <div class="legend-row"><div class="legend-dot" style="background:#828282"></div>Test moon (bound orbit)</div>
          </div>
        </div>
      </div>`);

    renderMath();

    // ── Canvas ──
    const canvas = document.getElementById('hill-canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    function resize() {
      const w = canvas.parentElement.clientWidth;
      const h = Math.max(320, w * 0.72);
      canvas.width  = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }
    resize();
    const _ro = new ResizeObserver(resize);
    _ro.observe(canvas.parentElement);

    // ── Sliders ──
    function readSliders() {
      state.a      = parseFloat(document.getElementById('sa').value);
      state.M      = parseFloat(document.getElementById('sM').value);
      state.mEarth = parseFloat(document.getElementById('sm').value);
      document.getElementById('la').textContent = state.a.toFixed(2) + ' AU';
      document.getElementById('lM').textContent = state.M.toFixed(2) + ' M☉';
      document.getElementById('lm').textContent = state.mEarth.toFixed(2) + ' M⊕';
    }
    ['sa','sM','sm'].forEach(id => document.getElementById(id).addEventListener('input', readSliders));

    // ── Physics ──
    function hillRadius() {
      const mSolar = state.mEarth * EARTH_TO_SOLAR;
      return state.a * Math.cbrt(mSolar / (3 * state.M));   // AU
    }

    // Fixed reference scale so the Hill sphere circle actually grows/shrinks
    // on screen as the variables change, rather than always auto-filling the
    // panel. Calibrated once from the default slider values, then reused for
    // every frame; only clamped at the extremes so it never fully vanishes
    // or blows past the panel edges.
    const REF_ZOOM_PANEL_FRACTION = 0.30; // default r_H fills ~30% of the panel's half-size
    let pxPerAU_zoom = null; // set on first draw once panel size is known

    // ── Layout: top = system overview, bottom = zoomed Hill sphere ──
    function W() { return canvas.width / dpr; }
    function H() { return canvas.height / dpr; }
    function topH(h) { return h * 0.36; }

    function drawOverview(w, hTop) {
      const cy = hTop / 2;
      const starX = w * 0.14;
      const pxPerAU = (w * 0.62) / 5.0; // fit a up to slider max (5 AU) with margin
      const planetX = starX + state.a * pxPerAU;

      // orbit line
      ctx.beginPath();
      ctx.moveTo(starX, cy); ctx.lineTo(w * 0.86, cy);
      ctx.strokeStyle = 'rgba(78,205,196,0.25)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // separation dashed marker + label
      ctx.beginPath();
      ctx.moveTo(starX, cy); ctx.lineTo(planetX, cy);
      ctx.strokeStyle = 'rgba(138,122,101,0.6)';
      ctx.setLineDash([4,4]); ctx.lineWidth = 1;
      ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(138,122,101,0.9)';
      ctx.font = `${Math.max(10, w * 0.022)}px 'DM Mono', monospace`;
      ctx.textAlign = 'center';
      ctx.fillText('a', (starX + planetX) / 2, cy - 10);

      // star glow + disc
      const starR = Math.max(10, w * 0.02) * Math.cbrt(state.M);
      const sg = ctx.createRadialGradient(starX, cy, 0, starX, cy, starR * 3);
      sg.addColorStop(0, 'rgba(255,209,102,0.5)');
      sg.addColorStop(1, 'rgba(255,180,60,0)');
      ctx.beginPath(); ctx.arc(starX, cy, starR * 3, 0, 2*Math.PI);
      ctx.fillStyle = sg; ctx.fill();
      ctx.beginPath(); ctx.arc(starX, cy, starR, 0, 2*Math.PI);
      ctx.fillStyle = '#FFD166'; ctx.fill();

      // planet marker (small, since it's the zoomed panel that matters)
      const planetR = Math.max(4, starR * 0.28);
      ctx.beginPath(); ctx.arc(planetX, cy, planetR, 0, 2*Math.PI);
      ctx.fillStyle = '#5B8DEF'; ctx.fill();

      // zoom callout box around planet, connecting to the panel below
      const boxR = Math.max(planetR + 6, 12);
      ctx.beginPath();
      ctx.arc(planetX, cy, boxR, 0, 2*Math.PI);
      ctx.strokeStyle = 'rgba(230,224,212,0.35)';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.fillStyle = 'rgba(230,224,212,0.6)';
      ctx.textAlign = 'left';
      ctx.fillText('System view (not to scale for r_H)', w * 0.03, hTop - 10);
    }

    function drawZoom(w, hTop, hZoom) {
      const cy = hTop + hZoom / 2 + 6;
      const cx = w / 2;
      const rH_AU = hillRadius();
      const panelHalf = Math.min(w, hZoom) * 0.48; // hard boundary the circle may never exceed

      // Calibrate the fixed scale once, using the default state's Hill radius,
      // so subsequent frames reflect real change relative to that baseline.
      if (pxPerAU_zoom === null) {
        const refRH = 1.5 * Math.cbrt((1.0 * EARTH_TO_SOLAR) / (3 * 1.0)); // a=1.5, m=1 M⊕, M=1 M☉
        pxPerAU_zoom = (panelHalf * REF_ZOOM_PANEL_FRACTION) / refRH;
      }

      const zoomRadiusPx = Math.min(Math.max(rH_AU * pxPerAU_zoom, 6), panelHalf);

      // background separator
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath(); ctx.moveTo(0, hTop); ctx.lineTo(w, hTop); ctx.stroke();

      // subtle grid
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      const step = pxPerAU_zoom * (rH_AU / 4);
      if (isFinite(step) && step > 2) {
        for (let x = cx % step; x < w; x += step) { ctx.beginPath(); ctx.moveTo(x, hTop); ctx.lineTo(x, hTop + hZoom); ctx.stroke(); }
      }

      // Hill sphere dashed boundary
      ctx.beginPath();
      ctx.arc(cx, cy, zoomRadiusPx, 0, 2*Math.PI);
      ctx.strokeStyle = 'rgba(78,205,196,0.6)';
      ctx.setLineDash([5,5]); ctx.lineWidth = 1.5;
      ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(78,205,196,0.08)';
      ctx.fill();

      // orbiting body at center
      const planetR = Math.max(6, Math.min(w, hZoom) * 0.02) * Math.cbrt(Math.max(state.mEarth, 0.3)) * 0.5 + 5;
      const pg = ctx.createRadialGradient(cx, cy, 0, cx, cy, planetR * 3);
      pg.addColorStop(0, 'rgba(91,141,239,0.5)');
      pg.addColorStop(1, 'rgba(91,141,239,0)');
      ctx.beginPath(); ctx.arc(cx, cy, planetR * 3, 0, 2*Math.PI);
      ctx.fillStyle = pg; ctx.fill();
      ctx.beginPath(); ctx.arc(cx, cy, planetR, 0, 2*Math.PI);
      ctx.fillStyle = '#5B8DEF'; ctx.fill();

      // test moon, bound orbit at 45% of r_H — illustrates "stably orbits within the Hill sphere"
      const moonOrbitR = zoomRadiusPx * 0.45;
      const mx = cx + moonOrbitR * Math.cos(state.moonAngle);
      const my = cy + moonOrbitR * Math.sin(state.moonAngle) * 0.9; // slight ellipse for visual interest
      ctx.beginPath();
      ctx.ellipse(cx, cy, moonOrbitR, moonOrbitR * 0.9, 0, 0, 2*Math.PI);
      ctx.strokeStyle = 'rgba(230,224,212,0.2)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.beginPath(); ctx.arc(mx, my, Math.max(3, planetR * 0.3), 0, 2*Math.PI);
      ctx.fillStyle = '#828282'; ctx.fill();

      // radius label
      ctx.fillStyle = 'rgba(78,205,196,0.9)';
      ctx.font = `${Math.max(10, w * 0.026)}px 'DM Mono', monospace`;
      ctx.textAlign = 'left';
      ctx.fillText(`r_H = ${rH_AU.toExponential(3)} AU`, w * 0.03, hTop + 22);

      ctx.textAlign = 'right';
      ctx.fillStyle = 'rgba(230,224,212,0.5)';
      ctx.fillText('Zoomed on orbiting body', w * 0.97, hTop + 22);
    }

    function updateReadout() {
      const rH = hillRadius();
      document.getElementById('rH').textContent  = rH.toExponential(4) + ' AU';
      document.getElementById('rPct').textContent = (100 * rH / state.a).toExponential(3) + ' %';
      document.getElementById('ra').textContent  = state.a.toFixed(3) + ' AU';
      document.getElementById('rM').textContent  = state.M.toFixed(3) + ' M☉';
      document.getElementById('rm').textContent  = state.mEarth.toFixed(3) + ' M⊕';
    }

    // ── Animation loop (slow moon orbit only — the equation itself has no time dependence) ──
    let last = null;
    function frame(ts) {
      _simRaf = requestAnimationFrame(frame);
      const dt = last ? Math.min((ts - last) / 1000, 0.05) : 0;
      last = ts;
      state.moonAngle = (state.moonAngle + dt * 0.9) % (2 * Math.PI);

      const w = W(), h = H();
      const hTop = topH(h);
      const hZoom = h - hTop;

      ctx.clearRect(0, 0, w, h);
      drawOverview(w, hTop);
      drawZoom(w, hTop, hZoom);
      updateReadout();
    }
    _simRaf = requestAnimationFrame(frame);
  }
};

SIMS['optics-refraction'] = {
  title: "Snell's Law of Refraction",
  subtitle: "Adjust the incidence angle θ₁ and the refractive indices n₁, n₂ — watch the ray bend at the interface, or totally internally reflect.",

  build(host) {
    const state = { n1: 1.00, n2: 1.33, theta1Deg: 40, photonT: 0 };

    host.insertAdjacentHTML('beforeend', `
      <div class="sim-layout">
        <div class="sim-canvas-wrap"><canvas id="snell-canvas"></canvas></div>
        <div class="sim-panel">

          <div class="sim-equation">
            <div class="eq-label">Equation</div>
            <div class="eq-display">$$n_1 \\sin\\theta_1 = n_2 \\sin\\theta_2$$</div>
          </div>

          <div class="sim-controls">
            <h3>Variables</h3>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">θ₁</span> — angle of incidence</span>
                <span class="sl-val" id="ltheta1">40.0°</span>
              </div>
              <input type="range" id="stheta1" min="0" max="89" step="0.5" value="40">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">n₁</span> — index, medium 1 (top)</span>
                <span class="sl-val" id="ln1">1.00</span>
              </div>
              <input type="range" id="sn1" min="1.00" max="2.50" step="0.01" value="1.00">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">n₂</span> — index, medium 2 (bottom)</span>
                <span class="sl-val" id="ln2">1.33</span>
              </div>
              <input type="range" id="sn2" min="1.00" max="2.50" step="0.01" value="1.33">
            </div>
          </div>

          <div class="sim-readout">
            <h3>Live Readout</h3>
            <div class="readout-row"><span class="rkey">Angle of refraction θ₂</span><span class="rval hi" id="rtheta2">—</span></div>
            <div class="readout-row"><span class="rkey">Angle of incidence θ₁</span><span class="rval" id="rtheta1">—</span></div>
            <div class="readout-row"><span class="rkey">Index n₁</span><span class="rval" id="rn1">—</span></div>
            <div class="readout-row"><span class="rkey">Index n₂</span><span class="rval" id="rn2">—</span></div>
            <div class="readout-row"><span class="rkey">Critical angle θ_c</span><span class="rval" id="rcrit">—</span></div>
            <div class="readout-row"><span class="rkey">Speed ratio v₂/v₁</span><span class="rval" id="rspeed">—</span></div>
          </div>

          <div class="sim-legend">
            <h3>Legend</h3>
            <div class="legend-row"><div class="legend-line" style="border-color:#FFD166"></div>Incident ray</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#4ECDC4"></div>Refracted ray</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#F783AC;opacity:.7"></div>Reflected ray</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#8A7A65;border-top-style:dashed"></div>Normal</div>
            <div class="legend-row"><div class="legend-dot" style="background:#828282"></div>Photon marker</div>
          </div>
        </div>
      </div>`);

    renderMath();

    // ── Canvas ──
    const canvas = document.getElementById('snell-canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    function resize() {
      const sz = canvas.parentElement.clientWidth;
      canvas.width  = sz * dpr;
      canvas.height = sz * dpr;
      canvas.style.width  = sz + 'px';
      canvas.style.height = sz + 'px';
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }
    resize();
    const _ro = new ResizeObserver(resize);
    _ro.observe(canvas.parentElement);

    // ── Sliders ──
    function readSliders() {
      state.theta1Deg = parseFloat(document.getElementById('stheta1').value);
      state.n1        = parseFloat(document.getElementById('sn1').value);
      state.n2        = parseFloat(document.getElementById('sn2').value);
      document.getElementById('ltheta1').textContent = state.theta1Deg.toFixed(1) + '°';
      document.getElementById('ln1').textContent     = state.n1.toFixed(2);
      document.getElementById('ln2').textContent     = state.n2.toFixed(2);
      state.photonT = 0;
    }
    ['stheta1','sn1','sn2'].forEach(id => document.getElementById(id).addEventListener('input', readSliders));

    // ── Physics ──
    function refractionResult() {
      const theta1 = state.theta1Deg * Math.PI / 180;
      const sinTheta2 = (state.n1 / state.n2) * Math.sin(theta1);
      if (sinTheta2 > 1) return { theta1, tir: true, theta2: null };
      return { theta1, tir: false, theta2: Math.asin(sinTheta2) };
    }
    function criticalAngleDeg() {
      if (state.n1 <= state.n2) return null;   // no TIR possible going into a denser medium
      return Math.asin(state.n2 / state.n1) * 180 / Math.PI;
    }

    // ── Geometry ──
    function sz() { return canvas.width / dpr; }

    function draw() {
      const S = sz();
      const cx = S / 2, cy = S / 2;
      const L = S * 0.4; // ray length

      ctx.clearRect(0, 0, S, S);

      // media fills — tint intensity suggests optical density
      const n1Alpha = 0.05 + 0.06 * (state.n1 - 1);
      const n2Alpha = 0.05 + 0.06 * (state.n2 - 1);
      ctx.fillStyle = `rgba(91,141,239,${n1Alpha})`;
      ctx.fillRect(0, 0, S, cy);
      ctx.fillStyle = `rgba(255,209,102,${n2Alpha})`;
      ctx.fillRect(0, cy, S, S - cy);

      // interface line
      ctx.beginPath();
      ctx.moveTo(0, cy); ctx.lineTo(S, cy);
      ctx.strokeStyle = 'rgba(230,224,212,0.4)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // normal (dashed, vertical)
      ctx.beginPath();
      ctx.moveTo(cx, cy - L * 1.05); ctx.lineTo(cx, cy + L * 1.05);
      ctx.strokeStyle = 'rgba(138,122,101,0.6)';
      ctx.setLineDash([4,4]); ctx.lineWidth = 1;
      ctx.stroke(); ctx.setLineDash([]);

      const res = refractionResult();
      const sinT1 = Math.sin(res.theta1), cosT1 = Math.cos(res.theta1);

      // incident ray (from upper-left, into the interface point)
      const srcX = cx - sinT1 * L, srcY = cy - cosT1 * L;
      drawArrow(srcX, srcY, cx, cy, '#FFD166', 2);

      // reflected ray (back into medium 1, mirrored horizontally)
      const reflX = cx + sinT1 * L, reflY = cy - cosT1 * L;
      const reflAlpha = res.tir ? 0.95 : 0.4; // full strength under TIR, faint partial reflection otherwise
      drawArrow(cx, cy, reflX, reflY, `rgba(247,131,172,${reflAlpha})`, res.tir ? 2 : 1.4);

      // refracted ray (into medium 2), or omitted under total internal reflection
      if (!res.tir) {
        const sinT2 = Math.sin(res.theta2), cosT2 = Math.cos(res.theta2);
        const refX = cx + sinT2 * L, refY = cy + cosT2 * L;
        drawArrow(cx, cy, refX, refY, '#4ECDC4', 2);
      }

      // angle arcs from normal
      drawAngleArc(cx, cy, res.theta1, true, 'rgba(255,209,102,0.8)');
      if (!res.tir) drawAngleArc(cx, cy, res.theta2, false, 'rgba(78,205,196,0.8)');

      // interface point marker
      ctx.beginPath(); ctx.arc(cx, cy, 3.5, 0, 2*Math.PI);
      ctx.fillStyle = '#828282'; ctx.fill();

      // medium labels
      ctx.fillStyle = 'rgba(91,141,239,0.85)';
      ctx.font = `${Math.max(10, S * 0.03)}px 'DM Mono', monospace`;
      ctx.textAlign = 'left';
      ctx.fillText(`n₁ = ${state.n1.toFixed(2)}`, S * 0.03, S * 0.07);
      ctx.fillStyle = 'rgba(255,209,102,0.85)';
      ctx.fillText(`n₂ = ${state.n2.toFixed(2)}`, S * 0.03, S * 0.95);

      // TIR banner
      if (res.tir) {
        ctx.fillStyle = 'rgba(247,131,172,0.9)';
        ctx.font = `bold ${Math.max(11, S * 0.032)}px 'DM Mono', monospace`;
        ctx.textAlign = 'center';
        ctx.fillText('TOTAL INTERNAL REFLECTION', cx, S * 0.07);
      }

      // animated photon traveling incident → (refracted or reflected)
      const t = state.photonT % 2;
      let px, py;
      if (t < 1) {
        px = srcX + (cx - srcX) * t;
        py = srcY + (cy - srcY) * t;
      } else {
        const t2 = t - 1;
        if (res.tir) {
          px = cx + (reflX - cx) * t2;
          py = cy + (reflY - cy) * t2;
        } else {
          const sinT2 = Math.sin(res.theta2), cosT2 = Math.cos(res.theta2);
          const refX = cx + sinT2 * L, refY = cy + cosT2 * L;
          px = cx + (refX - cx) * t2;
          py = cy + (refY - cy) * t2;
        }
      }
      const glow = ctx.createRadialGradient(px, py, 0, px, py, 10);
      glow.addColorStop(0, 'rgba(230,224,212,0.9)');
      glow.addColorStop(1, 'rgba(230,224,212,0)');
      ctx.beginPath(); ctx.arc(px, py, 10, 0, 2*Math.PI);
      ctx.fillStyle = glow; ctx.fill();
      ctx.beginPath(); ctx.arc(px, py, 3, 0, 2*Math.PI);
      ctx.fillStyle = '#828282'; ctx.fill();
    }

    function drawArrow(x0, y0, x1, y1, color, width) {
      const ang = Math.atan2(y1 - y0, x1 - x0);
      const hl = 8;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x1 - hl*Math.cos(ang-0.42), y1 - hl*Math.sin(ang-0.42));
      ctx.lineTo(x1 - hl*Math.cos(ang+0.42), y1 - hl*Math.sin(ang+0.42));
      ctx.closePath(); ctx.fillStyle = color; ctx.fill();
    }

    function drawAngleArc(cx, cy, theta, upper, color) {
      const r = 34;
      ctx.beginPath();
      if (upper) {
        // arc between the normal (pointing up) and the incident-side ray, above the interface
        ctx.arc(cx, cy, r, -Math.PI/2, -Math.PI/2 + theta, false);
      } else {
        // arc between the normal (pointing down) and the refracted ray, below the interface
        ctx.arc(cx, cy, r, Math.PI/2, Math.PI/2 - theta, true);
      }
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.3;
      ctx.stroke();
    }

    function updateReadout() {
      const res = refractionResult();
      const crit = criticalAngleDeg();
      document.getElementById('rtheta2').textContent = res.tir ? 'TIR (no transmission)' : (res.theta2 * 180/Math.PI).toFixed(2) + '°';
      document.getElementById('rtheta1').textContent = state.theta1Deg.toFixed(2) + '°';
      document.getElementById('rn1').textContent = state.n1.toFixed(3);
      document.getElementById('rn2').textContent = state.n2.toFixed(3);
      document.getElementById('rcrit').textContent = crit === null ? 'N/A (n₁ ≤ n₂)' : crit.toFixed(2) + '°';
      document.getElementById('rspeed').textContent = (state.n1 / state.n2).toFixed(3);
    }

    // ── Animation loop ──
    let last = null;
    function frame(ts) {
      _simRaf = requestAnimationFrame(frame);
      const dt = last ? Math.min((ts - last) / 1000, 0.05) : 0;
      last = ts;
      state.photonT += dt * 0.7; // cycles: 0–1 incident leg, 1–2 outgoing leg

      draw();
      updateReadout();
    }
    _simRaf = requestAnimationFrame(frame);
  }
};

SIMS['interference pattern'] = {
  title: "Double-Slit Interference Pattern",
  subtitle: "Adjust source separation d, screen distance L, and wavelength λ — watch the fringe spacing change and inspect the path lengths to any bright band.",

  build(host) {
    // Units: d in mm, L in m, λ in nm, y-positions on the screen in mm.
    const state = { d: 0.4, L: 1.0, lambdaNm: 632, mSelected: 1 };
    const HALF_EXTENT_MM = 8; // physical half-height of the screen strip shown in the pattern panel

    host.insertAdjacentHTML('beforeend', `
      <div class="sim-layout">
        <div class="sim-canvas-wrap"><canvas id="interf-canvas"></canvas></div>
        <div class="sim-panel">

          <div class="sim-equation">
            <div class="eq-label">Equation</div>
            <div class="eq-display">$$d\\sin\\theta = m\\lambda \\;\\;\\Rightarrow\\;\\; y_m \\approx \\dfrac{m\\lambda L}{d}$$</div>
            <div style="font-size:0.75rem;opacity:0.6;margin-top:6px;">
              Small-angle approximation. Top panel is schematic (d and y greatly exaggerated relative to L); bottom panel is the screen pattern at true relative scale.
            </div>
          </div>

          <div class="sim-controls">
            <h3>Variables</h3>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">d</span> — source separation</span>
                <span class="sl-val" id="ld">0.400 mm</span>
              </div>
              <input type="range" id="sd" min="0.1" max="1.5" step="0.01" value="0.4">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">L</span> — distance to screen</span>
                <span class="sl-val" id="lL">1.00 m</span>
              </div>
              <input type="range" id="sL" min="0.3" max="3" step="0.05" value="1.0">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">λ</span> — wavelength</span>
                <span class="sl-val" id="llambda">632 nm</span>
              </div>
              <input type="range" id="slambda" min="380" max="700" step="1" value="632">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">m</span> — inspected fringe order</span>
                <span class="sl-val" id="lm">1</span>
              </div>
              <input type="range" id="sm" min="-5" max="5" step="1" value="1">
            </div>
          </div>

          <div class="sim-readout">
            <h3>Live Readout</h3>
            <div class="readout-row"><span class="rkey">Fringe spacing Δy</span><span class="rval hi" id="rdy">—</span></div>
            <div class="readout-row"><span class="rkey">Position y_m (order m)</span><span class="rval" id="rym">—</span></div>
            <div class="readout-row"><span class="rkey">Distance to source 1, r₁</span><span class="rval" id="rr1">—</span></div>
            <div class="readout-row"><span class="rkey">Distance to source 2, r₂</span><span class="rval" id="rr2">—</span></div>
            <div class="readout-row"><span class="rkey">Path difference r₂ − r₁</span><span class="rval" id="rdiff">—</span></div>
            <div class="readout-row"><span class="rkey">Check: mλ</span><span class="rval" id="rmlam">—</span></div>
          </div>

          <div class="sim-legend">
            <h3>Legend</h3>
            <div class="legend-row"><div class="legend-dot" style="background:#FFD166"></div>Sources (d apart)</div>
            <div class="legend-row"><div class="legend-dot" style="background:#828282"></div>Selected bright band (order m)</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#4ECDC4"></div>Paths r₁, r₂</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#8A7A65;border-top-style:dashed"></div>Central axis (m = 0)</div>
          </div>
        </div>
      </div>`);

    renderMath();

    // ── Canvas ──
    const canvas = document.getElementById('interf-canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    function resize() {
      const w = canvas.parentElement.clientWidth;
      const h = Math.max(360, w * 0.85);
      canvas.width  = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }
    resize();
    const _ro = new ResizeObserver(resize);
    _ro.observe(canvas.parentElement);

    // ── Sliders ──
    function readSliders() {
      state.d        = parseFloat(document.getElementById('sd').value);
      state.L        = parseFloat(document.getElementById('sL').value);
      state.lambdaNm = parseFloat(document.getElementById('slambda').value);
      state.mSelected = parseInt(document.getElementById('sm').value, 10);
      document.getElementById('ld').textContent      = state.d.toFixed(3) + ' mm';
      document.getElementById('lL').textContent      = state.L.toFixed(2) + ' m';
      document.getElementById('llambda').textContent = state.lambdaNm.toFixed(0) + ' nm';
      document.getElementById('lm').textContent      = state.mSelected.toString();
    }
    ['sd','sL','slambda','sm'].forEach(id => document.getElementById(id).addEventListener('input', readSliders));

    // ── Physics ──
    function fringeSpacingMm() {
      const lambdaMm = state.lambdaNm * 1e-6;
      const Lmm = state.L * 1000;
      return lambdaMm * Lmm / state.d;
    }
    function yPositionMm(m) { return m * fringeSpacingMm(); }
    function pathLengths(yMm) {
      const Lmm = state.L * 1000;
      const r1 = Math.sqrt(Lmm*Lmm + Math.pow(yMm + state.d/2, 2)); // to lower source
      const r2 = Math.sqrt(Lmm*Lmm + Math.pow(yMm - state.d/2, 2)); // to upper source
      return { r1, r2 };
    }
    function intensityAt(yMm) {
      const lambdaMm = state.lambdaNm * 1e-6;
      const Lmm = state.L * 1000;
      const phase = Math.PI * state.d * yMm / (lambdaMm * Lmm);
      return Math.pow(Math.cos(phase), 2);
    }

    // approximate visible-spectrum wavelength → RGB
    function wavelengthColor(nm) {
      let r=0,g=0,b=0;
      if (nm >= 380 && nm < 440)      { r = -(nm-440)/(440-380); g = 0; b = 1; }
      else if (nm >= 440 && nm < 490) { r = 0; g = (nm-440)/(490-440); b = 1; }
      else if (nm >= 490 && nm < 510) { r = 0; g = 1; b = -(nm-510)/(510-490); }
      else if (nm >= 510 && nm < 580) { r = (nm-510)/(580-510); g = 1; b = 0; }
      else if (nm >= 580 && nm < 645) { r = 1; g = -(nm-645)/(645-580); b = 0; }
      else if (nm >= 645 && nm <= 700){ r = 1; g = 0; b = 0; }
      return `rgb(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)})`;
    }

    // ── Layout ──
    function W() { return canvas.width / dpr; }
    function H() { return canvas.height / dpr; }
    function topH(h) { return h * 0.5; }

    function drawSchematic(w, hTop) {
      const cy = hTop / 2;
      const srcX = w * 0.12;
      const boardX = w * 0.82;
      const srcGap = Math.min(hTop * 0.5, 90); // exaggerated on-screen separation, not to scale

      const s1y = cy - srcGap/2, s2y = cy + srcGap/2;
      const rayColor = wavelengthColor(state.lambdaNm);

      // central axis
      ctx.beginPath();
      ctx.moveTo(srcX, cy); ctx.lineTo(boardX, cy);
      ctx.strokeStyle = 'rgba(138,122,101,0.5)';
      ctx.setLineDash([4,4]); ctx.lineWidth = 1;
      ctx.stroke(); ctx.setLineDash([]);

      // board line
      ctx.beginPath();
      ctx.moveTo(boardX, hTop*0.06); ctx.lineTo(boardX, hTop*0.94);
      ctx.strokeStyle = 'rgba(230,224,212,0.45)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // target position on schematic board — scaled proportionally to fringe spacing,
      // not to true mm scale (that's the bottom panel's job)
      const dyMm = fringeSpacingMm();
      const yTargetMm = yPositionMm(state.mSelected);
      const schematicScale = (hTop * 0.4) / Math.max(dyMm * 3, 1e-9); // fit ~3 fringe-spacings of travel
      let targetY = cy - yTargetMm * schematicScale;
      targetY = Math.min(Math.max(targetY, hTop*0.08), hTop*0.92);

      // r1, r2 paths
      drawLine(srcX, s1y, boardX, targetY, 'rgba(78,205,196,0.85)');
      drawLine(srcX, s2y, boardX, targetY, 'rgba(78,205,196,0.55)');

      // sources
      [ [s1y,'1'], [s2y,'2'] ].forEach(([y, label]) => {
        const g = ctx.createRadialGradient(srcX, y, 0, srcX, y, 16);
        g.addColorStop(0, rayColor.replace('rgb','rgba').replace(')', ',0.6)'));
        g.addColorStop(1, rayColor.replace('rgb','rgba').replace(')', ',0)'));
        ctx.beginPath(); ctx.arc(srcX, y, 16, 0, 2*Math.PI);
        ctx.fillStyle = g; ctx.fill();
        ctx.beginPath(); ctx.arc(srcX, y, 5, 0, 2*Math.PI);
        ctx.fillStyle = '#FFD166'; ctx.fill();
      });

      // d annotation (vertical double arrow between sources) — placed to the
      // right of the sources so there's room within the canvas bounds; the
      // left margin near srcX was too tight and clipped the label off-canvas.
      const dArrowX = srcX + 0;
      drawDoubleArrow(dArrowX, s1y, dArrowX, s2y, 'rgba(255,209,102,0.8)');
      ctx.fillStyle = 'rgba(255,209,102,0.9)';
      ctx.font = `${Math.max(10, w*0.024)}px 'DM Mono', monospace`;
      ctx.textAlign = 'left';
      ctx.fillText(`d = ${state.d.toFixed(3)} mm`, dArrowX + 8, cy + 4);

      // L annotation (horizontal double arrow along the bottom)
      const Ly = hTop * 0.94;
      drawDoubleArrow(srcX, Ly, boardX, Ly, 'rgba(91,141,239,0.8)');
      ctx.fillStyle = 'rgba(91,141,239,0.9)';
      ctx.textAlign = 'center';
      ctx.fillText(`L = ${state.L.toFixed(2)} m`, (srcX+boardX)/2, Ly + 16);

      // selected bright band marker
      ctx.beginPath(); ctx.arc(boardX, targetY, 5.5, 0, 2*Math.PI);
      ctx.fillStyle = '#828282'; ctx.fill();
      ctx.strokeStyle = 'rgba(230,224,212,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = 'rgba(230,224,212,0.95)';
      ctx.textAlign = 'left';
      ctx.font = `bold ${Math.max(10, w*0.024)}px 'DM Mono', monospace`;
      ctx.fillText(`m = ${state.mSelected}`, boardX + 10, targetY + 4);

      // r1 / r2 labels near midpoints
      ctx.font = `${Math.max(9, w*0.02)}px 'DM Mono', monospace`;
      ctx.fillStyle = 'rgba(78,205,196,0.95)';
      ctx.textAlign = 'center';
      ctx.fillText('r₁', (srcX+boardX)/2, (s1y+targetY)/2 - 8);
      ctx.fillText('r₂', (srcX+boardX)/2, (s2y+targetY)/2 + 14);

      ctx.fillStyle = 'rgba(230,224,212,0.5)';
      ctx.textAlign = 'left';
      ctx.font = `${Math.max(9, w*0.02)}px 'DM Mono', monospace`;
      ctx.fillText('Schematic (not to scale)', w*0.03, hTop*0.08);
    }

    function drawLine(x0,y0,x1,y1,color) {
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1);
      ctx.strokeStyle = color; ctx.lineWidth = 1.6; ctx.stroke();
    }
    function drawDoubleArrow(x0,y0,x1,y1,color) {
      drawLine(x0,y0,x1,y1,color);
      const ang = Math.atan2(y1-y0, x1-x0);
      [[x0,y0,ang+Math.PI],[x1,y1,ang]].forEach(([x,y,a]) => {
        const hl = 6;
        ctx.beginPath();
        ctx.moveTo(x,y);
        ctx.lineTo(x - hl*Math.cos(a-0.4), y - hl*Math.sin(a-0.4));
        ctx.lineTo(x - hl*Math.cos(a+0.4), y - hl*Math.sin(a+0.4));
        ctx.closePath(); ctx.fillStyle = color; ctx.fill();
      });
    }

    function drawPattern(w, hTop, hBot) {
      const panelTop = hTop, panelH = hBot;
      const cy = panelTop + panelH/2;
      const stripX0 = w * 0.28, stripX1 = w * 0.72;
      const pxPerMm = (panelH * 0.46) / HALF_EXTENT_MM;

      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath(); ctx.moveTo(0, panelTop); ctx.lineTo(w, panelTop); ctx.stroke();

      const rayColor = wavelengthColor(state.lambdaNm);
      const m3 = rayColor.match(/\d+/g).map(Number);

      // intensity strip
      const steps = 260;
      for (let i = 0; i < steps; i++) {
        const yMm = -HALF_EXTENT_MM + (2*HALF_EXTENT_MM * i)/steps;
        const yPx = cy - yMm * pxPerMm;
        const I = intensityAt(yMm);
        ctx.fillStyle = `rgba(${m3[0]},${m3[1]},${m3[2]},${(0.05 + 0.85*I).toFixed(3)})`;
        ctx.fillRect(stripX0, yPx, stripX1 - stripX0, (2*HALF_EXTENT_MM*pxPerMm)/steps + 1);
      }
      ctx.strokeStyle = 'rgba(230,224,212,0.3)';
      ctx.lineWidth = 1;
      ctx.strokeRect(stripX0, cy - HALF_EXTENT_MM*pxPerMm, stripX1 - stripX0, 2*HALF_EXTENT_MM*pxPerMm);

      // central axis marker
      ctx.beginPath();
      ctx.moveTo(stripX0 - 8, cy); ctx.lineTo(stripX1 + 8, cy);
      ctx.strokeStyle = 'rgba(138,122,101,0.4)';
      ctx.setLineDash([3,3]); ctx.lineWidth = 1;
      ctx.stroke(); ctx.setLineDash([]);

      // bright-band order labels + tick marks
      const dyMm = fringeSpacingMm();
      const maxM = Math.floor(HALF_EXTENT_MM / dyMm);
      ctx.font = `${Math.max(9, w*0.02)}px 'DM Mono', monospace`;
      for (let m = -maxM; m <= maxM; m++) {
        const yMm = m * dyMm;
        const yPx = cy - yMm * pxPerMm;
        const selected = (m === state.mSelected);
        ctx.beginPath();
        ctx.moveTo(stripX1 + 4, yPx); ctx.lineTo(stripX1 + 12, yPx);
        ctx.strokeStyle = selected ? '#828282' : 'rgba(230,224,212,0.4)';
        ctx.lineWidth = selected ? 2 : 1;
        ctx.stroke();
        ctx.fillStyle = selected ? '#828282' : 'rgba(230,224,212,0.55)';
        ctx.textAlign = 'left';
        ctx.fillText(`m=${m}`, stripX1 + 16, yPx + 3);
        if (selected) {
          ctx.beginPath(); ctx.arc((stripX0+stripX1)/2, yPx, 4, 0, 2*Math.PI);
          ctx.strokeStyle = '#828282'; ctx.lineWidth = 1.5; ctx.stroke();
        }
      }

      // Δy annotation between m=0 and m=1 if both are on the strip
      if (maxM >= 1) {
        const y0Px = cy;
        const y1Px = cy - dyMm * pxPerMm;
        drawDoubleArrow(stripX0 - 20, y0Px, stripX0 - 20, y1Px, 'rgba(255,209,102,0.85)');
        ctx.fillStyle = 'rgba(255,209,102,0.9)';
        ctx.textAlign = 'right';
        ctx.fillText(`Δy = ${dyMm.toFixed(3)} mm`, stripX0 - 26, (y0Px+y1Px)/2 + 4);
      }

      ctx.fillStyle = 'rgba(230,224,212,0.5)';
      ctx.textAlign = 'left';
      ctx.font = `${Math.max(9, w*0.02)}px 'DM Mono', monospace`;
      ctx.fillText(`Screen pattern (±${HALF_EXTENT_MM} mm shown)`, w*0.03, panelTop + 16);
    }

    function updateReadout() {
      const dy = fringeSpacingMm();
      const yMm = yPositionMm(state.mSelected);
      const { r1, r2 } = pathLengths(yMm);
      const diffMm = r2 - r1;
      const diffNm = diffMm * 1e6;
      const mLamNm = state.mSelected * state.lambdaNm;
      document.getElementById('rdy').textContent   = dy.toFixed(4) + ' mm';
      document.getElementById('rym').textContent   = yMm.toFixed(4) + ' mm';
      document.getElementById('rr1').textContent   = (r1/1000).toFixed(6) + ' m';
      document.getElementById('rr2').textContent   = (r2/1000).toFixed(6) + ' m';
      document.getElementById('rdiff').textContent = diffNm.toFixed(1) + ' nm';
      document.getElementById('rmlam').textContent = mLamNm.toFixed(1) + ' nm';
    }

    // ── Draw loop (static physics — redraw on demand, no time dependence) ──
    function render() {
      const w = W(), h = H();
      const hTop = topH(h);
      const hBot = h - hTop;
      ctx.clearRect(0, 0, w, h);
      drawSchematic(w, hTop);
      drawPattern(w, hTop, hBot);
      updateReadout();
    }

    // Continuous redraw loop, matching the other sims' convention. This also
    // guarantees the first real render happens on a requestAnimationFrame
    // tick rather than synchronously during build() — the DOM elements this
    // sim writes to must already be attached to the live document, and the
    // host container may not be attached yet at the moment build() runs.
    function frame() {
      _simRaf = requestAnimationFrame(frame);
      render();
    }
    _simRaf = requestAnimationFrame(frame);
  }
};

SIMS['optics-thin-film'] = {
  title: "Thin-Film Interference",
  subtitle: "Pick the top, film, and bottom substances (or dial in custom indices) — watch the π phase relationship and the reflected color respond.",

  build(host) {
    // Path: medium1 (top) → film (middle) → medium2 (bottom), normal incidence.
    // A reflection carries a π phase flip only when it bounces off a HIGHER
    // index medium. Whether the two reflected rays end up in phase or out of
    // phase by π depends on how nTop, nFilm, and nBottom compare — it is NOT
    // always guaranteed to be π, unlike the air-film-air special case.
    const SUBSTANCES = [
      { name: 'Air',            n: 1.000 },
      { name: 'Ice',             n: 1.310 },
      { name: 'Water',           n: 1.333 },
      { name: 'Soap Film',       n: 1.330 },
      { name: 'Ethanol',         n: 1.361 },
      { name: 'Vegetable Oil',   n: 1.470 },
      { name: 'Glass (crown)',   n: 1.520 },
      { name: 'Diamond',         n: 2.417 },
    ];
    function subByName(name) { return SUBSTANCES.find(s => s.name === name); }
    function buildOptions(selectedName) {
      const custom = `<option value="Custom" ${selectedName==='Custom'?'selected':''}>Custom</option>`;
      const rest = SUBSTANCES.map(s =>
        `<option value="${s.name}" ${s.name===selectedName?'selected':''}>${s.name} (n≈${s.n.toFixed(3)})</option>`
      ).join('');
      return custom + rest;
    }

    const state = {
      t: 380,
      nTop: 1.000, nFilm: 1.330, nBottom: 1.000,

    };
    const LAMBDA_MIN = 380, LAMBDA_MAX = 700;

    host.insertAdjacentHTML('beforeend', `

            <div class="readout-row"><span class="rkey">Extra optical path (2 n_film t)</span><span class="rval" id="ropl">—</span></div>
            <div class="readout-row"><span class="rkey">Top reflection (n₁→n_film)</span><span class="rval" id="rtop">—</span></div>
            <div class="readout-row"><span class="rkey">Bottom reflection (n_film→n₂)</span><span class="rval" id="rbot">—</span></div>

            <div class="legend-row"><div class="legend-line" style="border-color:#8A7A65;border-top-style:dashed"></div>Film thickness t</div>
            <div class="legend-row"><div class="legend-dot" style="background:#828282"></div>Constructive λ (bright band)</div>
            <div class="legend-row"><div class="legend-dot" style="background:#3A3A3A"></div>Destructive λ (dark band)</div>
