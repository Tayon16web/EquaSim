    renderMath();

    // ── Canvas ──
    const canvas = document.getElementById('film-canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    function resize() {
      const w = canvas.parentElement.clientWidth;
      const h = Math.max(380, w * 0.9);
      canvas.width  = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }
    resize();
    const _ro = new ResizeObserver(resize);
    _ro.observe(canvas.parentElement);

    // ── Controls ──
    function applySubstance(slot, name) {
      const s = subByName(name);
      if (!s) return; // "Custom" — leave slider as the source of truth
      if (slot === 'top')    { state.nTop = s.n;    state.topName = name;    document.getElementById('sntop').value = s.n; }
      if (slot === 'film')   { state.nFilm = s.n;   state.filmName = name;   document.getElementById('snfilm').value = s.n; }
      if (slot === 'bottom') { state.nBottom = s.n; state.bottomName = name; document.getElementById('snbottom').value = s.n; }
      refreshLabels();
    }

    function refreshLabels() {
      document.getElementById('lt').textContent      = state.t.toFixed(0) + ' nm';
      document.getElementById('lntop').textContent    = state.nTop.toFixed(3);
      document.getElementById('lnfilm').textContent   = state.nFilm.toFixed(3);
      document.getElementById('lnbottom').textContent = state.nBottom.toFixed(3);
    }

    document.getElementById('st').addEventListener('input', () => {
      state.t = parseFloat(document.getElementById('st').value);
      refreshLabels();
    });
    document.getElementById('sntop').addEventListener('input', () => {
      state.nTop = parseFloat(document.getElementById('sntop').value);
      document.getElementById('selTop').value = 'Custom';
      state.topName = 'Custom';
      refreshLabels();
    });
    document.getElementById('snfilm').addEventListener('input', () => {
      state.nFilm = parseFloat(document.getElementById('snfilm').value);
      document.getElementById('selFilm').value = 'Custom';
      state.filmName = 'Custom';
      refreshLabels();
    });
    document.getElementById('snbottom').addEventListener('input', () => {
      state.nBottom = parseFloat(document.getElementById('snbottom').value);
      document.getElementById('selBottom').value = 'Custom';
      state.bottomName = 'Custom';
      refreshLabels();
    });
    document.getElementById('selTop').addEventListener('change', e => applySubstance('top', e.target.value));
    document.getElementById('selFilm').addEventListener('change', e => applySubstance('film', e.target.value));
    document.getElementById('selBottom').addEventListener('change', e => applySubstance('bottom', e.target.value));

    const PRESETS = {
      soap:     { top: 'Air', film: 'Soap Film',     bottom: 'Air',   t: 380 },
      oilwater: { top: 'Air', film: 'Vegetable Oil',  bottom: 'Water', t: 450 },
      glass:    { top: 'Air', film: 'Water',          bottom: 'Glass (crown)', t: 500 },
    };
    document.querySelectorAll('.film-preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const p = PRESETS[btn.dataset.preset];
        document.getElementById('selTop').value = p.top;
        document.getElementById('selFilm').value = p.film;
        document.getElementById('selBottom').value = p.bottom;
        applySubstance('top', p.top);
        applySubstance('film', p.film);
        applySubstance('bottom', p.bottom);
        state.t = p.t;
        document.getElementById('st').value = p.t;
        refreshLabels();
      });
    });

    refreshLabels();

    // ── Physics ──
    function topShift()    { return state.nFilm > state.nTop; }
    function bottomShift() { return state.nBottom > state.nFilm; }
    function netExtraPhase() { return (topShift() !== bottomShift()) ? Math.PI : 0; }

    function opticalPathNm() { return 2 * state.nFilm * state.t; }

    function totalPhase(lambdaNm) {
      const pathPhase = (2 * Math.PI * opticalPathNm()) / lambdaNm;
      return pathPhase + netExtraPhase();
    }
    function reflectance(lambdaNm) {
      // simple two-beam equal-amplitude interference model, normalized 0–1
      return 0.5 * (1 + Math.cos(totalPhase(lambdaNm)));
    }

    // approximate visible-spectrum wavelength → RGB
    function wavelengthRGB(nm) {
      let r=0,g=0,b=0;
      if (nm >= 380 && nm < 440)      { r = -(nm-440)/(440-380); g = 0; b = 1; }
      else if (nm >= 440 && nm < 490) { r = 0; g = (nm-440)/(490-440); b = 1; }
      else if (nm >= 490 && nm < 510) { r = 0; g = 1; b = -(nm-510)/(510-490); }
      else if (nm >= 510 && nm < 580) { r = (nm-510)/(580-510); g = 1; b = 0; }
      else if (nm >= 580 && nm < 645) { r = 1; g = -(nm-645)/(645-580); b = 0; }
      else if (nm >= 645 && nm <= 700){ r = 1; g = 0; b = 0; }
      return [r,g,b];
    }

    function findPeaks() {
      const steps = 200;
      const samples = [];
      for (let i=0;i<=steps;i++) {
        const lam = LAMBDA_MIN + (LAMBDA_MAX-LAMBDA_MIN)*i/steps;
        samples.push({ lam, R: reflectance(lam) });
      }
      const peaks = [];
      for (let i=1;i<samples.length-1;i++) {
        const a = samples[i-1], b = samples[i], c = samples[i+1];
        if (b.R > a.R && b.R > c.R) peaks.push(b);
      }
      peaks.sort((p,q) => q.R - p.R);
      return peaks;
    }
    function dominantWavelength() {
      const peaks = findPeaks();
      if (peaks.length === 0 || peaks[0].R < 0.5) return null;
      return peaks[0];
    }

    function perceivedColor() {
      let numR=0, numG=0, numB=0, denR=0, denG=0, denB=0;
      const steps = 65;
      for (let i=0;i<=steps;i++) {
        const lam = LAMBDA_MIN + (LAMBDA_MAX-LAMBDA_MIN)*i/steps;
        const refl = reflectance(lam);
        const [r,g,b] = wavelengthRGB(lam);
        numR += r*refl; denR += r;
        numG += g*refl; denG += g;
        numB += b*refl; denB += b;
      }
      const chR = denR > 0 ? numR/denR : 0;
      const chG = denG > 0 ? numG/denG : 0;
      const chB = denB > 0 ? numB/denB : 0;
      const to255 = v => Math.max(0, Math.min(255, Math.round(v*255)));
      return `rgb(${to255(chR)},${to255(chG)},${to255(chB)})`;
    }

    // ── Layout ──
    function W() { return canvas.width / dpr; }
    function H() { return canvas.height / dpr; }
    function topH(h) { return h * 0.48; }

    function labelFor(name, n) {
      return name === 'Custom' ? `Custom (n=${n.toFixed(3)})` : `${name} (n=${n.toFixed(3)})`;
    }

    function drawSchematic(w, hTop) {
      const filmTopY = hTop * 0.32, filmBotY = hTop * 0.72;
      const hitX = w * 0.42;
      const exitX = w * 0.56;

      const topAlpha = 0.04 + 0.05 * (state.nTop - 1);
      const botAlpha = 0.04 + 0.05 * (state.nBottom - 1);
      const filmAlpha = 0.06 + 0.06 * (state.nFilm - 1);

      ctx.fillStyle = `rgba(91,141,239,${topAlpha})`;
      ctx.fillRect(0, 0, w, filmTopY);
      ctx.fillStyle = `rgba(78,205,196,${filmAlpha})`;
      ctx.fillRect(0, filmTopY, w, filmBotY - filmTopY);
      ctx.fillStyle = `rgba(255,209,102,${botAlpha})`;
      ctx.fillRect(0, filmBotY, w, hTop - filmBotY);

      [filmTopY, filmBotY].forEach(y => {
        ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y);
        ctx.strokeStyle = 'rgba(230,224,212,0.4)'; ctx.lineWidth = 1.3; ctx.stroke();
      });

      const inX0 = hitX - w*0.14, inY0 = filmTopY - hTop*0.22;
      drawArrow(inX0, inY0, hitX, filmTopY, '#828282', 1.6);

      const r1X = hitX + w*0.14, r1Y = filmTopY - hTop*0.22;
      drawArrow(hitX, filmTopY, r1X, r1Y, '#FFD166', 2);
      if (topShift()) drawPhaseFlipMark((hitX+r1X)/2, (filmTopY+r1Y)/2 - 6, '#FFD166');

      const botHitX = hitX + (exitX - hitX);
      drawLine(hitX, filmTopY, botHitX, filmBotY, 'rgba(230,224,212,0.55)');

      drawLine(botHitX, filmBotY, exitX, filmTopY, 'rgba(78,205,196,0.7)');
      const r2X = exitX + w*0.14, r2Y = filmTopY - hTop*0.22;
      drawArrow(exitX, filmTopY, r2X, r2Y, '#4ECDC4', 2);
      if (bottomShift()) drawPhaseFlipMark((exitX+r2X)/2, (filmTopY+r2Y)/2 - 6, '#4ECDC4');

      const tArrowX = w * 0.14;
      drawDoubleArrow(tArrowX, filmTopY, tArrowX, filmBotY, 'rgba(255,209,102,0.8)');
      ctx.fillStyle = 'rgba(255,209,102,0.9)';
      ctx.font = `${Math.max(10, w*0.024)}px 'DM Mono', monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(`t = ${state.t.toFixed(0)} nm`, tArrowX, filmTopY - 10);

      const labelX = w * 0.22;
      ctx.font = `${Math.max(9, w*0.02)}px 'DM Mono', monospace`;
      ctx.fillStyle = 'rgba(91,141,239,0.9)';
      ctx.textAlign = 'left';
      ctx.fillText(labelFor(state.topName, state.nTop), labelX, filmTopY*0.5 + 4);
      ctx.fillStyle = 'rgba(78,205,196,0.95)';
      ctx.fillText(labelFor(state.filmName, state.nFilm), labelX, (filmTopY+filmBotY)/2 + 4);
      ctx.fillStyle = 'rgba(255,209,102,0.95)';
      ctx.fillText(labelFor(state.bottomName, state.nBottom), labelX, filmBotY + (hTop-filmBotY)*0.5 + 12);

      ctx.fillStyle = 'rgba(230,224,212,0.5)';
      ctx.textAlign = 'right';
      ctx.fillText('Normal incidence (schematic angle for clarity)', w*0.97, hTop*0.06);
    }

    function drawLine(x0,y0,x1,y1,color) {
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1);
      ctx.strokeStyle = color; ctx.lineWidth = 1.6; ctx.stroke();
    }
    function drawArrow(x0,y0,x1,y1,color,width) {
      const ang = Math.atan2(y1-y0, x1-x0);
      const hl = 7;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1);
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x1,y1);
      ctx.lineTo(x1 - hl*Math.cos(ang-0.42), y1 - hl*Math.sin(ang-0.42));
      ctx.lineTo(x1 - hl*Math.cos(ang+0.42), y1 - hl*Math.sin(ang+0.42));
      ctx.closePath(); ctx.fillStyle = color; ctx.fill();
    }
    function drawDoubleArrow(x0,y0,x1,y1,color) {
      drawLine(x0,y0,x1,y1,color);
      const ang = Math.atan2(y1-y0, x1-x0);
      [[x0,y0,ang+Math.PI],[x1,y1,ang]].forEach(([x,y,a]) => {
        const hl = 6;
        ctx.beginPath();
        ctx.moveTo(x,y);
        ctx.lineTo(x - hl*Math.cos(a-0.4), y - hl*Math.sin(a-0.4));
        ctx.lineTo(x - hl*Math.cos(a+0.4), y - hl*Math.sin(a+0.4));
        ctx.closePath(); ctx.fillStyle = color; ctx.fill();
      });
    }
    function drawPhaseFlipMark(x, y, color) {
      ctx.beginPath();
      ctx.moveTo(x-9, y);
      ctx.bezierCurveTo(x-4.5, y-7, x-4.5, y+7, x, y);
      ctx.bezierCurveTo(x+4.5, y-7, x+4.5, y+7, x+9, y);
      ctx.strokeStyle = color; ctx.lineWidth = 1.4; ctx.stroke();
      ctx.fillStyle = color;
      ctx.font = `9px 'DM Mono', monospace`;
      ctx.textAlign = 'center';
      ctx.fillText('π', x, y - 12);
    }

    function drawSpectrum(w, hTop, hBot) {
      const panelTop = hTop, panelH = hBot;
      const plotX0 = w * 0.10, plotX1 = w * 0.72;
      const plotY0 = panelTop + panelH*0.20, plotY1 = panelTop + panelH*0.66;

      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath(); ctx.moveTo(0, panelTop); ctx.lineTo(w, panelTop); ctx.stroke();

      function xPx(lam) { return plotX0 + (lam-LAMBDA_MIN)/(LAMBDA_MAX-LAMBDA_MIN) * (plotX1-plotX0); }
      function yPx(R)   { return plotY1 - R * (plotY1-plotY0); }

      const stripY = plotY1 + 24, stripH = 14;
      const steps = 200;
      for (let i=0;i<steps;i++) {
        const lam = LAMBDA_MIN + (LAMBDA_MAX-LAMBDA_MIN)*i/steps;
        const [r,g,b] = wavelengthRGB(lam);
        ctx.fillStyle = `rgb(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)})`;
        ctx.fillRect(xPx(lam), stripY, (plotX1-plotX0)/steps + 1, stripH);
      }
      ctx.strokeStyle = 'rgba(230,224,212,0.3)'; ctx.lineWidth = 1;
      ctx.strokeRect(plotX0, stripY, plotX1-plotX0, stripH);

      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(plotX0, plotY0); ctx.lineTo(plotX0, plotY1); ctx.lineTo(plotX1, plotY1);
      ctx.stroke();

      ctx.font = `${Math.max(9, w*0.018)}px 'DM Mono', monospace`;
      ctx.fillStyle = 'rgba(230,224,212,0.6)';
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      [400,450,500,550,600,650,700].forEach(lam => {
        const x = xPx(lam);
        ctx.beginPath(); ctx.moveTo(x, plotY0); ctx.lineTo(x, plotY1); ctx.stroke();
        ctx.textAlign = 'center';
        ctx.fillText(lam+'', x, stripY + stripH + 16);
      });
      ctx.textAlign = 'right';
      ctx.fillText('1.0', plotX0 - 6, yPx(1) + 3);
      ctx.fillText('0.0', plotX0 - 6, yPx(0) + 3);

      ctx.beginPath();
      ctx.moveTo(xPx(LAMBDA_MIN), yPx(reflectance(LAMBDA_MIN)));
      for (let i=1;i<=steps;i++) {
        const lam = LAMBDA_MIN + (LAMBDA_MAX-LAMBDA_MIN)*i/steps;
        ctx.lineTo(xPx(lam), yPx(reflectance(lam)));
      }
      ctx.strokeStyle = '#828282'; ctx.lineWidth = 2; ctx.stroke();
      ctx.lineTo(plotX1, plotY1); ctx.lineTo(plotX0, plotY1); ctx.closePath();
      ctx.fillStyle = 'rgba(230,224,212,0.08)'; ctx.fill();

      const samples = [];
      for (let i=0;i<=steps;i++) {
        const lam = LAMBDA_MIN + (LAMBDA_MAX-LAMBDA_MIN)*i/steps;
        samples.push({ lam, R: reflectance(lam) });
      }
      for (let i=1;i<samples.length-1;i++) {
        const a = samples[i-1], b = samples[i], c = samples[i+1];
        if (b.R > a.R && b.R > c.R && b.R > 0.6) {
          markPoint(xPx(b.lam), yPx(b.R), '#828282', false);
        } else if (b.R < a.R && b.R < c.R && b.R < 0.4) {
          markPoint(xPx(b.lam), yPx(b.R), '#3A3A3A', true);
        }
      }

      const swX = plotX1 + 24, swY = plotY0, swW = w - swX - w*0.03, swH = plotY1 - plotY0;
      ctx.fillStyle = perceivedColor();
      ctx.fillRect(swX, swY, Math.max(swW,10), swH);
      ctx.strokeStyle = 'rgba(230,224,212,0.4)'; ctx.lineWidth = 1;
      ctx.strokeRect(swX, swY, Math.max(swW,10), swH);
      ctx.fillStyle = 'rgba(230,224,212,0.6)';
      ctx.font = `${Math.max(9, w*0.018)}px 'DM Mono', monospace`;
      ctx.textAlign = 'left';
      ctx.fillText('Reflected', swX, swY - 8);
      ctx.fillText('color', swX, swY + 4);
      const peak = dominantWavelength();
      ctx.fillStyle = 'rgba(230,224,212,0.7)';
      ctx.textAlign = 'center';
      ctx.fillText(peak ? peak.lam.toFixed(0) + ' nm' : '—', swX + Math.max(swW,10)/2, swY + swH + 16);

      ctx.fillStyle = 'rgba(230,224,212,0.5)';
      ctx.textAlign = 'left';
      ctx.fillText('Reflectance vs. wavelength (visible spectrum)', w*0.03, panelTop + 16);
    }

    function markPoint(x, y, color, dark) {
      ctx.beginPath(); ctx.arc(x, y, 3.5, 0, 2*Math.PI);
      if (dark) { ctx.fillStyle = '#828282'; ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.fill(); ctx.stroke(); }
      else { ctx.fillStyle = color; ctx.fill(); }
    }

    function updateReadout() {
      const opl = opticalPathNm();
      const phase = netExtraPhase();
      const peak = dominantWavelength();

      const rphaseEl = document.getElementById('rphase');
      if (phase === Math.PI) {
        rphaseEl.textContent = 'OUT OF PHASE (Δφ = π)';
        rphaseEl.style.color = '#F783AC';
      } else {
        rphaseEl.textContent = 'IN PHASE (Δφ = 0)';
        rphaseEl.style.color = '#4ECDC4';
      }

      const rcolorEl = document.getElementById('rcolor');
      if (peak) {
        rcolorEl.textContent = peak.lam.toFixed(0) + ' nm (R = ' + peak.R.toFixed(2) + ')';
        const [r,g,b] = wavelengthRGB(peak.lam);
        rcolorEl.style.color = `rgb(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)})`;
      } else {
        rcolorEl.textContent = 'No strong peak (broadband)';
        rcolorEl.style.color = '';
      }

      document.getElementById('ropl').textContent = opl.toFixed(1) + ' nm';
      document.getElementById('rtop').textContent = topShift() ? 'π shift' : 'no shift';
      document.getElementById('rbot').textContent = bottomShift() ? 'π shift' : 'no shift';
    }

    function render() {
      const w = W(), h = H();
      const hTop = topH(h);
      const hBot = h - hTop;
      ctx.clearRect(0, 0, w, h);
      drawSchematic(w, hTop);
      drawSpectrum(w, hTop, hBot);
      updateReadout();
    }

    function frame() {
      _simRaf = requestAnimationFrame(frame);
      render();
    }
    _simRaf = requestAnimationFrame(frame);
  }
};


SIMS['dyn-drag'] = {
  title: "Drag Force (Quadratic)",
  subtitle: "Adjust fluid density ρ, speed v, drag coefficient C_d (or pick a shape), and cross-sectional area A — watch the drag force grow with the square of speed.",

  build(host) {
    const SHAPES = [
      { name: 'Sphere',           cd: 0.47 },
      { name: 'Streamlined body', cd: 0.04 },
      { name: 'Cylinder (side)',  cd: 0.82 },
      { name: 'Cube',             cd: 1.05 },
      { name: 'Flat plate',       cd: 1.28 },
    ];
    function shapeByName(name) { return SHAPES.find(s => s.name === name); }
    function buildShapeOptions(selectedName) {
      const custom = `<option value="Custom" ${selectedName==='Custom'?'selected':''}>Custom</option>`;
      const rest = SHAPES.map(s =>
        `<option value="${s.name}" ${s.name===selectedName?'selected':''}>${s.name} (C_d≈${s.cd.toFixed(2)})</option>`
      ).join('');
      return custom + rest;
    }

    const state = { rho: 1.2, v: 15, cd: 0.47, A: 1.0, shapeName: 'Sphere', particles: [] };
    const V_MAX = 40;

    host.insertAdjacentHTML('beforeend', `
      <div class="sim-layout">
        <div class="sim-canvas-wrap"><canvas id="drag-canvas"></canvas></div>
        <div class="sim-panel">

          <div class="sim-equation">
            <div class="eq-label">Equation</div>
            <div class="eq-display">$$F_d = \\tfrac{1}{2}\\rho v^2 C_d A$$</div>
            <div style="font-size:0.75rem;opacity:0.6;margin-top:6px;">
              Quadratic drag — valid at higher Reynolds numbers (turbulent regime), unlike linear (Stokes) drag at low speed.
            </div>
          </div>

          <div class="sim-controls">
            <h3>Variables</h3>

            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">ρ</span> — fluid density</span>
                <span class="sl-val" id="lrho">1.20 kg/m³</span>
              </div>
              <input type="range" id="srho" min="0.5" max="1200" step="0.5" value="1.2">
            </div>

            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">v</span> — speed</span>
                <span class="sl-val" id="lv">15.0 m/s</span>
              </div>
              <input type="range" id="sv" min="0" max="40" step="0.5" value="15">
            </div>

            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name">Shape / C_d</span>
                <span class="sl-val" id="lcd">0.470</span>
              </div>
              <select class="film-select" id="selShape">${buildShapeOptions('Sphere')}</select>
              <input type="range" id="scd" min="0.01" max="2.00" step="0.01" value="0.47">
            </div>

            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">A</span> — cross-sectional area</span>
                <span class="sl-val" id="lA">1.00 m²</span>
              </div>
              <input type="range" id="sA" min="0.01" max="5" step="0.01" value="1.0">
            </div>
          </div>

          <div class="sim-readout">
            <h3>Live Readout</h3>
            <div class="readout-row"><span class="rkey">Drag force F_d</span><span class="rval hi" id="rFd">—</span></div>
            <div class="readout-row"><span class="rkey">Dynamic pressure (½ρv²)</span><span class="rval" id="rq">—</span></div>
            <div class="readout-row"><span class="rkey">Speed v</span><span class="rval" id="rv">—</span></div>
            <div class="readout-row"><span class="rkey">Drag coefficient C_d</span><span class="rval" id="rcd">—</span></div>
            <div class="readout-row"><span class="rkey">Area A</span><span class="rval" id="rA">—</span></div>
          </div>

          <div class="sim-legend">
            <h3>Legend</h3>
            <div class="legend-row"><div class="legend-dot" style="background:#D9B382"></div>Object</div>
            <div class="legend-row"><div class="legend-dot" style="background:#5B8DEF"></div>Flow particles (speed ∝ v)</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#F783AC"></div>Drag force F_d</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#4ECDC4"></div>F_d vs. v curve</div>
            <div class="legend-row"><div class="legend-dot" style="background:#828282"></div>Current (v, F_d)</div>
          </div>
        </div>
      </div>`);

    renderMath();

    // ── Canvas ──
    const canvas = document.getElementById('drag-canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    function resize() {
      const w = canvas.parentElement.clientWidth;
      const h = Math.max(380, w * 0.9);
      canvas.width  = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
      seedParticles();
    }
    resize();
    const _ro = new ResizeObserver(resize);
    _ro.observe(canvas.parentElement);

    // ── Controls ──
    function refreshLabels() {
      document.getElementById('lrho').textContent = state.rho.toFixed(state.rho < 10 ? 2 : 0) + ' kg/m³';
      document.getElementById('lv').textContent    = state.v.toFixed(1) + ' m/s';
      document.getElementById('lcd').textContent   = state.cd.toFixed(3);
      document.getElementById('lA').textContent    = state.A.toFixed(2) + ' m²';
    }

    document.getElementById('srho').addEventListener('input', () => {
      state.rho = parseFloat(document.getElementById('srho').value);
      refreshLabels();
    });
    document.getElementById('sv').addEventListener('input', () => {
      state.v = parseFloat(document.getElementById('sv').value);
      refreshLabels();
    });
    document.getElementById('sA').addEventListener('input', () => {
      state.A = parseFloat(document.getElementById('sA').value);
      refreshLabels();
    });
    document.getElementById('scd').addEventListener('input', () => {
      state.cd = parseFloat(document.getElementById('scd').value);
      state.shapeName = 'Custom';
      document.getElementById('selShape').value = 'Custom';
      refreshLabels();
    });
    document.getElementById('selShape').addEventListener('change', e => {
      const s = shapeByName(e.target.value);
      if (!s) return; // Custom — slider is the source of truth
      state.cd = s.cd;
      state.shapeName = s.name;
      document.getElementById('scd').value = s.cd;
      refreshLabels();
    });

    refreshLabels();

    // ── Physics ──
    function dragForce(rho, v, cd, A) { return 0.5 * rho * v * v * cd * A; }
    function currentFd() { return dragForce(state.rho, state.v, state.cd, state.A); }

    // ── Flow particles (purely visual — speed scales with v) ──
    function seedParticles() {
      const S = sz();
      state.particles = [];
      const count = 26;
      for (let i = 0; i < count; i++) {
        state.particles.push({
          x: Math.random() * S,
          y: S * 0.15 + Math.random() * S * 0.4,
          seed: Math.random() * 1000
        });
      }
    }

    // ── Layout ──
    function sz() { return canvas.width / dpr; } // scene panel is square-ish, uses full width
    function W() { return canvas.width / dpr; }
    function H() { return canvas.height / dpr; }
    function topH(h) { return h * 0.52; }

    function drawScene(w, hTop, dt) {
      const cy = hTop * 0.42;
      const objX = w * 0.42;

      // subtle grid
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      const step = w * 0.08;
      for (let x = 0; x < w; x += step) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,hTop); ctx.stroke(); }

      // Flow particles streaming left → right past the object (spawn at the
      // left edge, drift toward positive x, respawn once off the right
      // edge). The trail fades out behind the particle's direction of
      // travel so the direction reads unambiguously at a glance.
      const pxPerMs = (w * 0.22) * (state.v / V_MAX + 0.05);
      state.particles.forEach(p => {
        p.x += pxPerMs * dt;
        if (p.x > w + 20) { p.x = -Math.random()*40; p.y = hTop*0.1 + Math.random()*hTop*0.6; }
        const trailLen = 10 + 30 * (state.v / V_MAX);
        // trail extends behind the particle (to its left, since it's
        // traveling right) and fades toward the tail end
        const grad = ctx.createLinearGradient(p.x, p.y, p.x - trailLen, p.y);
        grad.addColorStop(0, 'rgba(91,141,239,0.65)');
        grad.addColorStop(1, 'rgba(91,141,239,0)');
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - trailLen, p.y);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.4;
        ctx.stroke();
        // leading edge marker (the actual direction of travel)
        ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, 2*Math.PI);
        ctx.fillStyle = 'rgba(91,141,239,0.9)'; ctx.fill();
      });

      // object — size reflects A on a compressive (sqrt) scale so it stays on-screen
      const objR = Math.max(14, Math.min(60, 16 * Math.sqrt(state.A)));
      drawShapeIcon(objX, cy, objR, state.shapeName);

      // drag force arrow — points opposite the flow (to the right, resisting leftward flow),
      // length on a log scale since F_d spans many orders of magnitude across the slider ranges
      const Fd = currentFd();
      const maxFd = dragForce(1200, V_MAX, 2.0, 5); // slider-maxima reference
      const maxArrow = w * 0.28;
      const arrowLen = Fd > 0 ? Math.max(10, maxArrow * (Math.log10(Fd + 1) / Math.log10(maxFd + 1))) : 0;
      drawArrow(objX + objR, cy, objX + objR + arrowLen, cy, '#F783AC', 2.4);
      ctx.fillStyle = 'rgba(247,131,172,0.9)';
      ctx.font = `${Math.max(10, w*0.026)}px 'DM Mono', monospace`;
      ctx.textAlign = 'left';
      ctx.fillText(`F_d = ${Fd.toFixed(1)} N`, objX + objR + arrowLen + 8, cy + 4);

      // labels
      ctx.fillStyle = 'rgba(91,141,239,0.85)';
      ctx.textAlign = 'left';
      ctx.fillText(`ρ = ${state.rho.toFixed(state.rho<10?2:0)} kg/m³   v = ${state.v.toFixed(1)} m/s`, w*0.03, hTop*0.08);
      ctx.fillStyle = 'rgba(230,224,212,0.6)';
      ctx.fillText(`${state.shapeName === 'Custom' ? 'Custom shape' : state.shapeName}, C_d = ${state.cd.toFixed(3)}, A = ${state.A.toFixed(2)} m²`, w*0.03, hTop*0.92);
    }

    function drawShapeIcon(x, y, r, shapeName) {
      ctx.save();
      ctx.translate(x, y);
      const grad = ctx.createRadialGradient(0,0,0,0,0,r*1.8);
      grad.addColorStop(0, 'rgba(217,179,130,0.5)');
      grad.addColorStop(1, 'rgba(217,179,130,0)');
      ctx.beginPath(); ctx.arc(0,0,r*1.8,0,2*Math.PI);
      ctx.fillStyle = grad; ctx.fill();

      ctx.fillStyle = '#D9B382';
      ctx.strokeStyle = 'rgba(20,15,10,0.4)';
      ctx.lineWidth = 1.2;

      switch (shapeName) {
        case 'Cube':
          ctx.fillRect(-r*0.8, -r*0.8, r*1.6, r*1.6);
          ctx.strokeRect(-r*0.8, -r*0.8, r*1.6, r*1.6);
          break;
        case 'Flat plate':
          ctx.fillRect(-r*0.18, -r*1.0, r*0.36, r*2.0);
          ctx.strokeRect(-r*0.18, -r*1.0, r*0.36, r*2.0);
          break;
        case 'Cylinder (side)':
          ctx.beginPath(); ctx.ellipse(0,0, r*0.55, r*1.0, 0, 0, 2*Math.PI);
          ctx.fill(); ctx.stroke();
          break;
        case 'Streamlined body':
          ctx.beginPath();
          ctx.moveTo(r*1.1, 0);
          ctx.quadraticCurveTo(0, -r*0.75, -r*1.1, 0);
          ctx.quadraticCurveTo(0, r*0.75, r*1.1, 0);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
          break;
        default: // Sphere / Custom
          ctx.beginPath(); ctx.arc(0,0,r,0,2*Math.PI);
          ctx.fill(); ctx.stroke();
      }
      ctx.restore();
    }

    function drawArrow(x0,y0,x1,y1,color,width) {
      if (Math.hypot(x1-x0, y1-y0) < 1) return;
      const ang = Math.atan2(y1-y0, x1-x0);
      const hl = 8;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1);
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x1,y1);
      ctx.lineTo(x1 - hl*Math.cos(ang-0.42), y1 - hl*Math.sin(ang-0.42));
      ctx.lineTo(x1 - hl*Math.cos(ang+0.42), y1 - hl*Math.sin(ang+0.42));
      ctx.closePath(); ctx.fillStyle = color; ctx.fill();
    }

    function drawCurve(w, hTop, hBot) {
      const panelTop = hTop, panelH = hBot;
      const plotX0 = w * 0.10, plotX1 = w * 0.92;
      const plotY0 = panelTop + panelH*0.18, plotY1 = panelTop + panelH*0.78;

      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath(); ctx.moveTo(0, panelTop); ctx.lineTo(w, panelTop); ctx.stroke();

      const maxFdOnCurve = dragForce(state.rho, V_MAX, state.cd, state.A) || 1;
      function xPx(v) { return plotX0 + (v / V_MAX) * (plotX1 - plotX0); }
      function yPx(Fd) { return plotY1 - Math.min(Fd / maxFdOnCurve, 1) * (plotY1 - plotY0); }

      // axes
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(plotX0, plotY0); ctx.lineTo(plotX0, plotY1); ctx.lineTo(plotX1, plotY1);
      ctx.stroke();

      // gridlines + v tick labels
      ctx.font = `${Math.max(9, w*0.018)}px 'DM Mono', monospace`;
      ctx.fillStyle = 'rgba(230,224,212,0.6)';
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      for (let vt = 0; vt <= V_MAX; vt += 10) {
        const x = xPx(vt);
        ctx.beginPath(); ctx.moveTo(x, plotY0); ctx.lineTo(x, plotY1); ctx.stroke();
        ctx.textAlign = 'center';
        ctx.fillText(vt + ' m/s', x, plotY1 + 18);
      }
      ctx.textAlign = 'right';
      ctx.fillText(maxFdOnCurve.toFixed(0)+' N', plotX0 - 6, plotY0 + 3);
      ctx.fillText('0 N', plotX0 - 6, plotY1 + 3);

      // quadratic curve
      ctx.beginPath();
      const steps = 100;
      for (let i=0;i<=steps;i++) {
        const v = V_MAX * i / steps;
        const Fd = dragForce(state.rho, v, state.cd, state.A);
        const px = xPx(v), py = yPx(Fd);
        if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.strokeStyle = '#4ECDC4'; ctx.lineWidth = 2; ctx.stroke();
      ctx.lineTo(plotX1, plotY1); ctx.lineTo(plotX0, plotY1); ctx.closePath();
      ctx.fillStyle = 'rgba(78,205,196,0.08)'; ctx.fill();

      // current point marker + guide lines
      const curX = xPx(state.v), curY = yPx(currentFd());
      ctx.beginPath();
      ctx.moveTo(curX, curY); ctx.lineTo(curX, plotY1);
      ctx.moveTo(curX, curY); ctx.lineTo(plotX0, curY);
      ctx.strokeStyle = 'rgba(247,131,172,0.5)';
      ctx.setLineDash([3,3]); ctx.lineWidth = 1;
      ctx.stroke(); ctx.setLineDash([]);

      const glow = ctx.createRadialGradient(curX, curY, 0, curX, curY, 12);
      glow.addColorStop(0, 'rgba(230,224,212,0.6)');
      glow.addColorStop(1, 'rgba(230,224,212,0)');
      ctx.beginPath(); ctx.arc(curX, curY, 12, 0, 2*Math.PI);
      ctx.fillStyle = glow; ctx.fill();
      ctx.beginPath(); ctx.arc(curX, curY, 4.5, 0, 2*Math.PI);
      ctx.fillStyle = '#828282'; ctx.fill();

      ctx.fillStyle = 'rgba(230,224,212,0.5)';
      ctx.textAlign = 'left';
      ctx.fillText('F_d vs. v at current ρ, C_d, A (curve rescales with them)', w*0.03, panelTop + 16);
    }

    function updateReadout() {
      const Fd = currentFd();
      document.getElementById('rFd').textContent = Fd.toFixed(2) + ' N';
      document.getElementById('rq').textContent  = (0.5 * state.rho * state.v * state.v).toFixed(2) + ' Pa';
      document.getElementById('rv').textContent  = state.v.toFixed(2) + ' m/s';
      document.getElementById('rcd').textContent = state.cd.toFixed(3);
      document.getElementById('rA').textContent  = state.A.toFixed(3) + ' m²';
    }

    // ── Animation loop ──
    let last = null;
    function frame(ts) {
      _simRaf = requestAnimationFrame(frame);
      const dt = last ? Math.min((ts - last) / 1000, 0.05) : 0;
      last = ts;

      const w = W(), h = H();
      const hTop = topH(h);
      const hBot = h - hTop;

      ctx.clearRect(0, 0, w, h);
      drawScene(w, hTop, dt);
      drawCurve(w, hTop, hBot);
      updateReadout();
    }
    _simRaf = requestAnimationFrame(frame);
  }
};

SIMS['osc-pendulum'] = {
  title: "Simple Pendulum",
  subtitle: "Adjust length L, gravity g, mass m, and starting angle θ₀ — watch the pendulum swing and see how it maps onto the same period formula as a mass-spring system.",

  build(host) {
    const state = { L: 1.5, g: 9.8, m: 1.0, theta0Deg: 20, t: 0, trail: [] };
    const WINDOW = 8; // seconds of history shown in the scrolling θ(t) graph

    host.insertAdjacentHTML('beforeend', `
      <div class="sim-layout">
        <div class="sim-canvas-wrap"><canvas id="pend-canvas"></canvas></div>
        <div class="sim-panel">

          <div class="sim-equation">
            <div class="eq-label">Equation</div>

          <div class="sim-readout">

            <div class="readout-row"><span class="rkey">Check: 2π√(m/k_eff)</span><span class="rval" id="rcheck">—</span></div>
            <div class="readout-row"><span class="rkey">Note</span><span class="rval" id="rnote">T is independent of m</span></div>
          </div>

          <div class="sim-legend">
            <h3>Legend</h3>
            <div class="legend-row"><div class="legend-dot" style="background:#5B8DEF"></div>Pendulum bob</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#4ECDC4;opacity:.7"></div>θ(t) trace</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#8A7A65;border-top-style:dashed"></div>Equilibrium (θ = 0)</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#F783AC"></div>Velocity direction</div>
          </div>
        </div>
      </div>`);

    renderMath();

    // ── Canvas ──
    const canvas = document.getElementById('pend-canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    function resize() {
      const w = canvas.parentElement.clientWidth;
      const h = Math.max(340, w * 0.78);
      canvas.width  = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
      state.trail = [];
    }
    resize();
    const _ro = new ResizeObserver(resize);
    _ro.observe(canvas.parentElement);

    // ── Sliders ──
    function readSliders() {
      state.L         = parseFloat(document.getElementById('sL').value);
      state.g         = parseFloat(document.getElementById('sg').value);
      state.m         = parseFloat(document.getElementById('sm').value);

      document.getElementById('lL').textContent      = state.L.toFixed(2) + ' m';
      document.getElementById('lg').textContent      = state.g.toFixed(2) + ' m/s²';
      document.getElementById('lm').textContent      = state.m.toFixed(2) + ' kg';
      document.getElementById('ltheta0').textContent = state.theta0Deg.toFixed(1) + '°';
    }
    ['sL','sg','sm','stheta0'].forEach(id => document.getElementById(id).addEventListener('input', readSliders));

    // ── Physics (small-angle SHM approximation) ──
    function omega() { return Math.sqrt(state.g / state.L); }
    function periodT() { return 2 * Math.PI / omega(); }
    function theta0Rad() { return state.theta0Deg * Math.PI / 180; }
    function thetaAt(t) { return theta0Rad() * Math.cos(omega() * t); }
    function thetaDotAt(t) { return -theta0Rad() * omega() * Math.sin(omega() * t); }
    function kEff() { return state.m * state.g / state.L; }

    // ── Layout ──
    function W() { return canvas.width / dpr; }
    function H() { return canvas.height / dpr; }
    function springRegionH(h) { return h * 0.5; }
    const GPAD = { l: 58, r: 24, t: 16, b: 34 };

    // ── Draw: pendulum region ──
    function drawPendulum(theta, w, hTop) {
      const pivotX = w / 2;
      const pivotY = hTop * 0.12;
      const rodPxPerM = Math.min(hTop * 0.75 / Math.max(state.L, 0.1), w * 0.32 / Math.max(state.L, 0.1));
      const rodLenPx = state.L * rodPxPerM;

      const bobX = pivotX + rodLenPx * Math.sin(theta);
      const bobY = pivotY + rodLenPx * Math.cos(theta);

      // pivot mount
      ctx.fillStyle = 'rgba(230,224,212,0.5)';
      ctx.fillRect(pivotX - 14, pivotY - 6, 28, 6);
      for (let i=-3;i<=3;i++) {
        ctx.beginPath();
        ctx.moveTo(pivotX + i*4, pivotY - 6);
        ctx.lineTo(pivotX + i*4 - 5, pivotY - 14);
        ctx.strokeStyle = 'rgba(230,224,212,0.35)'; ctx.lineWidth = 1;
        ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(pivotX, pivotY, 3, 0, 2*Math.PI);
      ctx.fillStyle = '#828282'; ctx.fill();

      // equilibrium dashed vertical
      ctx.beginPath();
      ctx.moveTo(pivotX, pivotY); ctx.lineTo(pivotX, pivotY + rodLenPx * 1.08);
      ctx.strokeStyle = 'rgba(138,122,101,0.5)';
      ctx.setLineDash([4,4]); ctx.lineWidth = 1;
      ctx.stroke(); ctx.setLineDash([]);

      // arc showing angular range ±θ0
      const th0 = theta0Rad();
      ctx.beginPath();
      ctx.arc(pivotX, pivotY, rodLenPx * 0.22, Math.PI/2 - th0, Math.PI/2 + th0, false);
      ctx.strokeStyle = 'rgba(255,209,102,0.5)'; ctx.lineWidth = 1.2;
      ctx.stroke();

      // rod
      ctx.beginPath();
      ctx.moveTo(pivotX, pivotY); ctx.lineTo(bobX, bobY);
      ctx.strokeStyle = 'rgba(230,224,212,0.6)';
      ctx.lineWidth = 1.6;
      ctx.stroke();

      // bob — radius scales gently with mass (cube-root, clamped)
      const bobR = Math.max(10, Math.min(26, 14 * Math.cbrt(state.m)));
      const g = ctx.createRadialGradient(bobX, bobY, 0, bobX, bobY, bobR*1.8);
      g.addColorStop(0, 'rgba(91,141,239,0.5)');
      g.addColorStop(1, 'rgba(91,141,239,0)');
      ctx.beginPath(); ctx.arc(bobX, bobY, bobR*1.8, 0, 2*Math.PI);
      ctx.fillStyle = g; ctx.fill();
      ctx.beginPath(); ctx.arc(bobX, bobY, bobR, 0, 2*Math.PI);
      ctx.fillStyle = '#5B8DEF'; ctx.fill();

      // velocity direction arrow (tangential to the swing)
      const thetaDot = thetaDotAt(state.t);
      const vScale = 40;
      const tangX = Math.cos(theta), tangY = -Math.sin(theta); // tangential unit vector
      const vx = tangX * thetaDot * vScale;
      const vy = tangY * thetaDot * vScale;
      if (Math.hypot(vx,vy) > 2) {
        const tipX = bobX + vx, tipY = bobY + vy;
        ctx.beginPath(); ctx.moveTo(bobX, bobY); ctx.lineTo(tipX, tipY);
        ctx.strokeStyle = 'rgba(247,131,172,0.85)'; ctx.lineWidth = 1.8; ctx.stroke();
        const ang = Math.atan2(tipY-bobY, tipX-bobX);
        const hl = 7;
        ctx.beginPath();
        ctx.moveTo(tipX, tipY);
        ctx.lineTo(tipX - hl*Math.cos(ang-0.42), tipY - hl*Math.sin(ang-0.42));
        ctx.lineTo(tipX - hl*Math.cos(ang+0.42), tipY - hl*Math.sin(ang+0.42));
        ctx.closePath(); ctx.fillStyle = 'rgba(247,131,172,0.85)'; ctx.fill();
      }

      // angle readout near bob
      ctx.fillStyle = 'rgba(255,209,102,0.85)';
      ctx.font = `${Math.max(10, w * 0.026)}px 'DM Mono', monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(`θ = ${(theta*180/Math.PI).toFixed(1)}°`, bobX, bobY + bobR + 18);
    }

    // ── Draw: scrolling θ(t) graph region ──
    function drawGraph(w, hTop, hGraph) {
      const offY = hTop;
      const gw = w, gh = hGraph;
      const th0Deg = state.theta0Deg;
      const thetaMaxDeg = th0Deg * 1.2 || 1;
      const tMin = Math.max(0, state.t - WINDOW);
      const tMax = tMin + WINDOW;

      function tPx(t) { return GPAD.l + ((t - tMin) / WINDOW) * (gw - GPAD.l - GPAD.r); }
      function yPx(thetaDeg) { return offY + GPAD.t + (gh - GPAD.t - GPAD.b) * 0.5 - (thetaDeg / thetaMaxDeg) * ((gh - GPAD.t - GPAD.b) * 0.5); }

      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath(); ctx.moveTo(0, offY); ctx.lineTo(gw, offY); ctx.stroke();

      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 8; i++) {
        const t = tMin + (i/8) * WINDOW;
        const px = tPx(t);
        ctx.beginPath(); ctx.moveTo(px, offY + GPAD.t); ctx.lineTo(px, offY + gh - GPAD.b); ctx.stroke();
      }
      for (let i = -2; i <= 2; i++) {
        const thd = (i/2) * thetaMaxDeg;
        const py = yPx(thd);
        ctx.beginPath(); ctx.moveTo(GPAD.l, py); ctx.lineTo(gw - GPAD.r, py); ctx.stroke();
      }

      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(GPAD.l, offY + GPAD.t); ctx.lineTo(GPAD.l, offY + gh - GPAD.b);
      ctx.lineTo(gw - GPAD.r, offY + gh - GPAD.b);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(GPAD.l, yPx(0)); ctx.lineTo(gw - GPAD.r, yPx(0));
      ctx.strokeStyle = 'rgba(138,122,101,0.6)';
      ctx.setLineDash([4,4]); ctx.lineWidth = 1;
      ctx.stroke(); ctx.setLineDash([]);

      ctx.fillStyle = 'rgba(230,224,212,0.7)';
      ctx.font = `${Math.max(9, gw * 0.02)}px 'DM Mono', monospace`;
      ctx.textAlign = 'center';
      for (let i = 0; i <= 4; i++) {
        const t = tMin + (i/4) * WINDOW;
        ctx.fillText(t.toFixed(1) + 's', tPx(t), offY + gh - GPAD.b + 16);
      }
      ctx.textAlign = 'right';
      ctx.fillText(thetaMaxDeg.toFixed(0)+'°', GPAD.l - 8, yPx(thetaMaxDeg) + 3);
      ctx.fillText((-thetaMaxDeg).toFixed(0)+'°', GPAD.l - 8, yPx(-thetaMaxDeg) + 3);

      const visible = state.trail.filter(p => p.t >= tMin);
      if (visible.length > 1) {
        ctx.beginPath();
        visible.forEach((p, i) => {
          const px = tPx(p.t), py = yPx(p.thetaDeg);
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        });
        ctx.strokeStyle = '#4ECDC4';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      const curThetaDeg = thetaAt(state.t) * 180 / Math.PI;
      const cpx = tPx(state.t), cpy = yPx(curThetaDeg);
      ctx.beginPath(); ctx.arc(cpx, cpy, 4.5, 0, 2*Math.PI);
      ctx.fillStyle = '#5B8DEF'; ctx.fill();
    }

    function updateReadout() {
      const T = periodT();
      const w0 = omega();
      const theta = thetaAt(state.t);
      const keff = kEff();
      const check = 2 * Math.PI * Math.sqrt(state.m / keff);
      document.getElementById('rT').textContent     = T.toFixed(3) + ' s';
      document.getElementById('romega').textContent = w0.toFixed(3) + ' rad/s';
      document.getElementById('rtheta').textContent = (theta*180/Math.PI).toFixed(2) + '°';
      document.getElementById('rkeff').textContent  = keff.toFixed(3) + ' N/m';
      document.getElementById('rcheck').textContent = check.toFixed(3) + ' s';
    }

    // ── Animation loop ──
    let last = null;
    function frame(ts) {
      _simRaf = requestAnimationFrame(frame);
      const dt = last ? Math.min((ts - last) / 1000, 0.05) : 0;
      last = ts;

      state.t += dt;

      const thetaDeg = thetaAt(state.t) * 180 / Math.PI;
      state.trail.push({ t: state.t, thetaDeg });
      const cutoff = state.t - WINDOW - 1;
      while (state.trail.length && state.trail[0].t < cutoff) state.trail.shift();

      const w = W(), h = H();
      const hTop = springRegionH(h);
      const hGraph = h - hTop;

      ctx.clearRect(0, 0, w, h);
      drawPendulum(thetaAt(state.t), w, hTop);
      drawGraph(w, hTop, hGraph);
      updateReadout();
    }
    _simRaf = requestAnimationFrame(frame);
  }
};

SIMS['dyn-hooke'] = {
  title: "Hooke's Law",
  subtitle: "Adjust the spring constant k and the displacement x — watch the restoring force grow linearly and always point back toward equilibrium.",

  build(host) {
    const state = { k: 20, x: 0.6 };
    const X_MAX = 2; // meters, displacement slider range

    host.insertAdjacentHTML('beforeend', `
      <div class="sim-layout">
        <div class="sim-canvas-wrap"><canvas id="hooke-canvas"></canvas></div>
        <div class="sim-panel">

          <div class="sim-equation">
            <div class="eq-label">Equation</div>
            <div class="eq-display">$$F = -kx$$</div>
            <div style="font-size:0.75rem;opacity:0.6;margin-top:6px;">
              The minus sign means F always points opposite the displacement — it's a restoring force, pulling the mass back toward x = 0.
            </div>
            <div style="font-size:0.78rem;opacity:0.85;margin-top:8px; line-height:1.5;">
              <b>k</b> = spring constant &nbsp;·&nbsp; <b>x</b> = displacement from equilibrium &nbsp;·&nbsp; <b>F</b> = restoring force
            </div>
          </div>

          <div class="sim-controls">
            <h3>Variables</h3>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">k</span> — spring constant</span>
                <span class="sl-val" id="lk">20.0 N/m</span>
              </div>
              <input type="range" id="sk" min="1" max="100" step="0.5" value="20">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">x</span> — displacement</span>
                <span class="sl-val" id="lx">0.60 m</span>
              </div>
              <input type="range" id="sx" min="-2" max="2" step="0.02" value="0.6">
            </div>
          </div>

          <div class="sim-readout">
            <h3>Live Readout</h3>
            <div class="readout-row"><span class="rkey">Restoring force F</span><span class="rval hi" id="rF">—</span></div>
            <div class="readout-row"><span class="rkey">Displacement x</span><span class="rval" id="rx">—</span></div>
            <div class="readout-row"><span class="rkey">Spring constant k</span><span class="rval" id="rk">—</span></div>
            <div class="readout-row"><span class="rkey">Elastic PE (½kx²)</span><span class="rval" id="rpe">—</span></div>
            <div class="readout-row"><span class="rkey">State</span><span class="rval" id="rstate">—</span></div>
          </div>

          <div class="sim-legend">
            <h3>Legend</h3>
            <div class="legend-row"><div class="legend-dot" style="background:#5B8DEF"></div>Mass</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#F783AC"></div>Restoring force F</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#8A7A65;border-top-style:dashed"></div>Equilibrium (x = 0)</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#4ECDC4"></div>F vs. x line (slope = −k)</div>
          </div>
        </div>
      </div>`);

    renderMath();

    // ── Canvas ──
    const canvas = document.getElementById('hooke-canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    function resize() {
      const w = canvas.parentElement.clientWidth;
      const h = Math.max(360, w * 0.85);
      canvas.width  = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }
    resize();
    const _ro = new ResizeObserver(resize);
    _ro.observe(canvas.parentElement);

    // ── Sliders ──
    function readSliders() {
      state.k = parseFloat(document.getElementById('sk').value);
      state.x = parseFloat(document.getElementById('sx').value);
      document.getElementById('lk').textContent = state.k.toFixed(1) + ' N/m';
      document.getElementById('lx').textContent = state.x.toFixed(2) + ' m';
    }
    ['sk','sx'].forEach(id => document.getElementById(id).addEventListener('input', readSliders));

    // ── Physics ──
    function forceAt(x) { return -state.k * x; }
    function peAt(x) { return 0.5 * state.k * x * x; }

    // ── Layout ──
    function W() { return canvas.width / dpr; }
    function H() { return canvas.height / dpr; }
    function topH(h) { return h * 0.48; }

    function drawScene(w, hTop) {
      const cy = hTop * 0.45;
      const wallX = w * 0.08;
      const pxPerM = (w * 0.34) / X_MAX;
      const eqX = w * 0.5;
      const massX = eqX + state.x * pxPerM;
      const massSize = 30;

      // wall (hatched)
      ctx.strokeStyle = 'rgba(230,224,212,0.5)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(wallX, cy - 50); ctx.lineTo(wallX, cy + 50); ctx.stroke();
      ctx.lineWidth = 1;
      for (let i = -5; i <= 5; i++) {
        ctx.beginPath();
        ctx.moveTo(wallX, cy + i*10);
        ctx.lineTo(wallX - 9, cy + i*10 + 9);
        ctx.strokeStyle = 'rgba(230,224,212,0.35)';
        ctx.stroke();
      }

      // equilibrium dashed line
      ctx.beginPath();
      ctx.moveTo(eqX, cy - 60); ctx.lineTo(eqX, cy + 60);
      ctx.strokeStyle = 'rgba(138,122,101,0.5)';
      ctx.setLineDash([4,4]); ctx.lineWidth = 1;
      ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(138,122,101,0.8)';
      ctx.font = `${Math.max(9,w*0.02)}px 'DM Mono', monospace`;
      ctx.textAlign = 'center';
      ctx.fillText('x = 0', eqX, cy + 78);

      // spring (zigzag from wall to mass, stretches/compresses with x)
      const coils = 12;
      const startX = wallX, endX = massX - massSize/2;
      const span = endX - startX;
      ctx.beginPath();
      ctx.moveTo(startX, cy);
      for (let i = 1; i < coils; i++) {
        const px = startX + (span * i) / coils;
        const py = cy + (i % 2 === 0 ? -13 : 13);
        ctx.lineTo(px, py);
      }
      ctx.lineTo(endX, cy);
      ctx.strokeStyle = 'rgba(230,224,212,0.55)';
      ctx.lineWidth = 1.8;
      ctx.stroke();

      // mass glow + block
      const g = ctx.createRadialGradient(massX, cy, 0, massX, cy, massSize*1.8);
      g.addColorStop(0, 'rgba(91,141,239,0.5)');
      g.addColorStop(1, 'rgba(91,141,239,0)');
      ctx.beginPath(); ctx.arc(massX, cy, massSize*1.8, 0, 2*Math.PI);
      ctx.fillStyle = g; ctx.fill();
      ctx.fillStyle = '#5B8DEF';
      ctx.fillRect(massX - massSize/2, cy - massSize/2, massSize, massSize);

      // force vector (restoring, opposite the displacement)
      const F = forceAt(state.x);
      const maxF = state.k <= 0 ? 1 : 100 * X_MAX; // slider-maxima reference for scaling
      const arrowLen = Math.min(Math.abs(F) / maxF, 1) * (w * 0.22);
      const dir = Math.sign(F) || 0;
      if (Math.abs(F) > 1e-6) {
        const tipX = massX + dir * arrowLen;
        drawArrow(massX, cy - massSize*0.9, tipX, cy - massSize*0.9, '#F783AC', 2.4);
        ctx.fillStyle = 'rgba(247,131,172,0.9)';
        ctx.font = `${Math.max(10,w*0.026)}px 'DM Mono', monospace`;
        ctx.textAlign = 'center';
        ctx.fillText(`F = ${F.toFixed(1)} N`, (massX+tipX)/2, cy - massSize*0.9 - 12);
      }

      // displacement double-arrow annotation
      const annY = cy + 45;
      drawDoubleArrow(eqX, annY, massX, annY, 'rgba(255,209,102,0.8)');
      ctx.fillStyle = 'rgba(255,209,102,0.9)';
      ctx.textAlign = 'center';
      ctx.fillText(`x = ${state.x.toFixed(2)} m`, (eqX+massX)/2, annY + 16);

      ctx.fillStyle = 'rgba(230,224,212,0.6)';
      ctx.textAlign = 'left';
      ctx.fillText(`k = ${state.k.toFixed(1)} N/m`, w*0.03, hTop*0.08);
    }

    function drawArrow(x0,y0,x1,y1,color,width) {
      if (Math.hypot(x1-x0,y1-y0) < 1) return;
      const ang = Math.atan2(y1-y0, x1-x0);
      const hl = 8;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1);
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x1,y1);
      ctx.lineTo(x1 - hl*Math.cos(ang-0.42), y1 - hl*Math.sin(ang-0.42));
      ctx.lineTo(x1 - hl*Math.cos(ang+0.42), y1 - hl*Math.sin(ang+0.42));
      ctx.closePath(); ctx.fillStyle = color; ctx.fill();
    }
    function drawLine(x0,y0,x1,y1,color) {
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1);
      ctx.strokeStyle = color; ctx.lineWidth = 1.6; ctx.stroke();
    }
    function drawDoubleArrow(x0,y0,x1,y1,color) {
      drawLine(x0,y0,x1,y1,color);
      const ang = Math.atan2(y1-y0, x1-x0);
      [[x0,y0,ang+Math.PI],[x1,y1,ang]].forEach(([x,y,a]) => {
        const hl = 6;
        ctx.beginPath();
        ctx.moveTo(x,y);
        ctx.lineTo(x - hl*Math.cos(a-0.4), y - hl*Math.sin(a-0.4));
        ctx.lineTo(x - hl*Math.cos(a+0.4), y - hl*Math.sin(a+0.4));
        ctx.closePath(); ctx.fillStyle = color; ctx.fill();
      });
    }

    function drawGraph(w, hTop, hBot) {
      const panelTop = hTop, panelH = hBot;
      const plotX0 = w * 0.12, plotX1 = w * 0.92;
      const plotY0 = panelTop + panelH*0.14, plotY1 = panelTop + panelH*0.86;
      const midY = (plotY0 + plotY1) / 2;

      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath(); ctx.moveTo(0, panelTop); ctx.lineTo(w, panelTop); ctx.stroke();

      const maxF = state.k * X_MAX;
      function xPx(x) { return (plotX0+plotX1)/2 + (x / X_MAX) * (plotX1-plotX0)/2; }
      function yPx(F) { return midY - (F / maxF) * (plotY1-plotY0)/2; }

      // gridlines
      ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1;
      for (let i=-4;i<=4;i++) {
        const x = (i/4)*X_MAX;
        const px = xPx(x);
        ctx.beginPath(); ctx.moveTo(px, plotY0); ctx.lineTo(px, plotY1); ctx.stroke();
      }
      for (let i=-2;i<=2;i++) {
        const F = (i/2)*maxF;
        const py = yPx(F);
        ctx.beginPath(); ctx.moveTo(plotX0, py); ctx.lineTo(plotX1, py); ctx.stroke();
      }

      // axes
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(plotX0, midY); ctx.lineTo(plotX1, midY);
      ctx.moveTo(xPx(0), plotY0); ctx.lineTo(xPx(0), plotY1);
      ctx.stroke();

      // tick labels
      ctx.font = `${Math.max(9,w*0.018)}px 'DM Mono', monospace`;
      ctx.fillStyle = 'rgba(230,224,212,0.65)';
      ctx.textAlign = 'center';
      [-X_MAX, -X_MAX/2, X_MAX/2, X_MAX].forEach(xv => {
        ctx.fillText(xv.toFixed(1)+'m', xPx(xv), midY + 16);
      });
      ctx.textAlign = 'right';
      ctx.fillText(maxF.toFixed(0)+'N', plotX0 - 6, yPx(maxF)+3);
      ctx.fillText((-maxF).toFixed(0)+'N', plotX0 - 6, yPx(-maxF)+3);

      // F = -kx line
      ctx.beginPath();
      ctx.moveTo(xPx(-X_MAX), yPx(forceAt(-X_MAX)));
      ctx.lineTo(xPx(X_MAX), yPx(forceAt(X_MAX)));
      ctx.strokeStyle = '#4ECDC4'; ctx.lineWidth = 2; ctx.stroke();

      // current point
      const cx = xPx(state.x), cy = yPx(forceAt(state.x));
      const glow = ctx.createRadialGradient(cx,cy,0,cx,cy,12);
      glow.addColorStop(0,'rgba(230,224,212,0.6)');
      glow.addColorStop(1,'rgba(230,224,212,0)');
      ctx.beginPath(); ctx.arc(cx,cy,12,0,2*Math.PI); ctx.fillStyle = glow; ctx.fill();
      ctx.beginPath(); ctx.arc(cx,cy,4.5,0,2*Math.PI); ctx.fillStyle = '#828282'; ctx.fill();

      ctx.fillStyle = 'rgba(230,224,212,0.5)';
      ctx.textAlign = 'left';
      ctx.fillText('F vs. x (slope = −k)', w*0.03, panelTop + 16);
    }

    function updateReadout() {
      const F = forceAt(state.x);
      const PE = peAt(state.x);
      document.getElementById('rF').textContent = F.toFixed(2) + ' N';
      document.getElementById('rx').textContent = state.x.toFixed(3) + ' m';
      document.getElementById('rk').textContent = state.k.toFixed(2) + ' N/m';
      document.getElementById('rpe').textContent = PE.toFixed(3) + ' J';
      document.getElementById('rstate').textContent =
        Math.abs(state.x) < 1e-6 ? 'At equilibrium' : (state.x > 0 ? 'Stretched' : 'Compressed');
    }

    function render() {
      const w = W(), h = H();
      const hTop = topH(h);
      const hBot = h - hTop;
      ctx.clearRect(0, 0, w, h);
      drawScene(w, hTop);
      drawGraph(w, hTop, hBot);
      updateReadout();
    }

    function frame() {
      _simRaf = requestAnimationFrame(frame);
      render();
    }
    _simRaf = requestAnimationFrame(frame);
  }
};


SIMS['optics-lensmaker'] = {
  title: "Lensmaker's Equation (General Medium)",
  subtitle: "Adjust the lens index n_L, the surrounding medium's index n_m, and the two surface curvatures R₁, R₂ — a lens can even flip from converging to diverging depending what it's submerged in.",

  build(host) {
    // Sign convention (light travels left → right, lens centered at x = 0):
    // R is positive if the surface's center of curvature lies to the right
    // of that surface, negative if to the left. A surface bulges AWAY from
    // its own center of curvature, so R>0 bulges left, R<0 bulges right.

    const state = {
      nL: 1.50,
      nm: 1.00,
      R1: 20,
      R2: -20
    };

    const R_LIMIT = 50;
    const FLAT_THRESHOLD = 0.5;

    // Animation clock
    const anim = {
      t: 0
    };

    host.insertAdjacentHTML('beforeend', `
      <div class="sim-layout">

        <div class="sim-canvas-wrap">
          <canvas id="lm-canvas"></canvas>
        </div>

        <div class="sim-panel">

          <div class="sim-equation">
            <div class="eq-label">Equation</div>

            <div class="eq-display">
              $$\\frac{1}{f} =
              \\left(\\frac{n_L}{n_m}-1\\right)
              \\left(\\frac{1}{R_1} - \\frac{1}{R_2}\\right)$$
            </div>

            <div style="
              font-size:0.75rem;
              opacity:0.6;
              margin-top:6px;
            ">
              Thin-lens approximation. Reduces to the air-only form
              (n_L − 1)(1/R₁ − 1/R₂) when n_m = 1.
              If n_L &lt; n_m, the sign flips — the lens can converge
              and diverge oppositely from what its shape alone would
              suggest in air.
            </div>

            <div style="
              font-size:0.78rem;
              opacity:0.85;
              margin-top:8px;
              line-height:1.5;
            ">
              <b>n_L</b> = lens index &nbsp;·&nbsp;
              <b>n_m</b> = surrounding medium index &nbsp;·&nbsp;
              <b>R₁, R₂</b> = surface radii of curvature &nbsp;·&nbsp;
              <b>f</b> = resulting focal length
            </div>
          </div>


          <!-- CONTROLS -->
          <div class="sim-controls">

            <h3>Variables</h3>

            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name">
                  <span class="sl-sym">n_L</span>
                  — lens index of refraction
                </span>

                <span class="sl-val" id="lnL">
                  1.500
                </span>
              </div>

              <input
                type="range"
                id="snL"
                min="1.10"
                max="2.00"
                step="0.01"
                value="1.50"
              >
            </div>


            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name">
                  <span class="sl-sym">n_m</span>
                  — surrounding medium index
                </span>

                <span class="sl-val" id="lnm">
                  1.000
                </span>
              </div>

              <input
                type="range"
                id="snm"
                min="1.00"
                max="2.00"
                step="0.01"
                value="1.00"
              >
            </div>


            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name">
                  <span class="sl-sym">R₁</span>
                  — first surface radius
                </span>

                <span class="sl-val" id="lR1">
                  20.0 cm
                </span>
              </div>

              <input
                type="range"
                id="sR1"
                min="-50"
                max="50"
                step="0.5"
                value="20"
              >
            </div>


            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name">
                  <span class="sl-sym">R₂</span>
                  — second surface radius
                </span>

                <span class="sl-val" id="lR2">
                  -20.0 cm
                </span>
              </div>

              <input
                type="range"
                id="sR2"
                min="-50"
                max="50"
                step="0.5"
                value="-20"
              >
            </div>

          </div>


          <!-- READOUT -->
          <div class="sim-readout">

            <h3>Live Readout</h3>

            <div class="readout-row">
              <span class="rkey">Focal length f</span>
              <span class="rval hi" id="rf">—</span>
            </div>

            <div class="readout-row">
              <span class="rkey">
                Relative index (n_L/n_m)
              </span>

              <span class="rval" id="rrel">—</span>
            </div>

            <div class="readout-row">
              <span class="rkey">
                Optical power (1/f)
              </span>

              <span class="rval" id="rpower">—</span>
            </div>

            <div class="readout-row">
              <span class="rkey">Lens shape</span>
              <span class="rval" id="rshape">—</span>
            </div>

            <div class="readout-row">
              <span class="rkey">Behavior</span>
              <span class="rval" id="rbehavior">—</span>
            </div>

          </div>


          <!-- LEGEND -->
          <div class="sim-legend">

            <h3>Legend</h3>

            <div class="legend-row">
              <div
                class="legend-dot"
                style="background:#D9B382"
              ></div>

              Lens material (tint ∝ n_L)
            </div>

            <div class="legend-row">
              <div
                class="legend-dot"
                style="background:#5B8DEF"
              ></div>

              Surrounding medium (tint ∝ n_m)
            </div>

            <div class="legend-row">
              <div
                class="legend-line"
                style="border-color:#4ECDC4"
              ></div>

              Parallel incoming rays
            </div>

            <div class="legend-row">
              <div
                class="legend-line"
                style="
                  border-color:#F783AC;
                  border-top-style:dashed
                "
              ></div>

              Virtual backward extension
            </div>

            <div class="legend-row">
              <div
                class="legend-dot"
                style="background:#FFD166"
              ></div>

              Focal points F, F′
            </div>

          </div>

        </div>
      </div>
    `);


    renderMath();


    // ============================================================
    // CANVAS
    // ============================================================

    const canvas = document.getElementById('lm-canvas');
    const ctx = canvas.getContext('2d');

    const dpr = window.devicePixelRatio || 1;


    function resize() {

      const w = canvas.parentElement.clientWidth;

      const h = Math.max(
        360,
        w * 0.85
      );

      canvas.width = w * dpr;
      canvas.height = h * dpr;

      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';

      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }


    resize();

    const _ro =
      new ResizeObserver(resize);

    _ro.observe(canvas.parentElement);


    // ============================================================
    // SLIDERS
    // ============================================================

    function readSliders() {

      state.nL =
        parseFloat(
          document.getElementById('snL').value
        );

      state.nm =
        parseFloat(
          document.getElementById('snm').value
        );

      state.R1 =
        parseFloat(
          document.getElementById('sR1').value
        );

      state.R2 =
        parseFloat(
          document.getElementById('sR2').value
        );


      document.getElementById('lnL').textContent =
        state.nL.toFixed(3);

      document.getElementById('lnm').textContent =
        state.nm.toFixed(3);

      document.getElementById('lR1').textContent =
        state.R1.toFixed(1) + ' cm';

      document.getElementById('lR2').textContent =
        state.R2.toFixed(1) + ' cm';
    }


    [
      'snL',
      'snm',
      'sR1',
      'sR2'
    ].forEach(id => {

      document
        .getElementById(id)
        .addEventListener(
          'input',
          readSliders
        );

    });


    // ============================================================
    // PHYSICS
    // ============================================================

    function invR(R) {

      return Math.abs(R) < FLAT_THRESHOLD
        ? 0
        : 1 / R;
    }


    function relativeIndex() {

      return state.nL / state.nm;
    }


    function power() {

      return (
        relativeIndex() - 1
      ) *
      (
        invR(state.R1) -
        invR(state.R2)
      );
    }


    function focalLength() {

      const P = power();

      return Math.abs(P) < 1e-9
        ? Infinity
        : 1 / P;
    }


    function lensShape() {

      const flat1 =
        Math.abs(state.R1) <
        FLAT_THRESHOLD;

      const flat2 =
        Math.abs(state.R2) <
        FLAT_THRESHOLD;


      const s1 =
        Math.sign(state.R1);

      const s2 =
        Math.sign(state.R2);


      if (flat1 && flat2)
        return 'Flat slab (no power)';


      if (flat1)
        return s2 < 0
          ? 'Plano-convex'
          : 'Plano-concave';


      if (flat2)
        return s1 > 0
          ? 'Plano-convex'
          : 'Plano-concave';


      if (s1 > 0 && s2 < 0)
        return 'Biconvex';


      if (s1 < 0 && s2 > 0)
        return 'Biconcave';


      const f =
        focalLength();


      if (s1 === s2)
        return f > 0
          ? 'Converging meniscus'
          : 'Diverging meniscus';


      return 'Custom';
    }


    // ============================================================
    // LAYOUT
    // ============================================================

    function W() {

      return canvas.width / dpr;
    }


    function H() {

      return canvas.height / dpr;
    }


    // ============================================================
    // DRAWING HELPERS
    // ============================================================

    function rgba(hex, alpha) {

      const h =
        hex.replace('#', '');

      const n =
        parseInt(h, 16);

      const r =
        (n >> 16) & 255;

      const g =
        (n >> 8) & 255;

      const b =
        n & 255;

      return `
        rgba(
          ${r},
          ${g},
          ${b},
          ${alpha}
        )
      `;
    }


    function drawRay(
      x0,
      y0,
      x1,
      y1,
      color,
      dashed,
      opts = {}
    ) {

      const {
        width = 1.55,
        glow = 0,
        alpha = 1
      } = opts;


      ctx.save();

      ctx.beginPath();

      ctx.moveTo(
        x0,
        y0
      );

      ctx.lineTo(
        x1,
        y1
      );


      ctx.strokeStyle =
        rgba(
          color,
          alpha
        );

      ctx.lineWidth =
        width;

      ctx.lineCap =
        'round';


      if (dashed) {

        ctx.setLineDash([
          6,
          5
        ]);

      }


      if (glow) {

        ctx.shadowColor =
          rgba(
            color,
            Math.min(
              0.8,
              glow
            )
          );

        ctx.shadowBlur = 7;
      }


      ctx.stroke();

      ctx.restore();
    }


    // ============================================================
    // PHOTON
    // ============================================================

    function drawPhoton(
      x,
      y,
      color,
      size = 2.1
    ) {

      ctx.save();

      ctx.beginPath();

      ctx.arc(
        x,
        y,
        size,
        0,
        Math.PI * 2
      );


      ctx.fillStyle =
        rgba(
          color,
          0.95
        );


      ctx.shadowColor =
        rgba(
          color,
          0.9
        );

      ctx.shadowBlur = 9;

      ctx.fill();

      ctx.restore();
    }


    function animatePhoton(
      x0,
      y0,
      x1,
      y1,
      phase,
      color,
      speed = 0.00020
    ) {

      if (
        ![
          x0,
          y0,
          x1,
          y1
        ].every(Number.isFinite)
      ) {

        return;
      }


      const p =
        (
          anim.t *
          speed +
          phase
        ) % 1;


      drawPhoton(

        x0 +
        (x1 - x0) * p,

        y0 +
        (y1 - y0) * p,

        color

      );
    }


    // ============================================================
    // RAY TRACING
    // ============================================================

    function traceRay(
      hitX,
      hitY,
      ix,
      iy,
      forwardSign,
      color,
      phase = 0
    ) {

      const dirX =
        ix - hitX;

      const dirY =
        iy - hitY;


      const real =
        dirX *
        forwardSign >
        0;


      if (real) {

        // Real outgoing ray

        drawRay(
          hitX,
          hitY,
          ix,
          iy,
          color,
          false,
          {
            glow: 0.28
          }
        );


        drawRay(
          ix,
          iy,
          ix +
            dirX * 0.4,
          iy +
            dirY * 0.4,
          color,
          false,
          {
            glow: 0.24,
            alpha: 0.92
          }
        );


        animatePhoton(
          hitX,
          hitY,
          ix,
          iy,
          phase,
          color
        );


        animatePhoton(
          ix,
          iy,
          ix +
            dirX * 0.4,
          iy +
            dirY * 0.4,
          phase,
          color
        );

      } else {

        // Diverging ray

        drawRay(
          hitX,
          hitY,
          hitX -
            dirX * 3,
          hitY -
            dirY * 3,
          color,
          false,
          {
            glow: 0.28
          }
        );


        // Virtual extension

        drawRay(
          hitX,
          hitY,
          ix,
          iy,
          '#F783AC',
          true,
          {
            alpha: 0.48
          }
        );


        animatePhoton(
          hitX,
          hitY,
          hitX -
            dirX * 3,
          hitY -
            dirY * 3,
          phase,
          color
        );
      }
    }


    // ============================================================
    // MAIN RENDER
    // ============================================================

    function render() {

      anim.t =
        performance.now();


      const w = W();
      const h = H();


      ctx.clearRect(
        0,
        0,
        w,
        h
      );


      const cx =
        w * 0.5;

      const axisY =
        h * 0.42;


      const f =
        focalLength();


      const qFiniteF =
        isFinite(f);


      const extentX =
        Math.max(
          Math.abs(
            qFiniteF
              ? f
              : 0
          ),
          R_LIMIT * 0.62,
          20
        );


      const pxX =
        (w * 0.40) /
        extentX;


      const halfH =
        Math.min(
          h * 0.24,
          90
        );


      ctx.save();


      ctx.translate(
        cx,
        axisY
      );


      // ========================================================
      // BACKGROUND
      // ========================================================

      const bg =
        ctx.createLinearGradient(
          -w / 2,
          -h / 2,
          w / 2,
          h / 2
        );


      bg.addColorStop(
        0,
        'rgba(13,21,33,0.98)'
      );

      bg.addColorStop(
        0.5,
        'rgba(25,38,55,0.98)'
      );

      bg.addColorStop(
        1,
        'rgba(10,18,29,0.98)'
      );


      ctx.fillStyle = bg;

      ctx.fillRect(
        -w / 2,
        -h / 2,
        w,
        h
      );


      // ========================================================
      // SURROUNDING MEDIUM
      // ========================================================

      const mediumStrength =
        Math.max(
          0,
          Math.min(
            1,
            state.nm - 1
          )
        );


      const mediumGlow =
        ctx.createRadialGradient(
          0,
          0,
          0,
          0,
          0,
          Math.max(w, h) * 0.78
        );


      mediumGlow.addColorStop(
        0,
        `rgba(
          91,
          141,
          239,
          ${0.07 + 0.13 * mediumStrength}
        )`
      );


      mediumGlow.addColorStop(
        1,
        'rgba(91,141,239,0)'
      );


      ctx.fillStyle =
        mediumGlow;


      ctx.fillRect(
        -w / 2,
        -h / 2,
        w,
        h
      );


      // ========================================================
      // MEDIUM PARTICLES
      // ========================================================

      ctx.save();


      const particles =
        Math.round(
          Math.max(
            18,
            Math.min(
              36,
              w / 20
            )
          )
        );


      for (
        let i = 0;
        i < particles;
        i++
      ) {

        const px =
          ((i * 83.17) % w)
          - w / 2;


        const py =
          ((i * 47.91) % h)
          - h / 2;


        const drift =
          Math.sin(
            anim.t * 0.00022 +
            i * 1.71
          ) * 2.2;


        const alpha =
          0.035 +
          0.025 *
          (
            0.5 +
            0.5 *
            Math.sin(i * 1.9)
          );


        ctx.beginPath();


        ctx.arc(
          px + drift,
          py,
          0.7,
          0,
          Math.PI * 2
        );


        ctx.fillStyle =
          `rgba(
            175,
            206,
            240,
            ${alpha}
          )`;


        ctx.fill();
      }


      ctx.restore();


      // ========================================================
      // GRID
      // ========================================================

      ctx.save();


      ctx.strokeStyle =
        'rgba(190,210,230,0.055)';

      ctx.lineWidth = 1;


      for (
        let x = -w / 2;
        x <= w / 2;
        x += 24
      ) {

        ctx.beginPath();

        ctx.moveTo(
          x,
          -halfH * 1.30
        );

        ctx.lineTo(
          x,
          halfH * 1.30
        );

        ctx.stroke();
      }


      for (
        let y = -halfH;
        y <= halfH;
        y += 20
      ) {

        ctx.beginPath();

        ctx.moveTo(
          -w / 2,
          y
        );

        ctx.lineTo(
          w / 2,
          y
        );

        ctx.stroke();
      }


      ctx.restore();


      // ========================================================
      // OPTICAL AXIS
      // ========================================================

      ctx.save();


      ctx.beginPath();

      ctx.moveTo(
        -w / 2,
        0
      );

      ctx.lineTo(
        w / 2,
        0
      );


      ctx.strokeStyle =
        'rgba(205,222,239,0.38)';


      ctx.setLineDash([
        5,
        5
      ]);


      ctx.lineWidth = 1;

      ctx.stroke();

      ctx.setLineDash([]);

      ctx.restore();


      // ========================================================
      // LENS GEOMETRY
      // ========================================================

      const halfThickness =
        Math.max(
          13,
          Math.min(
            17,
            w * 0.026
          )
        );


      const bulgeScale =
        Math.min(
          38,
          halfThickness * 2.5
        );


      const leftX =
        -halfThickness;


      const rightX =
        halfThickness;


      const flat1 =
        Math.abs(state.R1) <
        FLAT_THRESHOLD;


      const flat2 =
        Math.abs(state.R2) <
        FLAT_THRESHOLD;


      const cp1x =
        leftX +
        (
          flat1
            ? 0
            : -Math.sign(state.R1) *
              Math.min(
                bulgeScale * 30 /
                Math.abs(state.R1),
                bulgeScale
              )
        );


      const cp2x =
        rightX +
        (
          flat2
            ? 0
            : -Math.sign(state.R2) *
              Math.min(
                bulgeScale * 30 /
                Math.abs(state.R2),
                bulgeScale
              )
        );


      // ========================================================
      // LENS SHADOW
      // ========================================================

      ctx.save();


      ctx.filter =
        'blur(7px)';


      ctx.beginPath();


      ctx.moveTo(
        leftX,
        -halfH
      );


      ctx.quadraticCurveTo(
        cp1x,
        0,
        leftX,
        halfH
      );


      ctx.lineTo(
        rightX,
        halfH
      );


      ctx.quadraticCurveTo(
        cp2x,
        0,
        rightX,
        -halfH
      );


      ctx.closePath();


      ctx.fillStyle =
        'rgba(0,0,0,0.30)';


      ctx.fill();


      ctx.restore();


      // ========================================================
      // GLASS
      // ========================================================

      ctx.save();


      ctx.beginPath();


      ctx.moveTo(
        leftX,
        -halfH
      );


      ctx.quadraticCurveTo(
        cp1x,
        0,
        leftX,
        halfH
      );


      ctx.lineTo(
        rightX,
        halfH
      );


      ctx.quadraticCurveTo(
        cp2x,
        0,
        rightX,
        -halfH
      );


      ctx.closePath();


      const lensAlpha =
        0.18 +
        0.12 *
        Math.max(
          0,
          state.nL - 1
        );


      const glass =
        ctx.createLinearGradient(
          leftX,
          0,
          rightX,
          0
        );


      glass.addColorStop(
        0.00,
        `rgba(
          250,
          215,
          169,
          ${lensAlpha * 0.65}
        )`
      );


      glass.addColorStop(
        0.22,
        `rgba(
          218,
          174,
          117,
          ${lensAlpha}
        )`
      );


      glass.addColorStop(
        0.50,
        `rgba(
          255,
          243,
          213,
          ${Math.min(
            0.38,
            lensAlpha + 0.09
          )}
        )`
      );


      glass.addColorStop(
        0.78,
        `rgba(
          211,
          165,
          108,
          ${lensAlpha}
        )`
      );


      glass.addColorStop(
        1.00,
        `rgba(
          247,
          210,
          163,
          ${lensAlpha * 0.60}
        )`
      );


      ctx.fillStyle =
        glass;


      ctx.fill();


      // ========================================================
      // INTERNAL GLASS LIGHT
      // ========================================================

      const internalGlow =
        ctx.createRadialGradient(
          -4,
          -12,
          2,
          0,
          0,
          halfH * 1.2
        );
