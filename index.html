<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics Equations — Dictionary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&family=DM+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="icon" type="image/jpg" href="favicon.jpg">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="script.js" defer></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #C0392B;
    --gold: #D4A017;
    --cream: #FAF6EF;
    --ink: #1A1209;
    --ink2: #4A3F2F;
    --ink3: #8A7A65;
    --border: rgba(60,40,10,0.12);
    --border-strong: rgba(60,40,10,0.25);
    --surface: #FFFFFF;
    --surface2: #F5EFE4;
    --tag-bg: #FFF3D6;
    --tag-text: #7A4F00;
    --pill-active: #C0392B;
    --pill-text: #fff;
    --pill-inactive: transparent;
    --pill-inactive-text: #4A3F2F;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ─── Header ─── */
  header {
    border-bottom: 1px solid var(--border-strong);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    background: var(--cream);
    position: sticky;
    top: 0;
    z-index: 100;
    flex-wrap: wrap;
    gap: 8px;
  }
  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 1.35rem;
    color: var(--red);
    letter-spacing: -0.02em;
  }
  .logo span {
    color: var(--ink3);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    font-weight: 400;
    margin-left: 0.5rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  nav {
    display: flex;
    gap: 2px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 3px;
  }
  nav button {
    background: none;
    border: none;
    padding: 6px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--pill-inactive-text);
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  nav button.active {
    background: var(--pill-active);
    color: var(--pill-text);
  }
  nav button:hover:not(.active) {
    background: rgba(60,40,10,0.07);
  }

  /* ─── Main layout ─── */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  .section { display: none; }
  .section.active { display: block; }

  /* ─── Section headings ─── */
  .section-title {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    color: var(--ink);
    margin-bottom: 0.35rem;
    letter-spacing: -0.02em;
  }
  .section-sub {
    font-size: 0.9rem;
    color: var(--ink3);
    margin-bottom: 2rem;
    line-height: 1.6;
  }

  /* ─── Dictionary ─── */
  .search-row {
    display: flex;
    gap: 10px;
    margin-bottom: 1.25rem;
    align-items: center;
  }
  .search-row input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.92rem;
    background: var(--surface);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
  }
  .search-row input:focus { border-color: var(--red); }
  .search-row select {
    padding: 10px 12px;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    background: var(--surface);
    color: var(--ink2);
    outline: none;
    cursor: pointer;
  }

  .dict-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 12px;
  }
  .dict-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
    position: relative;
  }
  .dict-card:hover { border-color: var(--red); box-shadow: 0 2px 12px rgba(192,57,43,0.08); }
  .dict-word {
    font-family: 'DM Serif Display', serif;
    font-size: 1.18rem;
    color: var(--red);
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }
  .dict-eq {
    font-size: 1.05rem;
    color: var(--ink);
    margin: 4px 0 8px;
    overflow-x: auto;
  }
  .dict-pos {
    font-size: 0.72rem;
    font-family: 'DM Mono', monospace;
    color: var(--ink3);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .dict-def {
    font-size: 0.88rem;
    color: var(--ink2);
    line-height: 1.55;
  }
  .dict-vars {
    margin-top: 10px;
    border-top: 1px solid var(--border);
    padding-top: 8px;
  }
  .dict-vars .vrow {
    display: flex;
    gap: 8px;
    font-size: 0.82rem;
    color: var(--ink2);
    line-height: 1.6;
    align-items: baseline;
  }
  .dict-vars .vsym {
    min-width: 1.4em;
    color: var(--red);
    font-style: normal;
  }
  .dict-tag {
    display: inline-block;
    background: var(--tag-bg);
    color: var(--tag-text);
    font-size: 0.7rem;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 100px;
    margin-top: 8px;
  }
  .no-results {
    grid-column: 1/-1;
    text-align: center;
    color: var(--ink3);
    padding: 3rem;
    font-size: 0.95rem;
  }


  /* ─── Flashcards ─── */
  .flashcard-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }
  .flashcard-wrap {
    width: 100%;
    max-width: 480px;
    perspective: 1000px;
  }
  .flashcard {
    width: 100%;
    height: 240px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.45s cubic-bezier(.4,0,.2,1);
    cursor: pointer;
  }
  .flashcard.flipped { transform: rotateY(180deg); }
  .fc-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
    border: 1px solid var(--border);
  }
  .fc-front {
    background: var(--surface);
  }
  .fc-back {
    background: var(--red);
    transform: rotateY(180deg);
  }
  .fc-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 500;
    color: var(--ink3);
    margin-bottom: 0.75rem;
  }
  .fc-back .fc-label { color: rgba(255,255,255,0.65); }
  .fc-word {
    font-family: 'DM Serif Display', serif;
    font-size: 1.7rem;
    color: var(--red);
    letter-spacing: -0.02em;
  }
  .fc-eq {
    font-size: 1.3rem;
    color: var(--ink);
    margin-top: 0.5rem;
  }
  .fc-back .fc-word { color: #fff; font-size: 1.3rem; }
  .fc-back .fc-eq { color: #fff; }
  .fc-hint {
    margin-top: 0.6rem;
    font-size: 0.82rem;
    color: var(--ink3);
    line-height: 1.5;
    max-width: 380px;
  }
  .fc-back .fc-hint { color: rgba(255,255,255,0.85); }

  .fc-controls {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  .fc-btn {
    padding: 10px 22px;
    border-radius: 100px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    color: var(--ink2);
    cursor: pointer;
    transition: all 0.15s;
  }
  .fc-btn:hover { border-color: var(--red); color: var(--red); }
  .fc-btn.primary { background: var(--red); color: #fff; border-color: var(--red); }
  .fc-btn.primary:hover { background: #a82d22; }
  .fc-counter {
    font-size: 0.82rem;
    color: var(--ink3);
    min-width: 80px;
    text-align: center;
  }
  .fc-filter {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }
  .fc-filter button {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 100px;
    padding: 5px 14px;
    font-size: 0.8rem;
    font-family: 'DM Sans', sans-serif;
    color: var(--ink2);
    cursor: pointer;
    transition: all 0.15s;
  }
  .fc-filter button.active { background: var(--red); color: #fff; border-color: var(--red); }

  .katex { font-size: 1.05em; }
  .dict-eq .katex, .fc-eq .katex { font-size: 1.15em; }

  /* ─── Sim badge on dict cards ─── */
  .dict-card.has-sim { cursor: pointer; }
  .sim-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 10px;
    background: var(--ink);
    color: var(--gold);
    font-size: 0.7rem;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    padding: 4px 10px 4px 8px;
    border-radius: 100px;
    letter-spacing: 0.04em;
    border: 1px solid rgba(212,160,23,0.3);
    transition: background 0.15s, color 0.15s;
  }
  .dict-card.has-sim:hover .sim-badge { background: var(--red); color: #fff; border-color: transparent; }
  .sim-badge svg { width: 9px; height: 9px; flex-shrink: 0; }

  /* ─── Simulation section ─── */
  .sim-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1px solid var(--border-strong);
    border-radius: 100px;
    padding: 6px 14px 6px 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.84rem;
    color: var(--ink2);
    cursor: pointer;
    margin-bottom: 1.5rem;
    transition: border-color 0.15s, color 0.15s;
  }
  .sim-back:hover { border-color: var(--red); color: var(--red); }
  .sim-back svg { width: 14px; height: 14px; }

  .sim-layout {
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 720px) { .sim-layout { grid-template-columns: 1fr; } }

  .sim-canvas-wrap {
    background: #0D0F14;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.06);
    aspect-ratio: 1;
  }
  .sim-canvas-wrap canvas { display: block; width: 100%; height: 100%; }

  .sim-panel { display: flex; flex-direction: column; gap: 14px; }

  .sim-equation {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem;
  }
  .sim-equation .eq-label {
    font-size: 0.7rem;
    font-family: 'DM Mono', monospace;
    color: var(--ink3);
    letter-spacing: 0.07em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .sim-equation .eq-display { font-size: 1.05rem; color: var(--ink); overflow-x: auto; }

  .sim-controls {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .sim-controls h3 {
    font-family: 'DM Serif Display', serif;
    font-size: 1rem;
    color: var(--ink);
  }
  .sim-slider-group { display: flex; flex-direction: column; gap: 3px; }
  .sim-slider-group .sl-header { display: flex; justify-content: space-between; align-items: baseline; }
  .sim-slider-group .sl-name { font-size: 0.8rem; color: var(--ink2); }
  .sim-slider-group .sl-sym { color: var(--red); }
  .sim-slider-group .sl-val { font-family: 'DM Mono', monospace; font-size: 0.8rem; color: var(--ink); font-weight: 500; }
  .sim-slider-group input[type=range] { width: 100%; accent-color: var(--red); margin-top: 4px; }

  .sim-readout {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .sim-readout h3 {
    font-family: 'DM Serif Display', serif;
    font-size: 1rem;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .readout-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .readout-row:last-child { border-bottom: none; }
  .readout-row .rkey { font-size: 0.78rem; color: var(--ink3); }
  .readout-row .rval { font-family: 'DM Mono', monospace; font-size: 0.82rem; color: var(--ink); font-weight: 500; }
  .readout-row .rval.hi { color: var(--red); }

  .sim-legend {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.85rem 1.1rem;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .sim-legend h3 { font-family: 'DM Serif Display', serif; font-size: 0.95rem; color: var(--ink); margin-bottom: 2px; }
  .legend-row { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--ink2); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-line { width: 18px; height: 0; border-top: 2px solid; flex-shrink: 0; }

  @media (max-width: 600px) {
    header { padding: 0 1rem; }
    nav button { padding: 6px 10px; font-size: 0.75rem; }
    .dict-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Tayonica <span>A dictionary of Physics Equations and Simulations</span></div>
  <nav>
    <button class="active" onclick="showSection('dictionary', this)">Equations</button>
    <button onclick="showSection('flashcards', this)">Flashcards</button>
  </nav>
</header>

<main>

<!-- ═══════════════════════════════════ DICTIONARY ═══ -->
<section class="section active" id="dictionary">
  <h1 class="section-title">Equations And Simulations</h1>
  <p class="section-sub">Here is provided a dictionary of physics equations and simulations for various topics.</p>
  <div class="search-row">
    <input id="dict-search" type="text" placeholder="Search by name, symbol, or topic…" oninput="filterDict()">
    <select id="dict-pos" onchange="filterDict()">
      <option value="">All topics</option>
      <option value="kinematics">Kinematics</option>
      <option value="dynamics">Dynamics & forces</option>
      <option value="work-energy">Work & energy</option>
      <option value="momentum">Momentum & impulse</option>
      <option value="rotation">Rotation</option>
      <option value="gravitation">Gravitation</option>
      <option value="oscillation">Oscillation & waves</option>
      <option value="optics">Optics</option>
      <option value="thermo">Thermodynamics</option>
      <option value="em">Electromagnetism</option>
      <option value="Special Relativity">Special Relativity</option>
      <option value="Advanced Mechanics">Advanced Mechanics</option>
      <option value="Cosmology & Astrophysics">Cosmology & Astrophysics</option>
      <option value="Quantum Mechanics">Quantum Mechanics</option>
    </select>
  </div>
  <div class="dict-grid" id="dict-grid"></div>
</section>

<!-- ═══════════════════════════════════ SIMULATION ═══ -->
<section class="section" id="simulation">
  <button class="sim-back" onclick="closeSimulation()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15,18 9,12 15,6"/></svg>
    Back to Dictionary
  </button>
  <div id="sim-host"></div>
</section>


<!-- ═══════════════════════════════════ FLASHCARDS ═══ -->
<section class="section" id="flashcards">
  <h1 class="section-title">Flashcards</h1>
  <p class="section-sub">Equation on the front, name and variables on the back. Click the card to flip it.</p>

  <div class="flashcard-area">
    <div class="fc-filter" id="fc-filter">
      <button class="active" onclick="setFcFilter('', this)">All</button>
      <button onclick="setFcFilter('kinematics', this)">Kinematics</button>
      <button onclick="setFcFilter('dynamics', this)">Dynamics</button>
      <button onclick="setFcFilter('work-energy', this)">Work & energy</button>
      <button onclick="setFcFilter('momentum', this)">Momentum</button>
      <button onclick="setFcFilter('rotation', this)">Rotation</button>
      <button onclick="setFcFilter('gravitation', this)">Gravitation</button>
      <button onclick="setFcFilter('oscillation', this)">Oscillation</button>
      <button onclick="setFcFilter('thermo', this)">Thermo</button>
      <button onclick="setFcFilter('em', this)">EM</button>
    </div>

    <div class="flashcard-wrap">
      <div class="flashcard" id="flashcard" onclick="flipCard()">
        <div class="fc-face fc-front">
          <div class="fc-label">Equation</div>
          <div class="fc-eq" id="fc-eq"></div>
        </div>
        <div class="fc-face fc-back">
          <div class="fc-label">Name & variables</div>
          <div class="fc-word" id="fc-word"></div>
          <div class="fc-hint" id="fc-hint"></div>
        </div>
      </div>
    </div>

    <div class="fc-controls">
      <button class="fc-btn" onclick="prevCard()">← Prev</button>
      <button class="fc-btn primary" onclick="flipCard()">Flip</button>
      <button class="fc-btn" onclick="nextCard()">Next →</button>
      <span class="fc-counter" id="fc-counter"></span>
      <button class="fc-btn" onclick="shuffleCards()">Shuffle</button>
    </div>
  </div>
</section>

</main>

<script>
const POS_LABELS = {
  kinematics: 'Kinematics',
  dynamics: 'Dynamics & forces',
  'work-energy': 'Work & energy',
  momentum: 'Momentum & impulse',
  rotation: 'Rotation',
  gravitation: 'Gravitation',
  oscillation: 'Oscillation & waves',
  thermo: 'Thermodynamics',
  em: 'Electromagnetism',
};

// ─── DATA ────────────────────────────────────────────────────────────────────
// w: name, eq: LaTeX (no $$), pos: topic, def: short description,
// vars: [{sym, name}], tag: optional label
const DICT = [
  // ── Kinematics ──
  { id:'kin-v', w:'Velocity (constant accel.)', eq:'v = v_0 + at', pos:'kinematics',
    def:'Velocity after time t under constant acceleration.',
    vars:[ {sym:'v', name:'final velocity'}, {sym:'v_0', name:'initial velocity'}, {sym:'a', name:'acceleration (constant)'}, {sym:'t', name:'elapsed time'} ],
    tag:'1D kinematics' },
  { id:'kin-x', w:'Position (constant accel.)', eq:'x = x_0 + v_0 t + \\tfrac{1}{2}at^2', pos:'kinematics',
    def:'Position after time t under constant acceleration.',
    vars:[ {sym:'x', name:'final position'}, {sym:'x_0', name:'initial position'}, {sym:'v_0', name:'initial velocity'}, {sym:'a', name:'acceleration'}, {sym:'t', name:'elapsed time'} ],
    tag:'1D kinematics' },
  { id:'kin-v2', w:'Time-independent kinematic eq.', eq:'v^2 = v_0^2 + 2a(x-x_0)', pos:'kinematics',
    def:'Relates velocity and displacement directly, with time eliminated.',
    vars:[ {sym:'v', name:'final velocity'}, {sym:'v_0', name:'initial velocity'}, {sym:'a', name:'acceleration'}, {sym:'x-x_0', name:'displacement'} ] },
  { id:'kin-avgv', w:'Average velocity', eq:'\\bar{v} = \\dfrac{x_2-x_1}{t_2-t_1}', pos:'kinematics',
    def:'Net displacement divided by elapsed time.',
    vars:[ {sym:'\\bar v', name:'average velocity'}, {sym:'x_2-x_1', name:'displacement'}, {sym:'t_2-t_1', name:'time interval'} ] },
  { id:'kin-centrip', w:'Centripetal acceleration', eq:'a_c = \\dfrac{v^2}{r} = \\omega^2 r', pos:'kinematics',
    def:'Acceleration directed toward the center of a circular path.',
    vars:[ {sym:'a_c', name:'centripetal acceleration'}, {sym:'v', name:'tangential speed'}, {sym:'r', name:'radius of the circular path'}, {sym:'\\omega', name:'angular velocity'} ] },

//SIMULATIONS REGISTRY
const SIMS = {};
let _simRaf = null;

function _stopSim() {
  if (_simRaf) { cancelAnimationFrame(_simRaf); _simRaf = null; }
  document.getElementById('sim-host').innerHTML = '';
}

function openSimulation(id) {
  const sim = SIMS[id];
  if (!sim) return;
  _stopSim();
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('header nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('simulation').classList.add('active');
  window.scrollTo(0, 0);
  const host = document.getElementById('sim-host');
  host.innerHTML = `<h1 class="section-title" style="margin-bottom:.25rem">${sim.title}</h1>
    <p class="section-sub" style="margin-bottom:1.5rem">${sim.subtitle}</p>`;
  sim.build(host);
}

function closeSimulation() {
  _stopSim();
  showSection('dictionary', document.querySelector('header nav button'));
}

//DICTIONARY RENDER
function renderDict(data) {
  const grid = document.getElementById('dict-grid');
  if (!data.length) { grid.innerHTML = '<div class="no-results">No equations found. Try a different search.</div>'; return; }
  grid.innerHTML = data.map(d => {
    const hasSim = !!SIMS[d.id];
    return `
    <div class="dict-card${hasSim ? ' has-sim' : ''}"${hasSim ? ` onclick="openSimulation('${d.id}')"` : ''}>
      <div class="dict-word">${d.w}</div>
      <div class="dict-pos">${POS_LABELS[d.pos] || d.pos}</div>
      <div class="dict-eq">$$${d.eq}$$</div>
      <div class="dict-def">${d.def}</div>
      <div class="dict-vars">
        ${d.vars.map(v => `<div class="vrow"><span class="vsym">$${v.sym}$</span><span>— ${v.name}</span></div>`).join('')}
      </div>
      ${d.tag ? `<span class="dict-tag">${d.tag}</span>` : ''}
      ${hasSim ? `<span class="sim-badge">
        <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        Open simulation
      </span>` : ''}
    </div>`;
  }).join('');
  renderMath();
}

function filterDict() {
  const q = document.getElementById('dict-search').value.toLowerCase();
  const pos = document.getElementById('dict-pos').value;
  const filtered = DICT.filter(d => {
    const matchQ = !q || d.w.toLowerCase().includes(q) || d.def.toLowerCase().includes(q)
      || (POS_LABELS[d.pos]||'').toLowerCase().includes(q)
      || d.vars.some(v => v.name.toLowerCase().includes(q));
    const matchPos = !pos || d.pos === pos;
    return matchQ && matchPos;
  });
  renderDict(filtered);
}


// ─── FLASHCARDS ──────────────────────────────────────────────────────────────
let fcDeck = [], fcIdx = 0, fcFlipped = false;

function setFcFilter(pos, btn) {
  document.querySelectorAll('.fc-filter button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  fcDeck = pos ? DICT.filter(d => d.pos === pos) : [...DICT];
  fcIdx = 0; fcFlipped = false;
  document.getElementById('flashcard').classList.remove('flipped');
  renderCard();
}

function renderCard() {
  if (!fcDeck.length) return;
  const d = fcDeck[fcIdx];
  document.getElementById('fc-eq').innerHTML = `$$${d.eq}$$`;
  document.getElementById('fc-word').textContent = d.w;
  document.getElementById('fc-hint').innerHTML = d.vars.map(v => `$${v.sym}$ — ${v.name}`).join('<br>');
  document.getElementById('fc-counter').textContent = `${fcIdx + 1} / ${fcDeck.length}`;
  document.getElementById('flashcard').classList.remove('flipped');
  fcFlipped = false;
  renderMath();
}

function flipCard() {
  fcFlipped = !fcFlipped;
  document.getElementById('flashcard').classList.toggle('flipped', fcFlipped);
}

function nextCard() { fcIdx = (fcIdx + 1) % fcDeck.length; renderCard(); }
function prevCard() { fcIdx = (fcIdx - 1 + fcDeck.length) % fcDeck.length; renderCard(); }
function shuffleCards() {
  for (let i = fcDeck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [fcDeck[i], fcDeck[j]] = [fcDeck[j], fcDeck[i]];
  }
  fcIdx = 0; renderCard();
}

// ─── SECTION NAV ─────────────────────────────────────────────────────────────
function showSection(id, btn) {
  _stopSim();
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('header nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (btn) btn.classList.add('active');
  renderMath();
}

      state.M = parseFloat(document.getElementById('sM').value);
      state.a = parseFloat(document.getElementById('sa').value);
      state.e = parseFloat(document.getElementById('se').value);
      document.getElementById('lM').textContent = state.M.toFixed(2) + ' M☉';
      document.getElementById('la').textContent = state.a.toFixed(2) + ' AU';
      document.getElementById('le').textContent = state.e.toFixed(2);
      state.trail = [];
    }
    ['sM','sa','se'].forEach(id => document.getElementById(id).addEventListener('input', readSliders));

    // ── Orbital math ──
    function solveE(M, e) {       // Newton–Raphson for eccentric anomaly
      let E = M;
      for (let i = 0; i < 12; i++) E -= (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
      return E;
    }
    function trueAnomaly(E, e) {
      return 2 * Math.atan2(Math.sqrt(1 + e) * Math.sin(E / 2), Math.sqrt(1 - e) * Math.cos(E / 2));
    }

    function sz() { return canvas.width / dpr; }
    function auPx(au) { return au * (sz() * 0.5 / 3.9); }   // scale: 3.9 AU fits canvas half-width

    function planetPos(M_anom) {
      const E  = solveE(M_anom, state.e);
      const nu = trueAnomaly(E, state.e);
      const b  = state.a * Math.sqrt(1 - state.e * state.e);
      const c  = state.a * state.e;                          // focus offset from ellipse centre
      const x  = auPx(state.a * Math.cos(nu) - c);          // in canvas frame, focus at origin
      const y  = auPx(b * Math.sin(nu));
      const r  = state.a * (1 - state.e * state.e) / (1 + state.e * Math.cos(nu));
      return { x: sz()/2 + x, y: sz()/2 - y, nu, r };
    }

    function orbitalSpeed(r) {                               // vis-viva, AU/yr
      const GM = 4 * Math.PI * Math.PI * state.M;
      return Math.sqrt(GM * (2/r - 1/state.a));
    }

    // ── Draw ──
    function draw(pos) {
      const S = sz();
      ctx.clearRect(0, 0, S, S);

      // subtle grid
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      const step = auPx(0.5);
      for (let x = (S/2) % step; x < S; x += step) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,S); ctx.stroke(); }
      for (let y = (S/2) % step; y < S; y += step) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(S,y); ctx.stroke(); }

      // orbit path (ghost ellipse)
      

      // semi-major axis dashed line (periapsis ↔ apoapsis through focus)
      const peri = planetPos(0), apo = planetPos(Math.PI);
      ctx.beginPath();
      ctx.moveTo(peri.x, peri.y);
      ctx.lineTo(apo.x,  apo.y);
      ctx.strokeStyle = 'rgba(138,122,101,0.45)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4,4]);
      ctx.stroke();
      ctx.setLineDash([]);
      // 'a' label at midpoint
      const mx = (peri.x + apo.x)/2, my = (peri.y + apo.y)/2;
      ctx.fillStyle = 'rgba(138,122,101,0.85)';
      ctx.font = `${Math.max(10, S*0.032)}px 'DM Mono', monospace`;
      ctx.textAlign = 'center';
      ctx.fillText('a', mx, my - 7);

      // trail
      if (state.trail.length > 1) {
        ctx.beginPath();
        ctx.moveTo(state.trail[0].x, state.trail[0].y);
        for (let i = 1; i < state.trail.length; i++) ctx.lineTo(state.trail[i].x, state.trail[i].y);
        ctx.strokeStyle = 'rgba(78,205,196,0.45)';
        ctx.lineWidth = 1.5;
        ctx.lineJoin = 'round';
        ctx.stroke();
      }

      // central body glow + disc
      const starR = Math.max(8, S * 0.028);
      const grd = ctx.createRadialGradient(S/2, S/2, 0, S/2, S/2, starR * 3.5);
      grd.addColorStop(0,   'rgba(255,209,102,0.45)');
      grd.addColorStop(0.4, 'rgba(255,180,60,0.15)');
      grd.addColorStop(1,   'rgba(255,180,60,0)');
      ctx.beginPath(); ctx.arc(S/2, S/2, starR*3.5, 0, 2*Math.PI);
      ctx.fillStyle = grd; ctx.fill();
      ctx.beginPath(); ctx.arc(S/2, S/2, starR, 0, 2*Math.PI);
      ctx.fillStyle = '#FFD166'; ctx.fill();
      ctx.fillStyle = '#1A1209';
      ctx.font = `bold ${Math.max(8, starR*0.72)}px 'DM Mono', monospace`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('M', S/2, S/2);
      ctx.textBaseline = 'alphabetic';

      // planet glow + disc
      const planetR = Math.max(5, S * 0.018);
      const pg = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, planetR*3);
      pg.addColorStop(0, 'rgba(91,141,239,0.55)');
      pg.addColorStop(1, 'rgba(91,141,239,0)');
      ctx.beginPath(); ctx.arc(pos.x, pos.y, planetR*3, 0, 2*Math.PI);
      ctx.fillStyle = pg; ctx.fill();
      ctx.beginPath(); ctx.arc(pos.x, pos.y, planetR, 0, 2*Math.PI);
      ctx.fillStyle = '#5B8DEF'; ctx.fill();

      // velocity arrow
      const spd    = orbitalSpeed(pos.r);
      const spdMax = orbitalSpeed(state.a * (1 - state.e));   // max speed at periapsis
      const arLen  = Math.max(14, S * 0.11) * Math.min(spd / spdMax, 1.5);
      const vAng   = pos.nu + Math.PI/2;
      const tx     = pos.x + Math.cos(vAng) * arLen;
      const ty     = pos.y - Math.sin(vAng) * arLen;
      const ang    = Math.atan2(ty - pos.y, tx - pos.x);
      const hl     = 7;
      ctx.beginPath(); ctx.moveTo(pos.x, pos.y); ctx.lineTo(tx, ty);
      ctx.strokeStyle = 'rgba(247,131,172,0.9)'; ctx.lineWidth = 1.8; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(tx - hl*Math.cos(ang-0.42), ty - hl*Math.sin(ang-0.42));
      ctx.lineTo(tx - hl*Math.cos(ang+0.42), ty - hl*Math.sin(ang+0.42));
      ctx.closePath(); ctx.fillStyle = 'rgba(247,131,172,0.9)'; ctx.fill();

      // period label top-left
      const T = Math.sqrt(Math.pow(state.a, 3) / state.M);
      ctx.fillStyle = 'rgba(255,209,102,0.9)';
      ctx.font = `${Math.max(10, S*0.032)}px 'DM Mono', monospace`;
      ctx.textAlign = 'left';
      ctx.fillText(`T = ${T.toFixed(3)} yr`, S*0.04, S*0.07);

      // speed label near arrow tip
      ctx.fillStyle = 'rgba(247,131,172,0.85)';
      ctx.textAlign = 'center';
      ctx.fillText(`v = ${spd.toFixed(2)} AU/yr`, tx + Math.cos(vAng)*18, ty - Math.sin(vAng)*18);
    }

    function updateReadout(pos) {
      const T = Math.sqrt(Math.pow(state.a, 3) / state.M);
      const b = state.a * Math.sqrt(1 - state.e*state.e);
      document.getElementById('rT').textContent = T.toFixed(4) + ' yr';
      document.getElementById('ra').textContent = state.a.toFixed(3) + ' AU';
      document.getElementById('rb').textContent = b.toFixed(3) + ' AU';
      document.getElementById('rq').textContent = (state.a*(1-state.e)).toFixed(3) + ' AU';
      document.getElementById('rQ').textContent = (state.a*(1+state.e)).toFixed(3) + ' AU';
      document.getElementById('rv').textContent = orbitalSpeed(pos.r).toFixed(2) + ' AU/yr';
    }

    // ── Animation loop ──
    let last = null;
    function frame(ts) {
      _simRaf = requestAnimationFrame(frame);
      const dt = last ? Math.min((ts - last) / 1000, 0.05) : 0;
      last = ts;

      const T = Math.sqrt(Math.pow(state.a, 3) / state.M);
      const n = (2 * Math.PI / T) * 1.4;   // mean motion × speed factor (1.4 yr/s)
      state.meanAnomaly = (state.meanAnomaly + n * dt) % (2 * Math.PI);

      const pos = planetPos(state.meanAnomaly);
      state.trail.push({ x: pos.x, y: pos.y });
      if (state.trail.length > 230) state.trail.shift();

      draw(pos);
      updateReadout(pos);
    }
    _simRaf = requestAnimationFrame(frame);
  }
};


SIMS['kin-x'] = {
  title: "Vertical Launch — Distance vs. Time",
  subtitle: "Adjust launch speed v₀, initial height x₀, and gravity g — watch the parabola reshape and the marker trace x(t) in real time.",

  build(host) {
    const state = { v0: 20, x0: 0, g: 9.8, t: 0, tMax: 1, xMax: 1, trail: [] };

    host.insertAdjacentHTML('beforeend', `
      <div class="sim-layout">
        <div class="sim-canvas-wrap"><canvas id="kinxt-canvas"></canvas></div>
        <div class="sim-panel">

          <div class="sim-equation">
            <div class="eq-label">Equation</div>
            <div class="eq-display">$$x(t) = x_0 + v_0 t - \\dfrac{1}{2}g t^2$$</div>
          </div>

          <div class="sim-controls">
            <h3>Variables</h3>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">v₀</span> — launch speed</span>
                <span class="sl-val" id="lv0">20.0 m/s</span>
              </div>
              <input type="range" id="sv0" min="0" max="40" step="0.5" value="20">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">x₀</span> — initial height</span>
                <span class="sl-val" id="lx0">0.0 m</span>
              </div>
              <input type="range" id="sx0" min="0" max="50" step="0.5" value="0">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">g</span> — gravity</span>
                <span class="sl-val" id="lg">9.80 m/s²</span>
              </div>
              <input type="range" id="sg" min="1" max="20" step="0.1" value="9.8">
            </div>
          </div>

          <div class="sim-readout">
            <h3>Live Readout</h3>
            <div class="readout-row"><span class="rkey">Time of flight</span><span class="rval hi" id="rT">—</span></div>
            <div class="readout-row"><span class="rkey">Time to apex</span><span class="rval" id="rTa">—</span></div>
            <div class="readout-row"><span class="rkey">Max height</span><span class="rval" id="rXmax">—</span></div>
            <div class="readout-row"><span class="rkey">Current time t</span><span class="rval" id="rt">—</span></div>
            <div class="readout-row"><span class="rkey">Current height x(t)</span><span class="rval" id="rx">—</span></div>
            <div class="readout-row"><span class="rkey">Current velocity</span><span class="rval" id="rv">—</span></div>
            <div class="readout-row"><span class="rkey">Impact velocity</span><span class="rval" id="rvi">—</span></div>
          </div>

          <div class="sim-legend">
            <h3>Legend</h3>
            <div class="legend-row"><div class="legend-line" style="border-color:#4ECDC4;opacity:.7"></div>x(t) trajectory</div>
            <div class="legend-row"><div class="legend-dot" style="background:#5B8DEF"></div>Current position</div>
            <div class="legend-row"><div class="legend-dot" style="background:#FFD166"></div>Apex (max height)</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#8A7A65;border-top-style:dashed"></div>Ground (x = 0)</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#F783AC;border-top-style:dashed"></div>t / x guides</div>
          </div>
        </div>
      </div>`);

    renderMath();

    // ── Canvas ──
    const canvas = document.getElementById('kinxt-canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    const PAD = { l: 58, r: 24, t: 28, b: 44 };

    function resize() {
      const w = canvas.parentElement.clientWidth;
      const h = Math.max(280, w * 0.6);
      canvas.width  = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
      state.trail = [];
    }
    resize();
    const _ro = new ResizeObserver(resize);
    _ro.observe(canvas.parentElement);

    // ── Sliders ──
    function readSliders() {
      state.v0 = parseFloat(document.getElementById('sv0').value);
      state.x0 = parseFloat(document.getElementById('sx0').value);
      state.g  = parseFloat(document.getElementById('sg').value);
      document.getElementById('lv0').textContent = state.v0.toFixed(1) + ' m/s';
      document.getElementById('lx0').textContent = state.x0.toFixed(1) + ' m';
      document.getElementById('lg').textContent  = state.g.toFixed(2) + ' m/s²';
      state.t = 0;
      state.trail = [];
      recompute();
    }
    ['sv0','sx0','sg'].forEach(id => document.getElementById(id).addEventListener('input', readSliders));

    // ── Kinematics ──
    function heightAt(t) { return state.x0 + state.v0 * t - 0.5 * state.g * t * t; }
    function velAt(t)    { return state.v0 - state.g * t; }

    function flightTime() {
      // solve 0.5 g t^2 - v0 t - x0 = 0 for the positive root (return to x = 0)
      const disc = state.v0 * state.v0 + 2 * state.g * state.x0;
      if (state.g <= 0) return state.x0 > 0 ? 5 : 1; // degenerate fallback
      return (state.v0 + Math.sqrt(Math.max(disc, 0))) / state.g;
    }

    function recompute() {
      state.tMax = Math.max(flightTime(), 0.1);
      const apexT = Math.max(state.v0 / state.g, 0);
      const apexX = heightAt(Math.min(apexT, state.tMax));
      state.xMax = Math.max(apexX, state.x0, heightAt(0)) * 1.15 || 1;
      if (state.xMax <= 0) state.xMax = 1;
    }
    recompute();

    // ── Coordinate mapping ──
    function W() { return canvas.width / dpr; }
    function H() { return canvas.height / dpr; }
    function tPx(t) { return PAD.l + (t / state.tMax) * (W() - PAD.l - PAD.r); }
    function xPx(x) { return H() - PAD.b - (x / state.xMax) * (H() - PAD.t - PAD.b); }

    // ── Draw ──
    function draw() {
      const w = W(), h = H();
      ctx.clearRect(0, 0, w, h);

      // grid
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.lineWidth = 1;
      const gridLinesX = 6, gridLinesY = 5;
      for (let i = 0; i <= gridLinesX; i++) {
        const t = (i / gridLinesX) * state.tMax;
        const px = tPx(t);
        ctx.beginPath(); ctx.moveTo(px, PAD.t); ctx.lineTo(px, h - PAD.b); ctx.stroke();
      }
      for (let i = 0; i <= gridLinesY; i++) {
        const x = (i / gridLinesY) * state.xMax;
        const py = xPx(x);
        ctx.beginPath(); ctx.moveTo(PAD.l, py); ctx.lineTo(w - PAD.r, py); ctx.stroke();
      }

      // axes
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(PAD.l, PAD.t); ctx.lineTo(PAD.l, h - PAD.b); ctx.lineTo(w - PAD.r, h - PAD.b); ctx.stroke();

      // axis tick labels
      ctx.fillStyle = 'rgba(230,224,212,0.7)';
      ctx.font = `${Math.max(9, w * 0.022)}px 'DM Mono', monospace`;
      ctx.textAlign = 'center';
      for (let i = 0; i <= gridLinesX; i++) {
        const t = (i / gridLinesX) * state.tMax;
        ctx.fillText(t.toFixed(2) + 's', tPx(t), h - PAD.b + 16);
      }
      ctx.textAlign = 'right';
      for (let i = 0; i <= gridLinesY; i++) {
        const x = (i / gridLinesY) * state.xMax;
        ctx.fillText(x.toFixed(1) + 'm', PAD.l - 8, xPx(x) + 3);
      }

      // ground line (x = 0)
      ctx.beginPath();
      ctx.moveTo(PAD.l, xPx(0)); ctx.lineTo(w - PAD.r, xPx(0));
      ctx.strokeStyle = 'rgba(138,122,101,0.6)';
      ctx.setLineDash([4,4]); ctx.lineWidth = 1.2;
      ctx.stroke(); ctx.setLineDash([]);

      // trajectory curve
      ctx.beginPath();
      const steps = 160;
      for (let i = 0; i <= steps; i++) {
        const t = (i / steps) * state.tMax;
        const x = heightAt(t);
        const px = tPx(t), py = xPx(Math.max(x, -state.xMax * 0.05));
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.strokeStyle = '#4ECDC4';
      ctx.lineWidth = 2;
      ctx.stroke();

      // apex marker
      const apexT = Math.min(Math.max(state.v0 / state.g, 0), state.tMax);
      const apexX = heightAt(apexT);
      const apexPx = tPx(apexT), apexPy = xPx(apexX);
      ctx.beginPath(); ctx.arc(apexPx, apexPy, 4, 0, 2*Math.PI);
      ctx.fillStyle = '#FFD166'; ctx.fill();

      // current point
      const curX = heightAt(state.t);
      const cpx = tPx(state.t), cpy = xPx(curX);

      // guide lines to axes
      ctx.beginPath();
      ctx.moveTo(cpx, cpy); ctx.lineTo(cpx, h - PAD.b);
      ctx.moveTo(cpx, cpy); ctx.lineTo(PAD.l, cpy);
      ctx.strokeStyle = 'rgba(247,131,172,0.55)';
      ctx.setLineDash([3,3]); ctx.lineWidth = 1;
      ctx.stroke(); ctx.setLineDash([]);

      // current point glow + disc
      const pg = ctx.createRadialGradient(cpx, cpy, 0, cpx, cpy, 14);
      pg.addColorStop(0, 'rgba(91,141,239,0.55)');
      pg.addColorStop(1, 'rgba(91,141,239,0)');
      ctx.beginPath(); ctx.arc(cpx, cpy, 14, 0, 2*Math.PI);
      ctx.fillStyle = pg; ctx.fill();
      ctx.beginPath(); ctx.arc(cpx, cpy, 5, 0, 2*Math.PI);
      ctx.fillStyle = '#5B8DEF'; ctx.fill();

      // labels
      ctx.fillStyle = 'rgba(255,209,102,0.9)';
      ctx.font = `${Math.max(10, w * 0.024)}px 'DM Mono', monospace`;
      ctx.textAlign = 'left';
      ctx.fillText(`T flight = ${state.tMax.toFixed(2)} s`, PAD.l + 6, PAD.t + 14);
    }

    function updateReadout() {
      const apexT = Math.max(state.v0 / state.g, 0);
      const apexX = heightAt(Math.min(apexT, state.tMax));
      const curX = heightAt(state.t);
      const curV = velAt(state.t);
      const impactV = velAt(state.tMax);
      document.getElementById('rT').textContent    = state.tMax.toFixed(3) + ' s';
      document.getElementById('rTa').textContent   = apexT.toFixed(3) + ' s';
      document.getElementById('rXmax').textContent = apexX.toFixed(2) + ' m';
      document.getElementById('rt').textContent    = state.t.toFixed(3) + ' s';
      document.getElementById('rx').textContent    = curX.toFixed(2) + ' m';
      document.getElementById('rv').textContent    = curV.toFixed(2) + ' m/s';
      document.getElementById('rvi').textContent   = (-Math.abs(impactV)).toFixed(2) + ' m/s';
    }

    // ── Animation loop ──
    let last = null;
    function frame(ts) {
      _simRaf = requestAnimationFrame(frame);
      const dt = last ? Math.min((ts - last) / 1000, 0.05) : 0;
      last = ts;

      const playDuration = 1.8; // real seconds for one full flight to play out, regardless of tMax
      state.t += dt * (state.tMax / playDuration);
      if (state.t > state.tMax) state.t = 0;

      draw();
      updateReadout();
    }
    _simRaf = requestAnimationFrame(frame);
  }
};

          </div>

          <div class="sim-legend">
            <h3>Legend</h3>
            <div class="legend-row"><div class="legend-dot" style="background:#FFD166"></div>Mass M</div>
            <div class="legend-row"><div class="legend-dot" style="background:#5B8DEF"></div>Mass m</div>
            <div class="legend-row"><div class="legend-dot" style="background:#828282"></div>Center of mass</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#FFD166;opacity:.4"></div>Trail — M</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#5B8DEF;opacity:.4"></div>Trail — m</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#8A7A65;border-top-style:dashed"></div>Line of centers</div>
          </div>
        </div>
      </div>`);

    renderMath();

    // ── Canvas ──
    const canvas = document.getElementById('bin-canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    function resize() {
      const sz = canvas.parentElement.clientWidth;
      canvas.width  = sz * dpr;
      canvas.height = sz * dpr;
      canvas.style.width  = sz + 'px';
      canvas.style.height = sz + 'px';
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
      state.trail1 = [];
      state.trail2 = [];
    }
    resize();
    const _ro = new ResizeObserver(resize);
    _ro.observe(canvas.parentElement);

    // ── Sliders ──
    function readSliders() {
      state.M = parseFloat(document.getElementById('sM').value);
      state.m = parseFloat(document.getElementById('sm').value);
      state.D = parseFloat(document.getElementById('sD').value);
      state.e = parseFloat(document.getElementById('se').value);
      document.getElementById('lM').textContent = state.M.toFixed(2) + ' M☉';
      document.getElementById('lm').textContent = state.m.toFixed(2) + ' M☉';
      document.getElementById('lD').textContent = state.D.toFixed(2) + ' AU';
      document.getElementById('le').textContent = state.e.toFixed(2);
      state.trail1 = [];
      state.trail2 = [];
    }
    ['sM','sm','sD','se'].forEach(id => document.getElementById(id).addEventListener('input', readSliders));

    // ── Orbital math (relative orbit, then scaled to barycentric frame) ──
    function solveE(Manom, e) {       // Newton–Raphson for eccentric anomaly
      let E = Manom;
      for (let i = 0; i < 12; i++) E -= (E - e * Math.sin(E) - Manom) / (1 - e * Math.cos(E));
      return E;
    }
    function trueAnomaly(E, e) {
      return 2 * Math.atan2(Math.sqrt(1 + e) * Math.sin(E / 2), Math.sqrt(1 - e) * Math.cos(E / 2));
    }

    function sz() { return canvas.width / dpr; }
    function auPx(au) { return au * (sz() * 0.5 / 3.9); }   // scale: 3.9 AU fits canvas half-width

    // relative vector r_vec (from M toward m), with the origin (COM) as its focus once scaled
    function relVec(M_anom) {
      const E  = solveE(M_anom, state.e);
      const nu = trueAnomaly(E, state.e);
      const r  = state.D * (1 - state.e * state.e) / (1 + state.e * Math.cos(nu));
      return { rx: r * Math.cos(nu), ry: r * Math.sin(nu), r, nu };
    }

    function bodyPositions(M_anom) {
      const rel = relVec(M_anom);
      const total = state.M + state.m;
      const f1 = -state.m / total;   // body M sits opposite body m through the COM
      const f2 =  state.M / total;
      const x1 = sz()/2 + auPx(f1 * rel.rx), y1 = sz()/2 - auPx(f1 * rel.ry);
      const x2 = sz()/2 + auPx(f2 * rel.rx), y2 = sz()/2 - auPx(f2 * rel.ry);
      return { x1, y1, x2, y2, r: rel.r, nu: rel.nu, f1, f2 };
    }

    function relSpeed(r) {                               // vis-viva, AU/yr
      const GM = 4 * Math.PI * Math.PI * (state.M + state.m);
      return Math.sqrt(Math.max(GM * (2/r - 1/state.D), 0));
    }

    // ── Draw ──
    function draw(pos) {
      const S = sz();
      ctx.clearRect(0, 0, S, S);

      // subtle grid
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      const step = auPx(0.5);
      for (let x = (S/2) % step; x < S; x += step) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,S); ctx.stroke(); }
      for (let y = (S/2) % step; y < S; y += step) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(S,y); ctx.stroke(); }

      // line of centers (through COM)
      ctx.beginPath();
      ctx.moveTo(pos.x1, pos.y1);
      ctx.lineTo(pos.x2, pos.y2);
      ctx.strokeStyle = 'rgba(138,122,101,0.4)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4,4]);
      ctx.stroke();
      ctx.setLineDash([]);

      // trails
      function drawTrail(trail, color) {
        if (trail.length > 1) {
          ctx.beginPath();
          ctx.moveTo(trail[0].x, trail[0].y);
          for (let i = 1; i < trail.length; i++) ctx.lineTo(trail[i].x, trail[i].y);
          ctx.strokeStyle = color;
          ctx.lineWidth = 1.5;
          ctx.lineJoin = 'round';
          ctx.stroke();
        }
      }
      drawTrail(state.trail1, 'rgba(255,209,102,0.35)');
      drawTrail(state.trail2, 'rgba(91,141,239,0.35)');

      // center of mass marker
      ctx.beginPath();
      ctx.moveTo(S/2 - 7, S/2); ctx.lineTo(S/2 + 7, S/2);
      ctx.moveTo(S/2, S/2 - 7); ctx.lineTo(S/2, S/2 + 7);
      ctx.strokeStyle = 'rgba(230,224,212,0.8)';
      ctx.lineWidth = 1.4;
      ctx.stroke();

      // body radii scaled by mass^(1/3), clamped for visibility
      const r1 = Math.max(7, Math.min(20, S * 0.02 * Math.cbrt(state.M)));
      const r2 = Math.max(7, Math.min(20, S * 0.02 * Math.cbrt(state.m)));

      function drawBody(x, y, radius, color, label) {
        const g = ctx.createRadialGradient(x, y, 0, x, y, radius * 3);
        g.addColorStop(0, color.glow);
        g.addColorStop(1, color.transparent);
        ctx.beginPath(); ctx.arc(x, y, radius * 3, 0, 2*Math.PI);
        ctx.fillStyle = g; ctx.fill();
        ctx.beginPath(); ctx.arc(x, y, radius, 0, 2*Math.PI);
        ctx.fillStyle = color.solid; ctx.fill();
        ctx.fillStyle = '#1A1209';
        ctx.font = `bold ${Math.max(8, radius*0.72)}px 'DM Mono', monospace`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(label, x, y);
        ctx.textBaseline = 'alphabetic';
      }

      drawBody(pos.x1, pos.y1, r1, {
        glow: 'rgba(255,209,102,0.45)', transparent: 'rgba(255,180,60,0)', solid: '#FFD166'
      }, 'M');
      drawBody(pos.x2, pos.y2, r2, {
        glow: 'rgba(91,141,239,0.5)', transparent: 'rgba(91,141,239,0)', solid: '#5B8DEF'
      }, 'm');

      // period label top-left
      const T = Math.sqrt(Math.pow(state.D, 3) / (state.M + state.m));
      ctx.fillStyle = 'rgba(255,209,102,0.9)';
      ctx.font = `${Math.max(10, S*0.032)}px 'DM Mono', monospace`;
      ctx.textAlign = 'left';
      ctx.fillText(`T = ${T.toFixed(3)} yr`, S*0.04, S*0.07);

      // separation label near line midpoint
      ctx.fillStyle = 'rgba(138,122,101,0.9)';
      ctx.textAlign = 'center';
      ctx.fillText(`r = ${pos.r.toFixed(2)} AU`, (pos.x1+pos.x2)/2, (pos.y1+pos.y2)/2 - 10);
    }

    function updateReadout(pos) {
      const T = Math.sqrt(Math.pow(state.D, 3) / (state.M + state.m));
      const a1 = Math.abs(pos.f1) * state.D;
      const a2 = Math.abs(pos.f2) * state.D;
      const vRel = relSpeed(pos.r);
      const v1 = Math.abs(pos.f1) * vRel;
      const v2 = Math.abs(pos.f2) * vRel;
      document.getElementById('rT').textContent  = T.toFixed(4) + ' yr';
      document.getElementById('rD').textContent  = state.D.toFixed(3) + ' AU';
      document.getElementById('ra1').textContent = a1.toFixed(3) + ' AU';
      document.getElementById('ra2').textContent = a2.toFixed(3) + ' AU';
      document.getElementById('rr').textContent  = pos.r.toFixed(3) + ' AU';
      document.getElementById('rv1').textContent = v1.toFixed(2) + ' AU/yr';
      document.getElementById('rv2').textContent = v2.toFixed(2) + ' AU/yr';
    }

    // ── Animation loop ──
    let last = null;
    function frame(ts) {
      _simRaf = requestAnimationFrame(frame);
      const dt = last ? Math.min((ts - last) / 1000, 0.05) : 0;
      last = ts;

      const T = Math.sqrt(Math.pow(state.D, 3) / (state.M + state.m));
      const n = (2 * Math.PI / T) * 1.4;   // mean motion × speed factor (1.4 yr/s)
      state.meanAnomaly = (state.meanAnomaly + n * dt) % (2 * Math.PI);

      const pos = bodyPositions(state.meanAnomaly);
      state.trail1.push({ x: pos.x1, y: pos.y1 });
      state.trail2.push({ x: pos.x2, y: pos.y2 });
      if (state.trail1.length > 230) state.trail1.shift();
      if (state.trail2.length > 230) state.trail2.shift();

      draw(pos);
      updateReadout(pos);
    }
    _simRaf = requestAnimationFrame(frame);
  }
};


SIMS['osc-x'] = {
  title: "Simple Harmonic Motion",
  subtitle: "Adjust amplitude A, angular frequency ω, and phase φ — watch the mass-spring oscillate and trace x(t) in real time.",

  build(host) {
    const state = { A: 1.5, omega: 2.0, phi: 0.0, t: 0, trail: [] };
    const WINDOW = 8; // seconds of history shown in the scrolling x(t) graph

    host.insertAdjacentHTML('beforeend', `
      <div class="sim-layout">
        <div class="sim-canvas-wrap"><canvas id="shm-canvas"></canvas></div>
        <div class="sim-panel">

          <div class="sim-equation">
            <div class="eq-label">Equation</div>
            <div class="eq-display">$$x(t) = A\\cos(\\omega t + \\phi)$$</div>
          </div>

          <div class="sim-controls">
            <h3>Variables</h3>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">A</span> — amplitude</span>
                <span class="sl-val" id="lA">1.50 m</span>
              </div>
              <input type="range" id="sA" min="0.2" max="3" step="0.1" value="1.5">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">ω</span> — angular frequency</span>
                <span class="sl-val" id="lomega">2.00 rad/s</span>
              </div>
              <input type="range" id="somega" min="0.5" max="8" step="0.1" value="2">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">φ</span> — phase</span>
                <span class="sl-val" id="lphi">0.00 rad</span>
              </div>
              <input type="range" id="sphi" min="-3.14" max="3.14" step="0.05" value="0">
            </div>
          </div>

          <div class="sim-readout">
            <h3>Live Readout</h3>
            <div class="readout-row"><span class="rkey">Period T</span><span class="rval hi" id="rT">—</span></div>
            <div class="readout-row"><span class="rkey">Frequency f</span><span class="rval" id="rf">—</span></div>
            <div class="readout-row"><span class="rkey">Current x(t)</span><span class="rval" id="rx">—</span></div>
            <div class="readout-row"><span class="rkey">Current velocity</span><span class="rval" id="rv">—</span></div>
            <div class="readout-row"><span class="rkey">Current acceleration</span><span class="rval" id="ra">—</span></div>
            <div class="readout-row"><span class="rkey">Max speed (Aω)</span><span class="rval" id="rvmax">—</span></div>
            <div class="readout-row"><span class="rkey">Max accel (Aω²)</span><span class="rval" id="ramax">—</span></div>
          </div>

          <div class="sim-legend">
            <h3>Legend</h3>
            <div class="legend-row"><div class="legend-dot" style="background:#5B8DEF"></div>Oscillating mass</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#4ECDC4;opacity:.7"></div>x(t) trace</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#8A7A65;border-top-style:dashed"></div>Equilibrium (x = 0)</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#F783AC"></div>Velocity vector</div>
          </div>
        </div>
      </div>`);

    renderMath();

    // ── Canvas ──
    const canvas = document.getElementById('shm-canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    function resize() {
      const w = canvas.parentElement.clientWidth;
      const h = Math.max(320, w * 0.72);
      canvas.width  = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
      state.trail = [];
    }
    resize();
    const _ro = new ResizeObserver(resize);
    _ro.observe(canvas.parentElement);

    // ── Sliders ──
    function readSliders() {
      state.A     = parseFloat(document.getElementById('sA').value);
      state.omega = parseFloat(document.getElementById('somega').value);
      state.phi   = parseFloat(document.getElementById('sphi').value);
      document.getElementById('lA').textContent      = state.A.toFixed(2) + ' m';
      document.getElementById('lomega').textContent  = state.omega.toFixed(2) + ' rad/s';
      document.getElementById('lphi').textContent    = state.phi.toFixed(2) + ' rad';
    }
    ['sA','somega','sphi'].forEach(id => document.getElementById(id).addEventListener('input', readSliders));

    // ── Kinematics ──
    function xAt(t) { return state.A * Math.cos(state.omega * t + state.phi); }
    function vAt(t) { return -state.A * state.omega * Math.sin(state.omega * t + state.phi); }
    function aAt(t) { return -state.omega * state.omega * xAt(t); }

    // ── Layout ──
    function W() { return canvas.width / dpr; }
    function H() { return canvas.height / dpr; }
    function springRegionH(h) { return h * 0.4; }
    const GPAD = { l: 58, r: 24, t: 16, b: 34 };

    // ── Draw: spring-mass region ──
    function drawSpringMass(x, v, w, hTop) {
      const cx = w / 2;
      const cy = hTop / 2;
      const pxPerM = (w * 0.32) / 3.0; // fit amplitude range comfortably
      const massX = cx + x * pxPerM;
      const wallX = w * 0.08;
      const massSize = 26;

      // wall (hatched)
      ctx.strokeStyle = 'rgba(230,224,212,0.5)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(wallX, cy - 40); ctx.lineTo(wallX, cy + 40); ctx.stroke();
      ctx.lineWidth = 1;
      for (let i = -4; i <= 4; i++) {
        ctx.beginPath();
        ctx.moveTo(wallX, cy + i * 10);
        ctx.lineTo(wallX - 8, cy + i * 10 + 8);
        ctx.stroke();
      }

      // equilibrium dashed line
      ctx.beginPath();
      ctx.moveTo(cx, 10); ctx.lineTo(cx, hTop - 10);
      ctx.strokeStyle = 'rgba(138,122,101,0.5)';
      ctx.setLineDash([4,4]); ctx.lineWidth = 1;
      ctx.stroke(); ctx.setLineDash([]);

      // spring (zigzag from wall to mass)
      const coils = 10;
      const startX = wallX, endX = massX - massSize/2;
      const span = endX - startX;
      ctx.beginPath();
      ctx.moveTo(startX, cy);
      for (let i = 1; i < coils; i++) {
        const px = startX + (span * i) / coils;
        const py = cy + (i % 2 === 0 ? -12 : 12);
        ctx.lineTo(px, py);
      }
      ctx.lineTo(endX, cy);
      ctx.strokeStyle = 'rgba(230,224,212,0.55)';
      ctx.lineWidth = 1.6;
      ctx.stroke();

      // mass glow + block
      const g = ctx.createRadialGradient(massX, cy, 0, massX, cy, massSize * 1.8);
      g.addColorStop(0, 'rgba(91,141,239,0.5)');
      g.addColorStop(1, 'rgba(91,141,239,0)');
      ctx.beginPath(); ctx.arc(massX, cy, massSize * 1.8, 0, 2*Math.PI);
      ctx.fillStyle = g; ctx.fill();
      ctx.fillStyle = '#5B8DEF';
      ctx.fillRect(massX - massSize/2, cy - massSize/2, massSize, massSize);

      // velocity vector
      const vScale = 6;
      const vx = v * vScale;
      if (Math.abs(vx) > 1) {
        const tipX = massX + vx;
        ctx.beginPath();
        ctx.moveTo(massX, cy - massSize * 0.9);
        ctx.lineTo(tipX, cy - massSize * 0.9);
        ctx.strokeStyle = 'rgba(247,131,172,0.9)';
        ctx.lineWidth = 1.8;
        ctx.stroke();
        const dir = Math.sign(vx);
        ctx.beginPath();
        ctx.moveTo(tipX, cy - massSize * 0.9);
        ctx.lineTo(tipX - dir*7, cy - massSize * 0.9 - 4);
        ctx.lineTo(tipX - dir*7, cy - massSize * 0.9 + 4);
        ctx.closePath();
        ctx.fillStyle = 'rgba(247,131,172,0.9)';
        ctx.fill();
      }

      // amplitude tick marks
      ctx.fillStyle = 'rgba(255,209,102,0.85)';
      ctx.font = `${Math.max(10, w * 0.026)}px 'DM Mono', monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(`x = ${x.toFixed(2)} m`, massX, cy + massSize * 1.5 + 16);
    }

    // ── Draw: scrolling x(t) graph region ──
    function drawGraph(w, hTop, hGraph) {
      const offY = hTop;
      const gw = w, gh = hGraph;
      const xMax = state.A * 1.2 || 1;
      const tMin = Math.max(0, state.t - WINDOW);
      const tMax = tMin + WINDOW;

      function tPx(t) { return GPAD.l + ((t - tMin) / WINDOW) * (gw - GPAD.l - GPAD.r); }
      function xPx(x) { return offY + GPAD.t + (gh - GPAD.t - GPAD.b) * 0.5 - (x / xMax) * ((gh - GPAD.t - GPAD.b) * 0.5); }

      // background separator
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath(); ctx.moveTo(0, offY); ctx.lineTo(gw, offY); ctx.stroke();

      // grid
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 8; i++) {
        const t = tMin + (i/8) * WINDOW;
        const px = tPx(t);
        ctx.beginPath(); ctx.moveTo(px, offY + GPAD.t); ctx.lineTo(px, offY + gh - GPAD.b); ctx.stroke();
      }
      for (let i = -2; i <= 2; i++) {
        const x = (i/2) * xMax;
        const py = xPx(x);
        ctx.beginPath(); ctx.moveTo(GPAD.l, py); ctx.lineTo(gw - GPAD.r, py); ctx.stroke();
      }

      // axes
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(GPAD.l, offY + GPAD.t); ctx.lineTo(GPAD.l, offY + gh - GPAD.b);
      ctx.lineTo(gw - GPAD.r, offY + gh - GPAD.b);
      ctx.stroke();

      // equilibrium line
      ctx.beginPath();
      ctx.moveTo(GPAD.l, xPx(0)); ctx.lineTo(gw - GPAD.r, xPx(0));
      ctx.strokeStyle = 'rgba(138,122,101,0.6)';
      ctx.setLineDash([4,4]); ctx.lineWidth = 1;
      ctx.stroke(); ctx.setLineDash([]);

      // tick labels
      ctx.fillStyle = 'rgba(230,224,212,0.7)';
      ctx.font = `${Math.max(9, gw * 0.02)}px 'DM Mono', monospace`;
      ctx.textAlign = 'center';
      for (let i = 0; i <= 4; i++) {
        const t = tMin + (i/4) * WINDOW;
        ctx.fillText(t.toFixed(1) + 's', tPx(t), offY + gh - GPAD.b + 16);
      }
      ctx.textAlign = 'right';
      ctx.fillText(xMax.toFixed(1)+'m', GPAD.l - 8, xPx(xMax) + 3);
      ctx.fillText((-xMax).toFixed(1)+'m', GPAD.l - 8, xPx(-xMax) + 3);

      // trace
      const visible = state.trail.filter(p => p.t >= tMin);
      if (visible.length > 1) {
        ctx.beginPath();
        visible.forEach((p, i) => {
          const px = tPx(p.t), py = xPx(p.x);
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        });
        ctx.strokeStyle = '#4ECDC4';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      // current point marker
      const curX = xAt(state.t);
      const cpx = tPx(state.t), cpy = xPx(curX);
      ctx.beginPath(); ctx.arc(cpx, cpy, 4.5, 0, 2*Math.PI);
      ctx.fillStyle = '#5B8DEF'; ctx.fill();
    }

    function updateReadout() {
      const T = 2 * Math.PI / state.omega;
      const f = state.omega / (2 * Math.PI);
      const x = xAt(state.t), v = vAt(state.t), a = aAt(state.t);
      document.getElementById('rT').textContent    = T.toFixed(3) + ' s';
      document.getElementById('rf').textContent    = f.toFixed(3) + ' Hz';
      document.getElementById('rx').textContent    = x.toFixed(3) + ' m';
      document.getElementById('rv').textContent    = v.toFixed(3) + ' m/s';
      document.getElementById('ra').textContent    = a.toFixed(3) + ' m/s²';
      document.getElementById('rvmax').textContent = (state.A * state.omega).toFixed(3) + ' m/s';
      document.getElementById('ramax').textContent = (state.A * state.omega * state.omega).toFixed(3) + ' m/s²';
    }

    // ── Animation loop ──
    let last = null;
    function frame(ts) {
      _simRaf = requestAnimationFrame(frame);
      const dt = last ? Math.min((ts - last) / 1000, 0.05) : 0;
      last = ts;

      state.t += dt; // real time, since ω is already in rad/s

      const x = xAt(state.t);
      state.trail.push({ t: state.t, x });
      const cutoff = state.t - WINDOW - 1;
      while (state.trail.length && state.trail[0].t < cutoff) state.trail.shift();

      const w = W(), h = H();
      const hTop = springRegionH(h);
      const hGraph = h - hTop;

      ctx.clearRect(0, 0, w, h);
      drawSpringMass(x, vAt(state.t), w, hTop);
      drawGraph(w, hTop, hGraph);
      updateReadout();
    }
    _simRaf = requestAnimationFrame(frame);
  }
};


SIMS['kin-centrip'] = {
  title: "Centripetal Acceleration",
  subtitle: "Adjust the radius r and angular velocity ω — watch the tangential velocity and inward centripetal acceleration update in real time.",

  build(host) {
    const state = { r: 1.5, omega: 2.0, v: 3.0, theta: 0, trail: [], lock: 'none' };

    host.insertAdjacentHTML('beforeend', `
      <div class="sim-layout">
        <div class="sim-canvas-wrap"><canvas id="cent-canvas"></canvas></div>
        <div class="sim-panel">

          <div class="sim-equation">
            <div class="eq-label">Equation</div>
            <div class="eq-display">$$a_c = \\dfrac{v^2}{r} = r\\omega^2$$</div>
          </div>

          <div class="sim-controls">
            <h3>Variables</h3>
            <style>
              .cent-lock-row { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
              .cent-lock-btn {
                background: rgba(255,255,255,0.05);
                border: 1px solid rgba(255,255,255,0.15);
                color: rgba(230,224,212,0.75);
                border-radius: 6px;
                padding: 5px 10px;
                font-size: 0.78rem;
                font-family: 'DM Mono', monospace;
                cursor: pointer;
                transition: all .15s ease;
              }
              .cent-lock-btn:hover { border-color: rgba(255,209,102,0.5); }
              .cent-lock-btn.active {
                background: rgba(255,209,102,0.18);
                border-color: #FFD166;
                color: #FFD166;
              }
              .sim-slider-group input[disabled] { opacity: 0.35; cursor: not-allowed; }
            </style>
            <div class="cent-lock-row">
              <button type="button" class="cent-lock-btn active" data-lock="none">Free</button>
              <button type="button" class="cent-lock-btn" data-lock="r">Fix r</button>
              <button type="button" class="cent-lock-btn" data-lock="omega">Fix ω</button>
              <button type="button" class="cent-lock-btn" data-lock="v">Fix v</button>
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">r</span> — radius</span>
                <span class="sl-val" id="lr">1.50 m</span>
              </div>
              <input type="range" id="sr" min="0.5" max="4" step="0.05" value="1.5">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">ω</span> — angular velocity</span>
                <span class="sl-val" id="lomega">2.00 rad/s</span>
              </div>
              <input type="range" id="somega" min="0.2" max="6" step="0.1" value="2">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">v</span> — tangential speed</span>
                <span class="sl-val" id="lv">3.00 m/s</span>
              </div>
              <input type="range" id="sv" min="0.1" max="25" step="0.1" value="3">
            </div>
          </div>

          <div class="sim-readout">
            <h3>Live Readout</h3>
            <div class="readout-row"><span class="rkey">Centripetal accel. a_c</span><span class="rval hi" id="rac">—</span></div>
            <div class="readout-row"><span class="rkey">Tangential speed v</span><span class="rval" id="rv">—</span></div>
            <div class="readout-row"><span class="rkey">Radius r</span><span class="rval" id="rr">—</span></div>
            <div class="readout-row"><span class="rkey">Period T</span><span class="rval" id="rT">—</span></div>
            <div class="readout-row"><span class="rkey">Frequency f</span><span class="rval" id="rf">—</span></div>
          </div>

          <div class="sim-legend">
            <h3>Legend</h3>
            <div class="legend-row"><div class="legend-dot" style="background:#5B8DEF"></div>Orbiting object</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#4ECDC4;opacity:.6"></div>Circular path</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#8A7A65;border-top-style:dashed"></div>Radius r</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#FFD166"></div>Velocity v (tangential)</div>
            <div class="legend-row"><div class="legend-line" style="border-color:#F783AC"></div>Acceleration a_c (inward)</div>
          </div>
        </div>
      </div>`);

    renderMath();

    // ── Canvas ──
    const canvas = document.getElementById('cent-canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    function resize() {
      const sz = canvas.parentElement.clientWidth;
      canvas.width  = sz * dpr;
      canvas.height = sz * dpr;
      canvas.style.width  = sz + 'px';
      canvas.style.height = sz + 'px';
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
      state.trail = [];
    }
    resize();
    const _ro = new ResizeObserver(resize);
    _ro.observe(canvas.parentElement);

    // ── Sliders ──
    // r, ω, and v are linked by v = rω, so only two are ever truly independent.
    // Lock mode picks which variable stays fixed. Dragging one of the other two
    // recomputes the third; if that push would go out of range, it's clamped
    // and the slider you just dragged snaps back instead — so the locked
    // variable is always the one that never moves.
    const RANGE = { r: [0.5, 4], omega: [0.2, 6], v: [0.1, 25] };
    const SLIDER_ID = { r: 'sr', omega: 'somega', v: 'sv' };

    function clampVar(key, val) {
      const [lo, hi] = RANGE[key];
      return Math.min(Math.max(val, lo), hi);
    }
    function solveFor(target) {
      if (target === 'v')      state.v     = state.r * state.omega;
      else if (target === 'omega') state.omega = state.v / state.r;
      else if (target === 'r')     state.r     = state.v / state.omega;
    }

    function refreshLabels() {
      const lockMark = key => state.lock === key ? '🔒 ' : '';
      document.getElementById('lr').textContent     = lockMark('r')     + state.r.toFixed(2) + ' m';
      document.getElementById('lomega').textContent = lockMark('omega') + state.omega.toFixed(2) + ' rad/s';
      document.getElementById('lv').textContent     = lockMark('v')     + state.v.toFixed(2) + ' m/s';
      document.getElementById('sr').value     = state.r;
      document.getElementById('somega').value = state.omega;
      document.getElementById('sv').value     = state.v;
    }

    function applyLockUI() {
      Object.keys(SLIDER_ID).forEach(key => {
        document.getElementById(SLIDER_ID[key]).disabled = (state.lock === key);
      });
      document.querySelectorAll('.cent-lock-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lock === state.lock);
      });
    }

    function applySync(draggedKey) {
      state[draggedKey] = parseFloat(document.getElementById(SLIDER_ID[draggedKey]).value);

      if (state.lock === 'none') {
        if (draggedKey === 'v') {
          state.omega = clampVar('omega', state.v / state.r);   // r acts as the default anchor
          solveFor('v');                                         // resnap v to the achievable value
        } else {
          solveFor('v');
        }
      } else if (state.lock !== draggedKey) {
        const otherKey = ['r', 'omega', 'v'].find(k => k !== state.lock && k !== draggedKey);
        solveFor(otherKey);
        const clamped = clampVar(otherKey, state[otherKey]);
        if (clamped !== state[otherKey]) {
          state[otherKey] = clamped;
          solveFor(draggedKey);   // snap the dragged value back, keep the locked one exact
        }
      }

      refreshLabels();
      state.trail = [];
    }

    document.getElementById('sr').addEventListener('input', () => applySync('r'));
    document.getElementById('somega').addEventListener('input', () => applySync('omega'));
    document.getElementById('sv').addEventListener('input', () => applySync('v'));

    document.querySelectorAll('.cent-lock-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.lock = btn.dataset.lock;
        applyLockUI();
        refreshLabels();
      });
    });
    applyLockUI();

    // ── Geometry ──
    function sz() { return canvas.width / dpr; }
    function mPx(m) { return m * (sz() * 0.5 / 4.6); }   // scale: 4.6 m fits canvas half-width

    function objectPos(theta) {
      const x = sz()/2 + mPx(state.r) * Math.cos(theta);
      const y = sz()/2 - mPx(state.r) * Math.sin(theta);
      return { x, y, theta };
    }

    function speed()   { return state.v; }
    function accel()   { return state.r * state.omega * state.omega; }

    // ── Draw ──
    function draw(pos) {
      const S = sz();
      ctx.clearRect(0, 0, S, S);

      // subtle grid
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      const step = mPx(0.5);
      for (let x = (S/2) % step; x < S; x += step) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,S); ctx.stroke(); }
      for (let y = (S/2) % step; y < S; y += step) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(S,y); ctx.stroke(); }

      // circular path
      ctx.beginPath();
      ctx.arc(S/2, S/2, mPx(state.r), 0, 2*Math.PI);
      ctx.strokeStyle = 'rgba(78,205,196,0.35)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // radius line
      ctx.beginPath();
      ctx.moveTo(S/2, S/2);
      ctx.lineTo(pos.x, pos.y);
      ctx.strokeStyle = 'rgba(138,122,101,0.55)';
      ctx.setLineDash([4,4]); ctx.lineWidth = 1;
      ctx.stroke(); ctx.setLineDash([]);
      const rmx = (S/2 + pos.x)/2, rmy = (S/2 + pos.y)/2;
      ctx.fillStyle = 'rgba(138,122,101,0.9)';
      ctx.font = `${Math.max(10, S*0.032)}px 'DM Mono', monospace`;
      ctx.textAlign = 'center';
      ctx.fillText('r', rmx, rmy - 7);

      // trail
      if (state.trail.length > 1) {
        ctx.beginPath();
        ctx.moveTo(state.trail[0].x, state.trail[0].y);
        for (let i = 1; i < state.trail.length; i++) ctx.lineTo(state.trail[i].x, state.trail[i].y);
        ctx.strokeStyle = 'rgba(91,141,239,0.3)';
        ctx.lineWidth = 1.5;
        ctx.lineJoin = 'round';
        ctx.stroke();
      }

      // center marker
      ctx.beginPath();
      ctx.moveTo(S/2 - 7, S/2); ctx.lineTo(S/2 + 7, S/2);
      ctx.moveTo(S/2, S/2 - 7); ctx.lineTo(S/2, S/2 + 7);
      ctx.strokeStyle = 'rgba(230,224,212,0.7)';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // object glow + disc
      const objR = Math.max(6, S * 0.02);
      const g = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, objR*3);
      g.addColorStop(0, 'rgba(91,141,239,0.55)');
      g.addColorStop(1, 'rgba(91,141,239,0)');
      ctx.beginPath(); ctx.arc(pos.x, pos.y, objR*3, 0, 2*Math.PI);
      ctx.fillStyle = g; ctx.fill();
      ctx.beginPath(); ctx.arc(pos.x, pos.y, objR, 0, 2*Math.PI);
      ctx.fillStyle = '#5B8DEF'; ctx.fill();

      // velocity vector (tangential, gold)
      const v = speed();
      const vScale = Math.max(18, S * 0.09);
      const vAng = pos.theta + Math.PI/2;
      const vtx = pos.x + Math.cos(vAng) * vScale;
      const vty = pos.y - Math.sin(vAng) * vScale;
      drawArrow(pos.x, pos.y, vtx, vty, '#FFD166');
      ctx.fillStyle = 'rgba(255,209,102,0.9)';
      ctx.textAlign = 'center';
      ctx.fillText(`v = ${v.toFixed(2)} m/s`, vtx + Math.cos(vAng)*20, vty - Math.sin(vAng)*20);

      // acceleration vector (centripetal, inward, pink)
      const aScale = Math.max(16, S * 0.08);
      const aAngRad = pos.theta + Math.PI; // points toward center
      const atx = pos.x + Math.cos(aAngRad) * aScale;
      const aty = pos.y - Math.sin(aAngRad) * aScale;
      drawArrow(pos.x, pos.y, atx, aty, '#F783AC');
      ctx.fillStyle = 'rgba(247,131,172,0.9)';
      ctx.fillText(`a_c = ${accel().toFixed(2)} m/s²`, atx + Math.cos(aAngRad)*22, aty - Math.sin(aAngRad)*22 - 6);

      // period label top-left
      const T = 2 * Math.PI / state.omega;
      ctx.fillStyle = 'rgba(78,205,196,0.9)';
      ctx.textAlign = 'left';
      ctx.fillText(`T = ${T.toFixed(3)} s`, S*0.04, S*0.07);
    }

    function drawArrow(x0, y0, x1, y1, color) {
      const ang = Math.atan2(y1 - y0, x1 - x0);
      const hl = 7;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
      ctx.strokeStyle = color; ctx.lineWidth = 1.8; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x1 - hl*Math.cos(ang-0.42), y1 - hl*Math.sin(ang-0.42));
      ctx.lineTo(x1 - hl*Math.cos(ang+0.42), y1 - hl*Math.sin(ang+0.42));
      ctx.closePath(); ctx.fillStyle = color; ctx.fill();
    }

    function updateReadout() {
      const T = 2 * Math.PI / state.omega;
      const f = state.omega / (2 * Math.PI);
      document.getElementById('rac').textContent = accel().toFixed(3) + ' m/s²';
      document.getElementById('rv').textContent  = speed().toFixed(3) + ' m/s';
      document.getElementById('rr').textContent  = state.r.toFixed(3) + ' m';
      document.getElementById('rT').textContent  = T.toFixed(3) + ' s';
      document.getElementById('rf').textContent  = f.toFixed(3) + ' Hz';
    }

    // ── Animation loop ──
    let last = null;
    function frame(ts) {
      _simRaf = requestAnimationFrame(frame);
      const dt = last ? Math.min((ts - last) / 1000, 0.05) : 0;
      last = ts;

      state.theta = (state.theta + state.omega * dt) % (2 * Math.PI);

      const pos = objectPos(state.theta);
      state.trail.push({ x: pos.x, y: pos.y });
      if (state.trail.length > 230) state.trail.shift();

      draw(pos);
      updateReadout();
    }
    _simRaf = requestAnimationFrame(frame);
  }
};


SIMS['dyn-buo'] = {
  title: "Buoyancy Force",
  subtitle: "Adjust fluid density ρ, gravity g, and the object's own density — watch it sink, float, or settle at equilibrium depending on whether the forces balance.",

  build(host) {
    const state = { rho: 1000, g: 9.8, rhoObj: 600, heightAboveFloor: 2.3, vel: 0 };
    const OBJ_H = 2.2;     // object's total physical height (m)
    const OBJ_W = 1.0;     // object's physical width (m) — fixed at 1 m so submerged
                           // depth (m) numerically equals submerged volume (m³) for a 1 m² cross-section
    const TANK_H = 4.6;    // tank physical height (m)
    const TANK_W = 2.6;    // tank physical width (m)
    const WATERLINE_FROM_BOTTOM = 2.3; // m — kept fixed (displacement doesn't raise the water level here)
    const DAMPING = 0.988; // velocity decay per frame, so it settles instead of bobbing forever

    host.insertAdjacentHTML('beforeend', `
      <div class="sim-layout">
        <div class="sim-canvas-wrap"><canvas id="buoy-canvas"></canvas></div>
        <div class="sim-panel">

          <div class="sim-equation">
            <div class="eq-label">Equation</div>
            <div class="eq-display">$$F_B = \\rho g V$$</div>
            <div style="font-size:0.75rem;opacity:0.6;margin-top:6px;">
              Submerged volume V is no longer set directly — it's whatever depth makes F_B balance the object's weight.
              Net force F_net = F_B − mg drives real motion: the box sinks, floats, or settles depending on ρ_obj vs. ρ.
            </div>
          </div>

          <div class="sim-controls">
            <h3>Variables</h3>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">ρ</span> — fluid density</span>
                <span class="sl-val" id="lrho">1000 kg/m³</span>
              </div>
              <input type="range" id="srho" min="500" max="2000" step="10" value="1000">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">g</span> — gravity</span>
                <span class="sl-val" id="lg">9.80 m/s²</span>
              </div>
              <input type="range" id="sg" min="1" max="20" step="0.1" value="9.8">
            </div>
            <div class="sim-slider-group">
              <div class="sl-header">
                <span class="sl-name"><span class="sl-sym">ρ_obj</span> — object density</span>
                <span class="sl-val" id="lrhoObj">600 kg/m³</span>
              </div>
              <input type="range" id="srhoObj" min="100" max="2200" step="10" value="600">
            </div>
          </div>

          <div class="sim-readout">
            <h3>Live Readout</h3>
            <div class="readout-row"><span class="rkey">State</span><span class="rval hi" id="rstate">—</span></div>
